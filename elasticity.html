    ctx.globalAlpha=.7;ctx.beginPath();ctx.ellipse(6.6,-2,2.6,1.5,-.44,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;}
  else{circ(-1.2,-1,10.4,hair);circ(1.2,1.4,9.4,SKIN);
    ctx.beginPath();ctx.moveTo(-9.6,-2);ctx.quadraticCurveTo(-3,-11,6,-7);ctx.quadraticCurveTo(9,-6,10,-3);ctx.quadraticCurveTo(4,-6,-2,-4);ctx.quadraticCurveTo(-6,-2,-9.6,-2);ctx.fillStyle=hair;ctx.fill();
    ctx.beginPath();ctx.ellipse(-7.6,2.4,1.9,2.6,0,0,TAU);ctx.fillStyle=dk(SKIN,.92);ctx.fill();
    circ(5.2,.4,1.4,INK);ctx.beginPath();ctx.moveTo(3.4,5.4);ctx.quadraticCurveTo(6,7.4,8.8,5);ctx.lineWidth=1.2;ctx.strokeStyle=INK;ctx.stroke();}
  ctx.restore();
  if(opt.tail&&!su){const bx=hc[0]-8*Math.cos(ha),by=hc[1]-8*Math.sin(ha)-1;ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx-9,by+1,bx-9,by+11);ctx.quadraticCurveTo(bx-9,by+17,bx-12,by+22);ctx.quadraticCurveTo(bx-4,by+20,bx-2,by+12);ctx.quadraticCurveTo(bx,by+4,bx+2,by+3);ctx.fillStyle=hair;ctx.fill();}
  ctx.restore();
}
/* 우주인 (발 가운데가 (x,y)). 키 약 100*s. pose 는 위 drawHuman 과 같다 */
function astro(ctx,x,y,s,tint,pose,flip){drawHuman(ctx,x,y,s,pose,{suit:tint||CE,flip});}
/* 천체 그리기 (원 + 연한 색 바탕) */
function body(ctx,x,y,r,col,tint){
  ctx.save();ctx.fillStyle=tint;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.stroke();
  ctx.globalAlpha=.3;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x-r*.28,y-r*.2,r*.28,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(x+r*.32,y+r*.3,r*.2,0,TAU);ctx.fill();ctx.restore();
}

/* ───────── 탄성력 단원 도우미 ───────── */
/* 색의 의미(이 단원): 주황 CG = 탄성력 · 파랑 CM = 손이 작용하는 힘 · 청록 CE = 용수철·고무 띠(탄성체) · 보라 CP = 중력(가상 용수철저울에서만) */
const WALLC='#8FA7A1',SKINC='#F1C9A5',SKIND='#C9A27E';
/* 나선형 코일 용수철 — figs.py 의 art.coil 과 같은 수식. (x1,y1)→(x2,y2) 축, r=코일 반지름, turns=감긴 수.
   길이를 바꿔도 감긴 수(turns)는 그대로 두고 간격만 변하게 쓴다(같은 용수철이므로). */
function coilGen(ctx,x1,y1,x2,y2,r,turns,col,w,tilt){
  const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;
  const ax=(x2-x1)/L,ay=(y2-y1)/L,nx=-ay,ny=ax,lead=Math.min(r*1.1,L*.12),ry=r*(tilt==null?.32:tilt);
  const N=Math.max(24,Math.round(turns*20)),pts=[];
  for(let i=0;i<=N;i++){const t=Math.PI/2+TAU*turns*i/N,al=lead+(L-2*lead)*i/N+ry*Math.sin(t),cr=r*Math.cos(t);
    pts.push([x1+ax*al+nx*cr,y1+ay*al+ny*cr,Math.sin(t)>=0]);}
  col=col||CE;w=w||5;
  const run=(front,c,lw,al,dy)=>{ctx.save();ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.globalAlpha=al;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();let on=false;for(const p of pts){if(p[2]===front){on?ctx.lineTo(p[0],p[1]+dy):ctx.moveTo(p[0],p[1]+dy);on=true;}else on=false;}ctx.stroke();ctx.restore();};
  run(false,col,w*.8,.5,0);run(true,col,w,1,0);run(true,'#fff',w*.32,.34,-w*.12);
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x1,y1);ctx.lineTo(pts[0][0],pts[0][1]);ctx.moveTo(pts[N][0],pts[N][1]);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
/* 가로 용수철 (x1 → x2, 높이 y, 감긴 수 n, 반지름 amp) */
function coilH(ctx,x1,x2,y,n,amp,col,lw){coilGen(ctx,x1,y,x2,y,amp,n,col,lw);}
/* 세로 용수철 (y1 → y2, 가운데 x) */
function coilV(ctx,x,y1,y2,n,amp,col,lw){coilGen(ctx,x,y1,x,y2,amp,n,col,lw);}
/* 사람 손 — figs.py(art.py)가 그린 SVG 를 이미지로 불러와 그린다 (학습지와 같은 손).
   kind: 'grip' 주먹으로 손잡이 쥠 · 'palm' 손바닥으로 밀기 · 'point' 검지로 누르기.
   (x,y) 에 기준점(grip=손잡이 가운데, palm=손바닥 닿는 곳, point=검지 끝)이 오도록 놓는다. s=배율(1≈그림 단위 1px), rot=각도(도) */
const _HIMG={};
function drawHand(ctx,kind,x,y,s,rot,flip){
  let h=_HIMG[kind];
  if(!h){const d=FIG_HANDS[kind],im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(d.svg);h=_HIMG[kind]={im,d};}
  if(!h.im.complete||!h.im.naturalWidth)return;
  const d=h.d;ctx.save();ctx.translate(x,y);ctx.rotate((rot||0)*Math.PI/180);ctx.scale(flip?-s:s,s);ctx.drawImage(h.im,-d.ax,-d.ay,d.w,d.h);ctx.restore();
}
/* 손잡이(세로 막대) */
function handle(ctx,x,y,len,wid){ctx.save();ctx.fillStyle='#2B3B3A';rr(ctx,x-(wid||8)/2,y-len/2,wid||8,len,(wid||8)/2);ctx.fill();ctx.restore();}
/* 볼펜 (figs.py 의 pen_inner 와 같은 숫자). (x,T)=몸통 위끝 가운데, s=배율, d=심이 내려간 길이(0~36), db=버튼이 내려간 길이 */
const PEN_BARREL='M-44 22 Q-44 0 -22 0 L22 0 Q44 0 44 22 L44 290 C44 332 12 352 9 392 L-9 392 C-12 352 -44 332 -44 290 Z',PEN_D=36;
function penDraw(ctx,x,T,s,d,db){
  db=db==null?d:db;const by=-40+db,coly=125+d,tip=380+d,B=new Path2D(PEN_BARREL);
  ctx.save();ctx.translate(x,T);ctx.scale(s,s);
  ctx.fillStyle='#F1F8F6';ctx.fill(B);
  ctx.save();ctx.clip(B);ctx.fillStyle='#BFD9D3';ctx.fillRect(-50,318,100,8);ctx.fillRect(-50,336,100,5);ctx.restore();
  ctx.fillStyle='#2B3B3A';rr(ctx,-40,300,26,10,3);ctx.fill();rr(ctx,14,300,26,10,3);ctx.fill();
  coilV(ctx,0,coly+9,300,13,25,CE,5.4);
  ctx.strokeStyle='#6B7A82';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,by+60);ctx.lineTo(0,tip-28);ctx.stroke();
  ctx.fillStyle='#C3CCD0';ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-5.5,tip-30);ctx.lineTo(5.5,tip-30);ctx.lineTo(2,tip-4);ctx.lineTo(-2,tip-4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,tip-1,3.6,0,TAU);ctx.fillStyle='#8A969B';ctx.fill();ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle='#2B3B3A';rr(ctx,-15,coly,30,9,3);ctx.fill();
  ctx.strokeStyle='#41555A';ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke(B);
  rr(ctx,40,14,12,150,6);ctx.fillStyle='#D5DEE0';ctx.fill();ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#2B3B3A';rr(ctx,-25,by,50,62,12);ctx.fill();ctx.globalAlpha=.28;ctx.fillStyle='#fff';rr(ctx,-17,by+7,6,34,3);ctx.fill();
  ctx.restore();
}
/* 벽(왼쪽 고정 장치) */
function wallC(ctx,x,y,h,w){ctx.save();ctx.fillStyle=WALLC;rr(ctx,x,y,w||16,h,5);ctx.fill();ctx.restore();}
/* 점선 */
function dashV(ctx,x,y1,y2,col,lw){ctx.save();ctx.strokeStyle=col||SUBC;ctx.lineWidth=lw||2.5;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();ctx.restore();}
function dashH(ctx,x1,x2,y,col,lw){ctx.save();ctx.strokeStyle=col||SUBC;ctx.lineWidth=lw||2.5;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();}
/* 힘 센서 상자 (읽는 값 표시) */
function sensorBox(ctx,x,y,w,h,val){
  ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=5;rr(ctx,x,y,w,h,12);ctx.fill();ctx.stroke();ctx.restore();
  txt(ctx,val,x+w/2,y+h/2+2,Math.min(38,h*.5),CG,'center',900);
}

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  슬라이드의 anim:'이름' 과 연결.
   단계(o.phase) = 슬라이드의 '공개한 빈칸 번호'. 자습 모드에서도 같은 규칙이므로 단계 = 빈칸 번호로 설계했다.
   색: 주황 = 탄성력 · 파랑 = 손이 작용하는 힘 · 청록 = 용수철/고무 띠 (학습지와 같음)
   용수철은 항상 같은 감긴 수(turns)로 그려서, 늘이거나 누르면 간격만 변한다(같은 용수철이므로). */

/* 표지(짙은 바탕): 용수철 위에서 통통 튀는 공 */
ANIMS.cover=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
    const gy=H-150;
    ctx.fillStyle='#CFE9E3';rr(ctx,40,gy+6,W-80,16,8);ctx.fill();
    [[.26,0,'#fff',26],[.52,1.1,YEL,34],[.78,2.2,'#7FD1C3',22]].forEach(([fx,off,c,r])=>{
      const T=1.7,tt=((t+off)%T)/T,h=250*Math.abs(Math.sin(Math.PI*tt));      // 공이 스프링 위에서 올라간 높이
      const Ls=96-46*Math.max(0,1-h/46),x=W*fx;
      coilV(ctx,x,gy-Ls,gy,8,18,'#CFE9E3',6);
      ctx.fillStyle='#CFE9E3';rr(ctx,x-34,gy-Ls-8,68,10,5);ctx.fill();
      ball(ctx,x,gy-Ls-8-r-h,r,c);
    });
  };
};

/* 이름표 줄: 알약 이름표(고정 너비) + 설명 글. 모두 같은 x 에서 왼쪽 정렬한다. 설명이 길면 글자 크기를 줄여 캔버스 안에 넣는다 */
function defRow(o,k,x0,y,label,desc,fill){
  if(o.phase<k)return;const {ctx,W}=o,a=P(o,k,.6),pw=128,tx=x0+pw+16;
  let fs=27;ctx.save();ctx.font=`700 ${fs}px Pretendard,sans-serif`;const w0=ctx.measureText(desc).width,room=W-tx-14;if(w0>room)fs=Math.floor(fs*room/w0);ctx.restore();
  ctx.save();ctx.globalAlpha=a;ctx.translate((1-a)*-26,0);
  rr(ctx,x0,y-27,pw,54,27);ctx.fillStyle=fill;ctx.fill();
  txt(ctx,label,x0+pw/2,y+1,30,'#fff','center',900);
  txt(ctx,desc,tx,y+1,fs,INK,'left',700);
  ctx.restore();
}
/* 탄성체 예 : 용수철 · 고무줄 · 고무 띠 (모두 직접 그린 그림) */
function elasticThings(ctx,x,y,sp){sp=sp||170;
  // 용수철
  coilV(ctx,x,y-52,y+44,9,18,CE,5.4);
  // 고무줄(둥근 고무 고리): 겉 윤곽 + 안쪽 하이라이트
  const gx=x+sp;ctx.save();ctx.lineWidth=11;ctx.strokeStyle='#C0452A';ctx.beginPath();ctx.ellipse(gx,y-4,48,31,0,0,TAU);ctx.stroke();
  ctx.lineWidth=3.2;ctx.strokeStyle='#F08A6C';ctx.beginPath();ctx.ellipse(gx,y-6,45,27,0,Math.PI*1.05,Math.PI*1.85);ctx.stroke();ctx.restore();
  // 고무 띠(납작한 띠를 둥글게 이은 것)
  const hx=x+sp*2;ctx.save();ctx.lineJoin='round';
  rr(ctx,hx-46,y-34,92,64,30);ctx.lineWidth=17;ctx.strokeStyle='#B9791C';ctx.stroke();
  rr(ctx,hx-46,y-34,92,64,30);ctx.lineWidth=12;ctx.strokeStyle='#F1B94F';ctx.stroke();
  rr(ctx,hx-46,y-34,92,64,30);ctx.lineWidth=3;ctx.strokeStyle='#FFE3A6';ctx.setLineDash([26,200]);ctx.stroke();ctx.restore();
  txt(ctx,'용수철',x,y+84,26,INK,'center',800);txt(ctx,'고무줄',gx,y+84,26,INK,'center',800);txt(ctx,'고무 띠',hx,y+84,26,INK,'center',800);
}

/* STAGE 1 : 볼펜 속 용수철.  단계: 1 변형 · 2 탄성 · 3 탄성력 · 4 탄성체
   딸깍 볼펜: ① 버튼을 누르면 심이 나오고 용수철이 줄어든다(걸쇠가 고정) ② 한 번 더 누르면 걸쇠가 풀려, 줄어든 용수철이 원래 길이로 되돌아가며 심을 몸통 안으로 민다 */
ANIMS.pen=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const cyc=6.2,tt=t%cyc,sg=(a,b)=>ease((tt-a)/(b-a));
    const LF=34;let k=0,f=LF,e=0;                          // k 심이 나온 정도(0~1) · f 손가락이 떠 있는 높이 · e 두 번째로 더 누르는 정도
    if(tt<.6){f=LF*(1-sg(0,.6));}
    else if(tt<1.3){f=0;k=sg(.6,1.3);}
    else if(tt<1.9){k=1;f=LF*sg(1.3,1.9);}
    else if(tt<3.3){k=1;f=LF;}
    else if(tt<3.9){k=1;f=LF*(1-sg(3.3,3.9));}
    else if(tt<4.2){k=1;f=0;e=sg(3.9,4.2);}
    else if(tt<5.0){const q=sg(4.2,5.0);k=1-q;e=1-q;f=LF*q;}
    const x=Math.max(128,W*.165),T=168,s=1,d=PEN_D*k,db=d+8*e;
    penDraw(ctx,x,T,s,d,db);
    // 손가락(버튼 위에서 누른다)
    if(f<LF-1||e>0)drawHand(ctx,'point',x,T-40+db-2-f,.74,0,false);
    // 1 변형: 용수철의 처음 길이(점선)와 눌린 길이
    const sy=T+125+9;
    if(o.phase>=1){const a=P(o,1,.6);ctx.save();ctx.globalAlpha=a;
      dashH(ctx,x-92,x+62,sy,CE,3);txt(ctx,'처음 길이',x-54,sy-16,22,CE,'right',800);ctx.restore();}
    // 3 탄성력: 눌린 용수철이 심을 위로 미는 화살표 (눌린 만큼 길어진다)
    if(o.phase>=3&&k>.05){const a=P(o,3,.6),L=16+80*k,ax=x-76;ctx.save();ctx.globalAlpha=a;
      arrow(ctx,ax,sy+d+L,ax,sy+d,CG,10,24);ctx.restore();}
    // 오른쪽 : 이름표 목록 (모두 왼쪽 정렬)
    const x0=x+150;
    defRow(o,1,x0,120,'변형','모양이 달라지는 것',CE);
    defRow(o,2,x0,204,'탄성','원래 모양으로 되돌아가려는 성질',CM);
    defRow(o,3,x0,288,'탄성력','원래 모양으로 되돌아가려는 힘',CG);
    defRow(o,4,x0,372,'탄성체','탄성을 가지는 물체','#14574D');
    if(o.phase>=4){const a=P(o,4,.7),sp=Math.min(170,(W-x0-120)/2.1);ctx.save();ctx.globalAlpha=a;elasticThings(ctx,x0+50,486,sp);ctx.restore();}
    if(o.phase===0){txt(ctx,'볼펜 버튼을 누르고,',x0,140,30,INK,'left',800);txt(ctx,'한 번 더 눌러 보면?',x0,186,30,INK,'left',800);
      txt(ctx,'심이 나왔다가 들어가는 까닭은?',x0,244,30,CE,'left',800);}
    // 상태 설명 (볼펜 아래 작은 글)
    const msg=e>0||(k<1&&k>0&&tt>4)?'한 번 더 누르면 걸쇠가 풀린다':(k>.98?'심이 나오고 용수철이 줄어든다':(k>0?'버튼을 누른다':'처음 : 용수철이 원래 길이'));
    txt(ctx,msg,16,T+392+62,23,SUBC,'left',700);
  };
};

/* STAGE 2 : 탄성력의 방향과 크기.  단계: 1 되돌아가려는 · 2 반대 · 3 크다
   같은 용수철이므로 같은 길이만큼 늘이거나 눌렀을 때 화살표의 길이가 같다. */
ANIMS.sdir=o=>{
  o.d.cyc=-1;o.d.amp=.7;o.d.hx=0;
  /* 한 주기(6.6초): 손으로 당기거나 밀기(0~1.7) → 잡고 있기(~3.0) → 손을 놓는다: 용수철이 탄성력으로 원래 길이로 되돌아가며
     진동하다 멈춘다(감쇠 진동) → 쉼. 손을 놓은 뒤에는 '손이 작용하는 힘'이 없고 탄성력만 남는다. */
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const T=7.4,cyc=Math.floor(t/T),tc=t-cyc*T;
    if(cyc!==o.d.cyc){o.d.cyc=cyc;o.d.amp=o.phase>=3?(cyc%2?.4:1):.75;}
    const A=o.d.amp,TP=1.7,TH=3.0;
    let s,held=true;                                                     // s : 변형 정도(부호 있음. + = 처음 변형한 쪽)
    if(tc<TP){const u=tc/TP;s=A*(.5-.5*Math.cos(Math.PI*u));}
    else if(tc<TH){s=A;}
    else{held=false;const u=tc-TH;s=A*Math.exp(-1.9*u)*Math.cos(3.8*u);if(u>2.6)s=0;}
    const hA=held?1:Math.max(0,1-(tc-TH)/.35);                           // 손을 놓으면 손이 서서히 사라진다
    if(held)o.d.hx=s;
    const DM=Math.min(96,W*.11),KA=1.3;                                  // DM = 가장 많이 변형했을 때의 길이(px), KA = 변형 1px 당 화살표 길이
    const rows=[{y0:4,dir:1,name:'용수철을 당길 때',tint:TINT_E},{y0:222,dir:-1,name:'용수철을 누를 때',tint:TINT_M}];
    rows.forEach(r=>{
      const cy=r.y0+112,wx=36,L0=wx+16+Math.min(330,W*.36);                       // L0 = 용수철의 원래 길이가 끝나는 곳
      ctx.save();ctx.fillStyle=r.tint;rr(ctx,8,r.y0,W-16,212,18);ctx.fill();ctx.restore();
      txt(ctx,r.name,28,r.y0+28,25,INK,'left',900);
      const dx=s*DM,ex=L0+r.dir*dx,La=Math.abs(dx)*KA;                      // dx<0 : 반대쪽으로 지나쳐 변형(진동)
      wallC(ctx,wx,cy-50,100);coilH(ctx,wx+16,ex,cy,13,17,CE,5.6);
      dashV(ctx,L0,r.y0+30,cy+86,SUBC,2.5);txt(ctx,'원래 길이',L0,r.y0+17,20,SUBC,'center',700);
      if(!held&&tc<TH+2.6)txt(ctx,'손을 놓았다 : 탄성력만 작용한다',28,r.y0+52,21,CG,'left',800);
      const hxp=L0+r.dir*o.d.hx*DM;                                          // 손의 위치 : 놓는 순간의 자리에 머문다
      if(r.dir>0){handle(ctx,ex,cy,58,8);if(hA>0){ctx.save();ctx.globalAlpha=hA;drawHand(ctx,'grip',held?ex:hxp,cy,.85,0,false);ctx.restore();}}
      else{handle(ctx,ex,cy,68,9);if(hA>0){ctx.save();ctx.globalAlpha=hA;drawHand(ctx,'palm',(held?ex:hxp)+7,cy+3,.85,0,false);ctx.restore();}}
      // 손이 작용하는 힘(파랑, 위): 손으로 잡고 있을 때만. 탄성력(주황, 아래): 항상 원래 길이 쪽(진동 중에는 방향이 바뀐다)
      const sgn=dx>=0?1:-1;
      if(held&&La>8){const tail=ex+4,head=ex+4+r.dir*La;arrow(ctx,tail,cy-62,head,cy-62,CM,13,30);
        (r.dir>0?txt(ctx,'손이 작용하는 힘',Math.max(tail,head)+12,cy-62,20,CM,'left',800):txt(ctx,'손이 작용하는 힘',Math.max(tail,L0)+14,cy-62,20,CM,'left',800));}
      const a=Math.max(P(o,1,.6),o.phase>1?1:0);
      if(a>0&&La>8){const dirF=-r.dir*sgn,tail=ex-2,head=ex-2+dirF*La;ctx.save();ctx.globalAlpha=a;arrow(ctx,tail,cy+68,head,cy+68,CG,13,30);
        (r.dir>0?txt(ctx,'탄성력',Math.max(tail,head)+12,cy+68,20,CG,'left',800):txt(ctx,'탄성력',Math.min(tail,head)-12,cy+68,20,CG,'right',800));ctx.restore();}
    });
    // 아래 설명 : 왼쪽 정렬
    const lx=46,line=(k,y,col,s2)=>{if(o.phase<k)return;const a=P(o,k,.5);ctx.save();ctx.globalAlpha=a;
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(lx-18,y,10,0,TAU);ctx.fill();txt(ctx,s2,lx,y+1,28,INK,'left',800);ctx.restore();};
    if(o.phase===0)txt(ctx,'용수철을 당기거나 누르면 용수철은 어떻게 할까?',lx-18,480,28,INK,'left',800);
    line(1,480,CG,'탄성력 : 원래 모양으로 되돌아가려는 방향');
    line(2,532,CG,'손이 작용하는 힘의 방향과 반대 방향');
    line(3,584,YEL,'많이 변형할수록 탄성력도 크다 (화살표 길이)');
  };
};

/* 활동 : 용수철 놀이터 — 손잡이를 끌어 늘이거나 누른다. 놓으면 원래 길이로 돌아간다(탄성).
   같은 용수철이므로 늘인 길이와 누른 길이가 같으면 탄성력의 크기(0.1 N/cm × 변형된 길이)도 같다. */
ANIMS.play=o=>{
  o.d.v=0;o.d.vel=0;o.d.drag=false;o.d.last=0;o.d.ha=1;o.d.hv=0;o.d.rest=0;o.d.kind='grip';
  o.cv.style.cursor='ew-resize';o.cv.style.touchAction='none';o.cv.onclick=e=>e.stopPropagation();
  const wx=56,NATCM=8,MAXS=10,MAXC=5,pc=Math.min(60,(o.W-wx-16-300)/(NATCM+MAXS)),L0=wx+16+NATCM*pc,HS=Math.min(1.4,pc/42);
  const setV=e=>{const r=o.cv.getBoundingClientRect(),px=(e.clientX-r.left)*o.W/r.width;
    o.d.v=clamp((px-12-L0)/pc,-MAXC,MAXS);o.d.vel=0;};
  o.cv.onpointerdown=e=>{e.stopPropagation();o.d.drag=true;try{o.cv.setPointerCapture(e.pointerId);}catch(_){}setV(e);};
  o.cv.onpointermove=e=>{if(o.d.drag)setV(e);};
  const up=()=>{if(o.d.drag){o.d.drag=false;o.d.hv=o.d.v;o.d.kind=o.d.v>=0?'grip':'palm';o.d.rest=0;}};o.cv.onpointerup=up;o.cv.onpointercancel=up;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=Math.min(.04,t-o.d.last);o.d.last=t;
    if(!o.d.drag){o.d.vel+=(-25*o.d.v-4.4*o.d.vel)*dt;o.d.v+=o.d.vel*dt;o.d.v=clamp(o.d.v,-MAXC,MAXS);if(Math.abs(o.d.v)<.01&&Math.abs(o.d.vel)<.05){o.d.v=0;o.d.vel=0;}}
    // 손: 잡고 있는 동안은 손잡이를 따라가고, 놓으면 그 자리에 남아 사라진다. 용수철이 멈춘 뒤에는 다시 손잡이 쪽에 나타난다.
    if(o.d.drag){o.d.ha=1;o.d.rest=0;}
    else if(o.d.v===0&&o.d.vel===0){o.d.rest+=dt;if(o.d.rest>.5){o.d.ha=Math.min(1,o.d.ha+dt*3);o.d.hv=0;o.d.kind='grip';}}
    else o.d.ha=Math.max(0,o.d.ha-dt*3);
    const x=o.d.v,cy=H*.30,ex=L0+x*pc,m=Math.abs(x),F=.1*m,KA=300;           // 탄성력 F(N) = 0.1 N/cm × 변형된 길이
    wallC(ctx,wx,cy-80,160);coilH(ctx,wx+16,ex,cy,15,Math.min(32,pc*.55),CE,Math.min(9,pc*.15));
    dashV(ctx,L0,cy-100,cy+106,SUBC,2.5);
    const held=o.d.drag,hxx=held?ex:L0+o.d.hv*pc,pal=held?x<0:o.d.kind==='palm';
    if(x>=0||!pal&&!held){handle(ctx,ex,cy,96,12);}else{handle(ctx,ex,cy,112,13);}
    if(o.d.ha>0){ctx.save();ctx.globalAlpha=o.d.ha;if(pal)drawHand(ctx,'palm',hxx+10,cy+4,HS,0,false);else drawHand(ctx,'grip',hxx,cy,HS,0,false);ctx.restore();}
    const sg=x>0?1:-1,La=F*KA;
    if(La>10){
      if(held){arrow(ctx,ex+6,cy-122,ex+6+sg*La,cy-122,CM,16,36);txt(ctx,'손이 작용하는 힘',Math.max(ex+6,ex+6+sg*La)+14,cy-122,24,CM,'left',800);}   // 손이 잡고 있을 때만
      arrow(ctx,ex-2,cy+132,ex-2-sg*La,cy+132,CG,16,36);txt(ctx,'탄성력',Math.max(ex-2,ex-2-sg*La)+14,cy+132,24,CG,'left',800);}
    // 자: 0 = 용수철의 원래 길이가 끝나는 곳. 왼쪽 = 눌린 길이, 오른쪽 = 늘어난 길이 (같은 눈금)
    const ry=cy+226;ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L0-MAXC*pc,ry);ctx.lineTo(L0+MAXS*pc,ry);ctx.stroke();
    for(let i=-MAXC;i<=MAXS;i++){const xx=L0+i*pc;ctx.beginPath();ctx.moveTo(xx,ry);ctx.lineTo(xx,ry+(i%5===0?14:8));ctx.stroke();
      if(i%5===0)txt(ctx,String(Math.abs(i)),xx,ry+32,19,SUBC,'center',700);}
    ctx.restore();txt(ctx,'cm',L0+MAXS*pc+28,ry+32,19,SUBC,'left',700);
    txt(ctx,'원래 길이',L0,ry+58,20,SUBC,'center',800);txt(ctx,'← 눌린 길이',L0-MAXC*pc,ry+58,19,CM,'left',800);txt(ctx,'늘어난 길이 →',L0+MAXS*pc,ry+58,19,CE,'right',800);
    ctx.fillStyle=CG;ctx.beginPath();ctx.moveTo(ex,ry-3);ctx.lineTo(ex-9,ry-17);ctx.lineTo(ex+9,ry-17);ctx.closePath();ctx.fill();
    // 읽는 값
    const by=H-112;
    rr(ctx,40,by-28,W*.45,56,14);ctx.fillStyle='#fff';ctx.fill();rr(ctx,W*.5,by-28,W*.45,56,14);ctx.fill();
    txt(ctx,(x>0.005?'늘어난 길이 ':x<-0.005?'눌린 길이 ':'변형된 길이 ')+m.toFixed(1)+' cm',40+W*.225,by+1,28,INK,'center',800);
    txt(ctx,'탄성력의 크기 '+F.toFixed(2).replace(/0$/,'')+' N',W*.5+W*.225,by+1,28,CG,'center',900);
    if(m<.04)band(ctx,'손을 끌어서 용수철을 늘이거나 눌러 보자. 놓으면?',W/2,H-42,27);
    else if(held)band(ctx,'같은 길이만큼 변형하면 탄성력의 크기도 같다 (방향은 반대)',W/2,H-42,25);
    else band(ctx,'손을 놓으면 탄성력만 작용해 원래 길이로 되돌아간다 (탄성)',W/2,H-42,25);
  };
};

/* 용수철 측정 그림 (측정 · 가상 실험이 함께 쓴다). cm = 늘어난 길이 */
function measureRig(o,cm,opt){
  const {ctx,W}=o,wx=36,y=opt&&opt.y||110,nat=108,px=Math.min(38,(W-wx-16-nat-250)/10);
  const x0=wx+16+nat,ex=x0+cm*px;
  wallC(ctx,wx,y-44,88);coilH(ctx,wx+16,ex,y,15,16,CE,5.5);
  sensorBox(ctx,ex,y-34,124,68,(cm*.1).toFixed(1)+' N');
  handle(ctx,ex+150,y,56,8);ctx.save();ctx.strokeStyle='#2B3B3A';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(ex+124,y);ctx.lineTo(ex+150,y);ctx.stroke();ctx.restore();
  drawHand(ctx,'grip',ex+150,y,.8,0,false);
  // 자: 용수철의 원래 길이가 끝나는 곳이 0
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x0,y+58);ctx.lineTo(x0+10*px,y+58);ctx.stroke();
  for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(x0+i*px,y+58);ctx.lineTo(x0+i*px,y+(i%2?66:72));ctx.stroke();if(i%2===0)txt(ctx,String(i),x0+i*px,y+90,19,SUBC,'center',700);}
  ctx.restore();txt(ctx,'cm',x0+10*px+26,y+90,19,SUBC,'left',700);
  dashV(ctx,x0,y-56,y+58,SUBC,2.5);
  return {x0,px,ex};
}

/* STAGE 3 : 용수철의 탄성력 측정.  단계: 1~4 힘의 크기 0.4·0.6·0.8·1.0 · 5 비례 */
ANIMS.measure=o=>{
  const PTS=[[2,.2],[4,.4],[6,.6],[8,.8],[10,1.0]];o.d.cur=2;
  o.frame=()=>{const {ctx,W,H}=o;clear(o);
    const k=Math.min(o.phase,4);o.d.cur+=(PTS[k][0]-o.d.cur)*.1;
    measureRig(o,o.d.cur,{y:104});
    const g={x:100,y:262,w:W-170,h:H-262-112,x0:0,x1:10,y0:0,y1:1,xl:'용수철이 늘어난 길이 (cm)',yl:'힘의 크기 (N)',xt:[0,2,4,6,8,10],yt:[0,0.2,0.4,0.6,0.8,1]};
    plotAxes(ctx,g);
    const p5=P(o,5,1.0);
    if(o.phase>=5)plotCurve(ctx,g,x=>x*.1,p5,CG,5);
    PTS.forEach(([cm,n],i)=>{if(i<=k){
      ctx.save();ctx.strokeStyle=CG;ctx.globalAlpha=.7;ctx.lineWidth=3;ctx.setLineDash([9,7]);
      ctx.beginPath();ctx.moveTo(plotX(g,cm),plotY(g,n));ctx.lineTo(plotX(g,cm),plotY(g,0));ctx.moveTo(plotX(g,cm),plotY(g,n));ctx.lineTo(plotX(g,0),plotY(g,n));ctx.stroke();ctx.restore();
      plotDot(ctx,g,cm,n,CG,9);}});
    if(o.phase>=5&&p5>.9)band(ctx,'탄성력의 크기는 늘어난 길이에 비례한다',g.x+g.w/2,H-22,26);
    else if(o.phase===0)band(ctx,'용수철을 2 cm 늘이면 힘 센서는 0.2 N',g.x+g.w/2,H-22,26);
  };
};

/* 활동 : 가상 실험 — 슬라이더로 늘이고 [기록하기]로 점을 찍는다. VLAB.mode 0 = 늘어난 길이, 1 = 용수철의 전체 길이(오개념 확인) */
const VLAB={cm:0,pts:[],mode:0,L0:5};
ANIMS.vlab=o=>{
  o.frame=()=>{const {ctx,W,H}=o;clear(o);
    measureRig(o,VLAB.cm,{y:100});
    const m=VLAB.mode,L0=VLAB.L0;
    const g={x:100,y:262,w:W-170,h:H-262-112,x0:0,x1:m?15:10,y0:0,y1:1,xl:m?'용수철의 전체 길이 (cm)':'용수철이 늘어난 길이 (cm)',yl:'힘의 크기 (N)',
      xt:m?[0,3,6,9,12,15]:[0,2,4,6,8,10],yt:[0,0.2,0.4,0.6,0.8,1]};
    plotAxes(ctx,g);
    const P2=VLAB.pts.map(c=>[m?c+L0:c,c*.1]);
    if(P2.length>=2){if(m){ctx.save();ctx.strokeStyle=CG;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(plotX(g,L0),plotY(g,0));ctx.lineTo(plotX(g,15),plotY(g,(15-L0)*.1));ctx.stroke();ctx.restore();dashV(ctx,plotX(g,L0),plotY(g,0)-10,plotY(g,0)+10,CG,3);}else plotCurve(ctx,g,x=>x*.1,1,CG,4);}
    P2.forEach(([x,y])=>{ctx.save();ctx.strokeStyle=CG;ctx.globalAlpha=.6;ctx.lineWidth=2.5;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(plotX(g,x),plotY(g,y));ctx.lineTo(plotX(g,x),plotY(g,0));ctx.moveTo(plotX(g,x),plotY(g,y));ctx.lineTo(plotX(g,0),plotY(g,y));ctx.stroke();ctx.restore();plotDot(ctx,g,x,y,CG,9);});
    if(m)txt(ctx,'원래 길이 '+L0+' cm',plotX(g,L0),plotY(g,0)-18,20,CG,'center',800);
    if(VLAB.pts.length<3)band(ctx,'늘이고 [기록하기]를 눌러 점을 3개 이상 찍어 보자',g.x+g.w/2,H-22,25);
    else if(!m)band(ctx,'원점을 지나는 직선 → 늘어난 길이에 비례!',g.x+g.w/2,H-22,26);
    else band(ctx,'원점을 지나지 않는다 → 전체 길이에는 비례하지 않는다',g.x+g.w/2,H-22,25);
  };
};

/* STAGE 4 : 추를 매단 용수철.  단계: 1~3 늘어난 길이 12.0·18.0·24.0 · 4 일정하게 · 5 힘
   (이 용수철은 추 1개(0.5 N)마다 6 cm 늘어난다 — 앞의 측정 용수철과는 다른 용수철) */
ANIMS.hang=o=>{
  const LEN=[6,12,18,24];o.d.e=[0,0,0,0];
  o.frame=()=>{const {ctx,W,H}=o;clear(o);
    const ppc=Math.min(13,(H-382)/24),top=88,nat=60,gx=W*.2,gw=(W-gx-30)/4;
    ctx.fillStyle=WALLC;rr(ctx,30,top-18,W-60,18,6);ctx.fill();
    // 자 (왼쪽) : 용수철의 원래 길이가 끝나는 곳이 0
    const ry=top+nat;ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(78,ry);ctx.lineTo(78,ry+24*ppc);ctx.stroke();
    for(let i=0;i<=24;i+=2){ctx.beginPath();ctx.moveTo(78,ry+i*ppc);ctx.lineTo(i%6?88:98,ry+i*ppc);ctx.stroke();if(i%6===0)txt(ctx,String(i),66,ry+i*ppc,19,SUBC,'right',700);}
    ctx.restore();txt(ctx,'cm',78,ry-18,19,SUBC,'center',700);
    const vis=Math.min(o.phase,3)+1;
    LEN.forEach((cm,i)=>{
      const tg=i<vis?cm:0;o.d.e[i]+=(tg-o.d.e[i])*.09;const e=o.d.e[i];
      if(i>=vis&&e<.2)return;
      const x=gx+gw*(i+.5),ey=ry+e*ppc;
      ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+10);ctx.stroke();
      coilV(ctx,x,top+10,ey,16,15,CE,4.4);
      // 갈고리와 추걸이
      ctx.strokeStyle=INK;ctx.lineWidth=3.2;ctx.beginPath();ctx.arc(x,ey+7,6,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(x,ey+13);ctx.lineTo(x,ey+19);ctx.stroke();
      for(let b=0;b<=i;b++){ctx.fillStyle='#B7BDC7';ctx.strokeStyle=INK;ctx.lineWidth=3;rr(ctx,x-34,ey+19+b*23,68,21,6);ctx.fill();ctx.stroke();}
      txt(ctx,'추 '+(i+1)+'개',x,H-86,24,INK,'center',800);
      txt(ctx,(i+1)*.5+' N',x,H-58,22,SUBC,'center',700);
      if(e>.5*cm||o.phase>i)txt(ctx,cm.toFixed(1)+' cm',x,H-28,26,CG,'center',900);
    });
    // 4 일정하게: 같은 간격
    if(o.phase>=4){const a=P(o,4,.6);ctx.save();ctx.globalAlpha=a;
      LEN.forEach((cm,i)=>{const y=ry+cm*ppc;dashH(ctx,78,W-30,y,CG,2);});
      for(let i=1;i<4;i++){const y1=ry+LEN[i-1]*ppc,y2=ry+LEN[i]*ppc,x=gx+gw*i;
        arrow(ctx,x,y1,x,y2,CG,5,12);txt(ctx,'+6',x+12,(y1+y2)/2,22,CG,'left',900);}
      ctx.restore();}
    if(o.phase>=5){const a=P(o,5,.6);ctx.save();ctx.globalAlpha=a;band(ctx,'늘어난 길이로 힘의 크기를 알 수 있다 → 용수철저울',W*.42,H-134,24);ctx.restore();}
  };
};

/* 용수철저울 (눈금은 0.5 N 간격). (cx, top)=저울 위쪽, n=추의 개수. 반환: 추 묶음의 윗면 y */
function scaleRig(ctx,cx,top,n){
  const PW=30,ext=n*PW,CW=104,CH=282,y0=top+84,kx=cx+14;                        // 추 1개(0.5 N)당 30 px 늘어난다
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=6;ctx.beginPath();ctx.arc(kx,top-14,14,0,TAU);ctx.stroke();
  ctx.fillStyle='#fff';ctx.lineWidth=5;rr(ctx,kx-CW/2,top,CW,CH,18);ctx.fill();ctx.stroke();
  // 눈금 (오른쪽 가장자리, 0 ~ 2.5 N)
  for(let i=0;i<=5;i++){const yy=y0+i*PW;ctx.lineWidth=i%2?2.5:3.5;ctx.beginPath();ctx.moveTo(kx+CW/2-(i%2?10:16),yy);ctx.lineTo(kx+CW/2,yy);ctx.stroke();
    txt(ctx,(i*.5).toFixed(1),kx+CW/2+10,yy,22,SUBC,'left',700);}
  txt(ctx,'N',kx+CW/2+10,y0-28,22,SUBC,'left',800);
  // 케이스 안의 용수철 · 바늘
  coilV(ctx,cx,top+16,y0+ext-4,11,13,CE,4.6);
  ctx.strokeStyle=CG;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,y0+ext);ctx.lineTo(kx+CW/2-4,y0+ext);ctx.stroke();
  // 고리·추걸이
  const rodEnd=y0+ext+150;ctx.strokeStyle=INK;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(cx,y0+ext);ctx.lineTo(cx,rodEnd);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,rodEnd+8,8,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,rodEnd+16);ctx.lineTo(cx,rodEnd+24);ctx.stroke();
  const st=rodEnd+24;
  for(let b=0;b<n;b++){ctx.fillStyle='#B7BDC7';ctx.strokeStyle=INK;ctx.lineWidth=3.2;rr(ctx,cx-48,st+b*27,96,25,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.45)';rr(ctx,cx-40,st+b*27+5,30,5,2.5);ctx.fill();}
  ctx.restore();
  return st;
}

/* 활동 : 가상 용수철저울 — 추를 매달면 중력(추의 무게)과 탄성력이 같다. VSC.n = 추의 개수(1~5, 개당 0.5 N) */

    arrow(ctx,cx+92,mid,cx+92,mid+La,CP,13,30);txt(ctx,'중력',cx+112,mid+La/2,26,CP,'left',900);
    arrow(ctx,cx-92,st+8+La,cx-92,st+8,CG,13,30);txt(ctx,'탄성력',cx-112,st+8+La/2,26,CG,'right',900);
    const rx=W*.62;

/* 슬라이드. 문장은 data.py 의 B 에서 가져와야 학습지와 빈칸이 일치한다.
   T('…[[정답]]…') → 정답이 .bl(클릭하면 나타나는 빈칸)이 된다. */

/* '해 보기' : ●(손)에서 시작하는 화살표를 끌어서 그린다. 길이는 일정하게 하고 방향만 본다. 정답 방향과 35° 이내면 맞음 */
const SCN_OK=['맞았어요! 왼쪽으로','맞았어요! 오른쪽으로','맞았어요! 아래쪽으로'];
function bindArrows(el){
  const svg=el.querySelector('.scn svg');if(!svg)return;
  svg.querySelectorAll('.uarr,.ubadge').forEach(n=>n.remove());
  if(svg._bound)return;svg._bound=true;stopAll(svg);svg.style.touchAction='none';svg.style.cursor='crosshair';
  const dots=[...svg.querySelectorAll('.gdot')],NS='http://www.w3.org/2000/svg';
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  let cur=null;
  const mk=(tag,at)=>{const n=document.createElementNS(NS,tag);Object.keys(at).forEach(k=>n.setAttribute(k,at[k]));return n;};
  const draw=(c,ang)=>{const L=54,x2=c.cx+Math.cos(ang)*L,y2=c.cy+Math.sin(ang)*L,hb=12*.8;
    c.g.innerHTML='';c.g.appendChild(mk('line',{x1:c.cx+Math.cos(ang)*8,y1:c.cy+Math.sin(ang)*8,x2:x2-Math.cos(ang)*hb,y2:y2-Math.sin(ang)*hb,stroke:INK,'stroke-width':5,'stroke-linecap':'round'}));
    const p1=[x2-Math.cos(ang-.45)*12,y2-Math.sin(ang-.45)*12],p2=[x2-Math.cos(ang+.45)*12,y2-Math.sin(ang+.45)*12];
    c.g.appendChild(mk('polygon',{points:`${x2},${y2} ${p1} ${p2}`,fill:INK}));};
  svg.addEventListener('pointerdown',e=>{
    const p=pt(e),i=Math.max(0,Math.min(2,Math.floor(p.x/160))),d=dots[i];if(!d)return;
    svg.querySelectorAll(`[data-i="${i}"].uarr,[data-i="${i}"].ubadge`).forEach(n=>n.remove());
    const g=mk('g',{class:'uarr','data-i':i});svg.appendChild(g);
    cur={i,g,cx:+d.getAttribute('cx'),cy:+d.getAttribute('cy'),ok:+d.getAttribute('data-ang'),ang:null};
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    move(e);});
  const move=e=>{if(!cur)return;const p=pt(e),dx=p.x-cur.cx,dy=p.y-cur.cy;if(Math.hypot(dx,dy)<6)return;cur.ang=Math.atan2(dy,dx);draw(cur,cur.ang);};
  svg.addEventListener('pointermove',move);
  const up=()=>{if(!cur)return;const c=cur;cur=null;if(c.ang==null){c.g.remove();return;}
    let df=Math.abs(c.ang*180/Math.PI-c.ok)%360;if(df>180)df=360-df;const ok=df<=35,x0=c.i*160;
    const b=mk('g',{class:'ubadge','data-i':c.i});
    b.appendChild(mk('rect',{x:x0+10,y:160,width:140,height:24,rx:12,fill:ok?'#1F7A6C':'#F4C33B'}));
    const t=mk('text',{x:x0+80,y:177,'text-anchor':'middle','font-size':12.5,'font-weight':800,fill:ok?'#fff':INK});t.textContent=ok?SCN_OK[c.i]:'되돌아가려는 쪽은?';b.appendChild(t);svg.appendChild(b);};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
