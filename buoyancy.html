    ctx.lineWidth=11;ctx.strokeStyle='#F2C9A4';ctx.stroke();};
  finger(x-16,L-5);finger(x+16,R+5);
  ctx.fillStyle='#F2C9A4';[[L-5,tipY],[R+5,tipY]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,6.4,0,TAU);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#8E6340';ctx.stroke();});
  ctx.restore();
}

/* 색이 다른 글자를 한 줄로 : parts=[[글자,색],…] — 범례의 '파랑'은 실제 파랑으로 쓴다 */
function txtMulti(ctx,parts,cx,y,size,weight){
  ctx.save();ctx.font=`${weight||800} ${size}px Pretendard,sans-serif`;const w=parts.reduce((a,p)=>a+ctx.measureText(p[0]).width,0);let x=cx-w/2;
  ctx.textAlign='left';ctx.textBaseline='middle';parts.forEach(p=>{ctx.fillStyle=p[1];ctx.fillText(p[0],x,y);x+=ctx.measureText(p[0]).width;});ctx.restore();
}
/* 실 : 팽팽하면 직선, 느슨하면(장력 0) 늘어진 곡선 */
function stringC(ctx,x1,y1,x2,y2,slack){
  ctx.save();ctx.strokeStyle='#5B4A3A';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);
  if(slack){const mx=(x1+x2)/2,my=(y1+y2)/2,s=Math.hypot(x2-x1,y2-y1)*.12;ctx.bezierCurveTo(x1+s*1.6,y1+(y2-y1)*.3,x2-s*1.6,y1+(y2-y1)*.7,x2,y2);}else ctx.lineTo(x2,y2);
  ctx.stroke();ctx.restore();
}

/* 위쪽이 서서히 투명해지는 그리기 : 팔(소매)이 그림 가장자리에서 잘려 보이지 않게 한다. yA(투명) → yB(불투명) */
let _FC=null;
function fadeTop(o,yA,yB,alpha,draw){
  const {ctx,W,H}=o;if(!_FC)_FC=document.createElement('canvas');
  if(_FC.width!==W*2||_FC.height!==H*2){_FC.width=W*2;_FC.height=H*2;}
  const c=_FC.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,_FC.width,_FC.height);c.setTransform(2,0,0,2,0,0);
  draw(c);c.globalCompositeOperation='destination-in';const g=c.createLinearGradient(0,yA,0,yB);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
  c.fillStyle=g;c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=alpha==null?1:alpha;ctx.drawImage(_FC,0,0);ctx.restore();
}

/* 부력 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  슬라이드의 anim:'이름' 과 연결.
   단계(o.phase) = 슬라이드의 '공개한 빈칸 번호'. 단계 0 = 시작 전(아무것도 움직이지 않는다).
   물리 모형(모식): 부력 B = 물에 잠긴 부피에 비례(구는 구관 부피 공식), 중력 G 는 일정. 알짜힘 = (중력 − 부력) 방향으로 가속하고 물의 저항(속력에 비례)이 있다.
   떠 있으면(정지) B = G.  화살표 길이는 힘의 크기에 비례한다(같은 눈금). */
const FSC=96;                      // 힘 화살표: 부력 1.0(기준) 일 때의 길이(px)
const KACC=1400, CDRAG=7;          // 가속도 계수, 물의 저항 계수 (모식)
/* 한 물체의 세로 운동(아래가 +): v' = KACC·(G − B) − CDRAG·v */
function bodyStep(b,dt,Bfn,G){
  const n=4,h=dt/n;for(let i=0;i<n;i++){const a=KACC*(G-Bfn(b.y))-CDRAG*b.v;b.v+=a*h;b.y+=b.v*h;}
}
const fmtN=v=>v.toFixed(2)+' N';

/* 배(화물선) 그림. (cx, deckY)=갑판 윗면 가운데, w=폭, hullH=선체 높이, boxes=갑판 위 짐 수 */
function shipC(ctx,cx,deckY,w,hullH,boxes,boxFrom){
  ctx.save();ctx.lineJoin='round';
  const wb=w*.74;ctx.beginPath();ctx.moveTo(cx-w/2,deckY);ctx.lineTo(cx+w/2,deckY);ctx.lineTo(cx+wb/2,deckY+hullH);ctx.lineTo(cx-wb/2,deckY+hullH);ctx.closePath();
  ctx.fillStyle='#E5533D';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#7B2230';ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(cx-w/2+3,deckY+1,w-6,5);
  rr(ctx,cx+w*.28,deckY-46,w*.2,46,4);ctx.fillStyle='#F1ECE0';ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=INK;ctx.stroke();
  ctx.fillStyle='#8FC3E3';ctx.fillRect(cx+w*.31,deckY-36,w*.14,10);
  const cols=['#F4C33B','#2A9D8B','#E5533D'],bw=w*.17,bh=34;
  for(let i=0;i<boxes;i++){const bx=cx-w*.42+i*(bw+4);rr(ctx,bx,deckY-bh,bw,bh,3);ctx.fillStyle=cols[i%3];ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.stroke();}
  ctx.restore();
}
const sunC=(ctx,x,y)=>{};
function personSwim(ctx,x,wl,s){   // 구명조끼를 입고 물에 뜬 사람: (x, wl) = 몸 가운데·수면
  ctx.save();ctx.translate(x,wl);ctx.scale(s,s);ctx.lineJoin='round';
  ctx.fillStyle='#F1C9A5';ctx.strokeStyle=INK;ctx.lineWidth=2.4;
  ctx.beginPath();ctx.arc(0,-62,19,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2B2320';ctx.beginPath();ctx.arc(-2,-68,19,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(7,-60,2.2,0,TAU);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.arc(8,-54,5,.2,Math.PI-.5);ctx.stroke();
  ctx.fillStyle='#3B4A63';rr(ctx,-24,20,18,52,8);ctx.fill();ctx.stroke();rr(ctx,6,20,18,52,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#F1C9A5';rr(ctx,-52,-36,20,16,7);ctx.fill();ctx.stroke();rr(ctx,32,-36,20,16,7);ctx.fill();ctx.stroke();
  rr(ctx,-34,-44,68,70,14);ctx.fillStyle='#F26B21';ctx.fill();ctx.lineWidth=2.6;ctx.strokeStyle=INK;ctx.stroke();
  ctx.fillStyle='#FFE9C7';ctx.fillRect(-34,-18,68,8);
  ctx.restore();
}

/* ---------- 표지(짙은 바탕): 물 위에 떠 있는 공·배·풍선 ---------- */
ANIMS.cover=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
    const wl=H*.56;
    ctx.save();ctx.fillStyle='rgba(111,179,216,.35)';ctx.beginPath();ctx.moveTo(0,wl);for(let x=0;x<=W;x+=8)ctx.lineTo(x,wl+Math.sin(x/38+t*1.6)*4);ctx.lineTo(W,H*.95);ctx.lineTo(0,H*.95);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=8)x?ctx.lineTo(x,wl+Math.sin(x/38+t*1.6)*4):ctx.moveTo(x,wl);ctx.stroke();ctx.restore();
    const bob=(ph,a)=>Math.sin(t*1.3+ph)*a;
    // 공(절반쯤 잠겨 떠 있다)
    const by=wl-4+bob(0,5);ball(ctx,W*.22,by,40,YEL);
    ctx.save();ctx.fillStyle='rgba(111,179,216,.38)';ctx.beginPath();ctx.rect(W*.22-44,wl+Math.sin(W*.22/38+t*1.6)*4,88,60);ctx.clip();ctx.beginPath();ctx.arc(W*.22,by,40,0,TAU);ctx.fill();ctx.restore();
    // 화물선
    const sd=wl-52+bob(1.2,4);shipC(ctx,W*.62,sd,250,80,3);
    ctx.save();ctx.fillStyle='rgba(111,179,216,.38)';ctx.fillRect(W*.62-130,wl+Math.sin(W*.62/38+t*1.6)*4,260,70);ctx.restore();
    // 풍선(공기 중)
    const py=H*.2+bob(2,8);
    [[W*.28,'#E8576B'],[W*.36,'#F4C33B']].forEach(([x,c],i)=>{const y=py+i*18;ball(ctx,x,y,34,c);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+34);ctx.lineTo(W*.32,y+110);ctx.stroke();});
  };
};

/* ---------- STAGE 1 : 구명조끼를 입은 사람. 단계: 1 위쪽 · 2 기체 · 3 부력 ----------
   물에 뜬 사람(힘 = 위쪽) → 공기 중에 뜬 풍선(기체 속에서도) → 이름표 */
ANIMS.intro=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    ctx.save();ctx.fillStyle=TINT_AIR;rr(ctx,8,8,W-16,H*.52,18);ctx.fill();ctx.fillStyle=TINT_SEA;ctx.restore();
    const L=W*.5;                      // 가운데: 왼쪽 물, 오른쪽 공기
    const wl=H*.5;
    // 왼쪽: 물
    ctx.save();ctx.fillStyle=TINT_SEA;rr(ctx,8,8,W-16,H-16,18);ctx.fill();ctx.restore();
    // 물 (왼쪽 반)
    ctx.save();ctx.fillStyle=WATER;ctx.fillRect(14,wl,L-20,H-wl-14);ctx.restore();
    const bob=o.phase>=1?Math.sin(t*1.4)*3:0;
    personSwim(ctx,L*.5,wl+bob+22,1.5);
    ctx.save();ctx.fillStyle='rgba(111,179,216,.3)';ctx.fillRect(14,wl+bob*0,L-20,H-wl-14);ctx.restore();
    ctx.save();ctx.strokeStyle=WATER_D;ctx.lineWidth=3;ctx.beginPath();for(let x=14;x<=L-6;x+=6)x>14?ctx.lineTo(x,wl+Math.sin(x/26+t*1.4)*3):ctx.moveTo(x,wl);ctx.stroke();ctx.restore();
    txt(ctx,'물',30,H-34,26,'#2F6FA0','left',900);
    // 구분선
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(L,16);ctx.lineTo(L,H-16);ctx.stroke();ctx.restore();
    txt(ctx,'공기 중',L+(W-L)/2,H-34,26,'#2F6FA0','center',900);
    // 오른쪽: 공기 중 풍선(헬륨 풍선처럼 떠 있다)
    const bx=L+(W-L)/2,by=H*.45;
    [[-34,'#E8576B',0],[34,'#F4C33B',18]].forEach(([dx,c,dy])=>{ball(ctx,bx+dx,by+dy,44,c);ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx+dx,by+dy+44);ctx.lineTo(bx,by+128);ctx.stroke();});
    ctx.save();ctx.fillStyle='#2A9D8B';ctx.beginPath();ctx.arc(bx,by+134,7,0,TAU);ctx.fill();ctx.restore();
    // 1 : 사람에게 작용하는 힘(위쪽) — 물이 몸을 위로 민다
    if(o.phase>=1){const a=P(o,1,.6);ctx.save();ctx.globalAlpha=a;
      [-70,70].forEach(dx=>vArrow(ctx,L*.5+dx,wl+120,66*a,-1,CB,9,20));
      pill(ctx,'물이 위쪽으로 민다',L*.5,wl+158,24,CB,'#fff');ctx.restore();}
    // 2 : 기체 속에서도 같은 힘
    if(o.phase>=2){const a=P(o,2,.6);ctx.save();ctx.globalAlpha=a;
      [-34,34].forEach(dx=>vArrow(ctx,bx+dx,by-44+(dx>0?18:0),64*a,-1,CB,9,20));
      pill(ctx,'공기도 위로 민다',bx,wl+158,24,CB,'#fff');ctx.restore();}
    // 3 : 이름표
    if(o.phase>=3){const a=popK(P(o,3,.5));ctx.save();ctx.translate(W/2,H*.12);ctx.scale(a,a);band(ctx,'이 힘이 부력',0,0,40);ctx.restore();}
  };
};


/* ---------- 해 보기 : 물속에서 고무공을 놓는다. 단계 0 = 손으로 잡고 있다 / 1 = 놓는다 ----------
   BALL 모형: 공 반지름 r, 중력 G=0.45(기준), 부력 B = 1.0 × (잠긴 부피 비율).  손은 공 위에서 누르고 놓으면 위로 빠진다 */
const BALL_G=.45;
function ballRelease(o,withForce){
  const BR=38;o.d.reset=()=>{o.d.y=0;o.d.v=0;o.d.rel=null;o.d.init=false;};o.d.reset();
  o.onPhase=k=>{if(k===0)o.d.reset();else if(o.d.rel==null)o.d.rel=o.t;};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const tx=W*.16,tw=W*.68,ty=H*.14,th=H*.74,yS=ty+th*.26,x=tx+tw/2,y0=yS+th*.40;
    if(!o.d.init){o.d.y=y0;o.d.init=true;}
    const dt=Math.min(.04,t-(o.d.lt||t));o.d.lt=t;
    const Bf=y=>capFrac(y+BR-yS,BR);
    const released=o.d.rel!=null&&t>=o.d.rel;
    if(released)bodyStep(o.d,dt,Bf,BALL_G);
    tankBack(ctx,tx,ty,tw,th,yS);
    ball(ctx,x,o.d.y,BR,YEL);
    ctx.save();ctx.beginPath();ctx.arc(x,o.d.y,BR,0,TAU);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-BR,o.d.y-8);ctx.quadraticCurveTo(x,o.d.y+6,x+BR,o.d.y-8);ctx.stroke();ctx.restore();
    // 손: 공 위에서 잡고 있다. 놓으면 위로 빠진다(공보다 빠르게). 소매 위쪽은 서서히 투명하게(그림 가장자리에서 잘려 보이지 않게)
    const hy=released?(t-o.d.rel)*520:0;
    fadeTop(o,yS-95,yS-25,1,c=>drawHand(c,'palmL',x,o.d.y-BR+2-hy,.38,-90,false));
    tankFront(ctx,tx,ty,tw,th,yS,t);
    if(!released)txt(ctx,'손으로 공을 잡고 있다',W/2,ty+th+30,26,SUBC,'center',800);
    if(withForce&&o.phase>=2&&released){
      const B=Bf(o.d.y);vArrow(ctx,x-24,o.d.y,B*FSC,-1,CB,9,22);vArrow(ctx,x+24,o.d.y,BALL_G*FSC,1,CG,9,22);
      const a=P(o,2,.5);ctx.save();ctx.globalAlpha=a;pill(ctx,'부력',x-84,o.d.y-Math.max(30,B*FSC)-12,24,CB,'#fff');pill(ctx,'중력',x+88,o.d.y+BALL_G*FSC+14,24,CG,'#fff');ctx.restore();}
  };
}
ANIMS.ballrel=o=>ballRelease(o,false);

/* ---------- STAGE 3 : 용수철저울 + 추 + 물 ----------
   눈금 R : 공기 중 2.00 N, 반쯤 잠기면 1.85 N, 완전히 잠기면 1.72 N (지도서 예시 평균, 사이는 직선으로 이음).  부력 = 2.00 − R.
   저울을 매단 지지대의 팔이 내려가면서 추가 물에 잠긴다. pos = 추 아랫면의 y. 팔·저울·추는 연결되어 함께 움직인다 */
const WT_W=70,WT_H=70;
function scaleGeom(W,H,sh){sh=sh||0;const tx=W*.12+sh,tw=W*.5,ty=H*.5,yS=ty+H*.1,th=H*.1+150;return {tx,tw,ty,yS,th,bot:ty+th,cx:tx+tw/2,poleX:W*.06+sh};}
const readMeas=f=>{f=clamp(f,0,1);const W0=D.LAB_W,H1=D.LAB_HALF,F1=D.LAB_FULL;return f<=.5?W0+(H1-W0)*f/.5:H1+(F1-H1)*(f-.5)/.5;};
const readLin=f=>D.LAB_W-D.LAB_B*clamp(f,0,1);
function scaleScene(o,g,pos,readTxt,lin){
  const {ctx,W,H,t}=o;
  const f=clamp((pos-g.yS)/WT_H,0,1),R=(lin?readLin:readMeas)(f);
  ctx.save();ctx.fillStyle='#C9D3D1';ctx.fillRect(0,g.bot,W,8);
  ctx.fillStyle='#8FA19E';rr(ctx,g.poleX-34,g.bot-12,96,14,4);ctx.fill();rr(ctx,g.poleX-5,H*.04,10,g.bot-H*.04-4,3);ctx.fill();ctx.restore();
  const wTop=pos-WT_H,scaleTop=wTop-(144+22+R*10),armY=scaleTop-3;
  tankBack(ctx,g.tx,g.ty,g.tw,g.th,g.yS);
  weightC(ctx,g.cx,wTop,WT_W,WT_H);
  tankFront(ctx,g.tx,g.ty,g.tw,g.th,g.yS,t);
  ctx.save();ctx.strokeStyle='#8FA19E';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(g.poleX,armY);ctx.lineTo(g.cx,armY);ctx.stroke();
  ctx.fillStyle='#6E7F7C';rr(ctx,g.poleX-9,armY-10,18,20,3);ctx.fill();ctx.restore();
  springScaleC(ctx,g.cx,scaleTop,R);
  const sx=g.cx+34;ctx.save();rr(ctx,sx,scaleTop+56,126,50,10);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=CT;ctx.stroke();ctx.restore();
  txt(ctx,readTxt||fmtN(R),sx+63,scaleTop+82,28,CT,'center',900);txt(ctx,'눈금',sx+63,scaleTop+44,20,SUBC,'center',800);
  return {f,R,wTop,scaleTop};
}
/* 물체에 작용하는 힘: 저울이 당기는 힘(초록, 위) + 부력(파랑, 위) = 중력(주황, 아래).  길이는 힘의 크기에 비례 (90 px/N) */
function scaleForces(o,g,R,showB,showLbl){
  const {ctx,W,H}=o,k=90,dx=W*.8,dy=H*.4,B=D.LAB_W-R;
  txt(ctx,'추에 작용하는 힘',dx,26,24,INK,'center',900);
  ctx.save();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(dx,dy,6,0,TAU);ctx.fill();ctx.restore();
  vArrow(ctx,dx-48,dy,R*k,-1,CT,10,22);
  if(showB&&B>.004)vArrow(ctx,dx,dy,B*k,-1,CB,9,Math.min(14,B*k*.5));
  vArrow(ctx,dx+48,dy,D.LAB_W*k,1,CG,10,22);
  if(showLbl){
    txt(ctx,'저울이 당기는 힘',dx-48,dy-R*k-40,21,CT,'center',900);txt(ctx,fmtN(R),dx-48,dy-R*k-16,24,CT,'center',900);
    if(showB&&B>.004){txt(ctx,'부력',dx+2,dy-B*k-40,21,CB,'center',900);txt(ctx,fmtN(B),dx+2,dy-B*k-16,24,CB,'center',900);}
    txt(ctx,'중력',dx+48,dy+D.LAB_W*k+20,21,CG,'center',900);txt(ctx,fmtN(D.LAB_W),dx+48,dy+D.LAB_W*k+44,24,CG,'center',900);}
}
/* 결과 슬라이드 단계: 0 공기 중 · 1 반쯤 잠기게 내려 눈금이 줄어든다(감소) · 2 부력 = 공기 중 눈금 − 물속 눈금(뺀) · 3 반쯤 잠겼을 때의 계산 · 4 완전히 잠기게 내려 계산 */
ANIMS.scale=o=>{
  o.d.pos=null;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const g=scaleGeom(W,H);
    const air=g.yS-34,half=g.yS+WT_H*.5,full=g.yS+WT_H+8;if(o.d.pos==null){o.d.pos=air;o.d.lt=t;}
    const dt=Math.min(.04,t-o.d.lt);o.d.lt=t;
    const goal=o.phase>=4?full:o.phase>=1?half:air;o.d.pos+=clamp(goal-o.d.pos,-70*dt,70*dt);
    const r=scaleScene(o,g,o.d.pos);
    scaleForces(o,g,r.R,true,true);
    const e=v=>v.toFixed(2),mid=D.LAB_HALF,fl=D.LAB_FULL,W0=D.LAB_W;
    const msg=o.phase===2?'부력 = 공기 중 눈금 − 물속 눈금':o.phase===3?`반쯤 잠겼을 때 : ${e(W0)} − ${e(mid)} = ${e(W0-mid)} N`:o.phase>=4?`완전히 잠겼을 때 : ${e(W0)} − ${e(fl)} = ${e(W0-fl)} N`:'';
    if(msg){band(ctx,msg,W*.5,H-34,28);}
  };
};
/* 가상 탐구 : 추의 위치를 고르면 추가 내려가고 멈추면 1회 값이 자동으로 기록된다. [다시 재기]는 2회·3회 값을 차례로 기록한다. 표시되는 눈금 = 방금 기록된 값 */
const LAB={cond:-1,n:[0,0,0],auto:[0,0,0],rec:null};
ANIMS.lab=o=>{
  o.d.pos=null;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const g=scaleGeom(W,H,W*.14);
    const goalPos=[g.yS-34,g.yS+WT_H*.5,g.yS+WT_H+8][Math.max(0,LAB.cond)];if(o.d.pos==null){o.d.pos=g.yS-34;o.d.lt=t;}
    const dt=Math.min(.04,t-o.d.lt);o.d.lt=t;o.d.pos+=clamp(goalPos-o.d.pos,-70*dt,70*dt);
    const settled=Math.abs(goalPos-o.d.pos)<.5,c=LAB.cond;
    if(c>=0&&settled&&!LAB.auto[c]&&LAB.n[c]===0){LAB.auto[c]=1;if(LAB.rec)LAB.rec(c);}
    const idx=c>=0?Math.max(0,LAB.n[c]-1):0;
    const showVal=(c>=0&&settled&&LAB.n[c]>0)?D.LAB_ROWS[c][1][idx].toFixed(2)+' N':null;
    scaleScene(o,g,o.d.pos,showVal||(c<0?'2.00 N':null));
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(g.cx-WT_W/2+4,o.d.pos-WT_H/2);ctx.lineTo(g.cx+WT_W/2-4,o.d.pos-WT_H/2);ctx.stroke();ctx.restore();
    txt(ctx,c<0?'추의 위치를 골라 보자':['공기 중','반쯤 잠겼다','완전히 잠겼다'][c],g.cx,g.bot+34,26,INK,'center',900);
    txt(ctx,'눈금은 눈높이를 맞추어 읽는다',W*.5,H-26,20,SUBC,'center',700);
  };
};
/* 잠긴 부피와 부력 : 슬라이더(잠긴 비율 0~100 %)로 추를 내리거나 올린다. 그래프 = 부력(이상적인 비례 모형) */
const VOLS={f:.25,auto:0};            // f = 추를 내린 깊이(추 높이의 배수). 0~1 : 점점 잠긴다 · 1 : 딱 잠긴다 · 1~1.7 : 더 깊이 내려도 잠긴 부피는 그대로
const VMAX=1.7;
ANIMS.vol=o=>{
  o.onPhase=k=>{if(k>=1&&!o.d.ramped){o.d.ramped=1;VOLS.auto=1;}if(k===0){o.d.ramped=0;VOLS.auto=0;VOLS.f=.25;syncVolSlider();}};
  o.d.lt=null;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);const g=scaleGeom(W,H);if(o.d.lt==null)o.d.lt=t;const dt=Math.min(.04,t-o.d.lt);o.d.lt=t;
    if(VOLS.auto){VOLS.f=Math.min(VMAX,VOLS.f+.2*dt);if(VOLS.f>=VMAX)VOLS.auto=0;syncVolSlider();}
    const pos=g.yS+VOLS.f*WT_H,fs=Math.min(1,VOLS.f);scaleScene(o,g,pos,null,true);
    const B=D.LAB_B*fs;
    // 그래프 : 가로 = 추를 내린 깊이(추 높이의 %), 세로 = 부력(N). 100 % 에서 딱 잠기고 그 뒤로는 부력이 일정하다. 눈금의 0 은 원점에 한 번만 쓴다
    const gg={x:W*.71,y:H*.13,w:W*.26,h:H*.4,x0:0,x1:180,y0:0,y1:.36,xl:'추를 내린 깊이 (%)',yl:'부력 (N)',xt:[50,100,150],yt:[.1,.2,.3]};
    plotAxes(ctx,gg);txt(ctx,'0',gg.x-12,gg.y+gg.h+14,18,TH.tick,'center',700);
    ctx.save();ctx.strokeStyle='#8FA19E';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(plotX(gg,100),plotY(gg,0));ctx.lineTo(plotX(gg,100),plotY(gg,.34));ctx.stroke();ctx.restore();
    txt(ctx,'딱 잠긴다',plotX(gg,100),plotY(gg,.34)-14,20,SUBC,'center',800);
    ctx.save();ctx.strokeStyle=CB;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(plotX(gg,0),plotY(gg,0));
    ctx.lineTo(plotX(gg,100*fs),plotY(gg,D.LAB_B*fs));if(VOLS.f>1)ctx.lineTo(plotX(gg,100*VOLS.f),plotY(gg,B));ctx.stroke();ctx.restore();
    plotDot(ctx,gg,100*VOLS.f,B,CB,9);
    if(VOLS.f>1.12){const a=clamp((VOLS.f-1.12)/.2,0,1);ctx.save();ctx.globalAlpha=a;ctx.textAlign='left';txt(ctx,'더 깊이 내려도',plotX(gg,100)+10,plotY(gg,D.LAB_B)+32,19,CB,'left',900);txt(ctx,'부력은 그대로',plotX(gg,100)+10,plotY(gg,D.LAB_B)+55,19,CB,'left',900);ctx.restore();}
    txt(ctx,'부력 '+fmtN(B),W*.84,H*.7,28,CB,'center',900);
    txt(ctx,'잠긴 부피 '+Math.round(fs*100)+' %',W*.84,H*.76,24,INK,'center',800);
    if(o.phase>=2){const a=P(o,2,.6);ctx.save();ctx.globalAlpha=a;band(ctx,'잠긴 부피가 커질수록  →  부력이 커진다 (딱 잠긴 뒤에는 일정)',W*.5,H-36,34);ctx.restore();}
  };
};
function syncVolSlider(){const s=document.querySelector('.slide.active [data-sl="V"]');if(!s)return;const r=s.querySelector('input'),v=s.querySelector('.val');if(r)r.value=Math.round(VOLS.f*100);if(v)v.textContent=volTxt(Math.round(VOLS.f*100));}
function volTxt(x){return x<100?x+' %':x===100?'딱 잠김':'더 깊이';}

/* ---------- STAGE 4 : 같은 부피의 세 물체. 단계 0 = 모두 실에 묶여 있다 → 1 (가)의 실이 끊긴다 → 2 (나) → 3 (다) ----------
   (가)(나)는 바닥의 고리에 아래쪽 실로, (다)는 위쪽 막대에 실로 묶여 있다. 부피가 같아 물속에서 부력은 모두 같다(묶여 있을 때도, 끊긴 뒤에도). 중력은 0.6 · 1.0 · 1.5.
   묶여 있을 때 실이 당기는 힘(보라)이 더해져 힘의 합이 0 : (가) 실이 아래로 0.4 · (나) 실이 느슨하다(장력 0) · (다) 실이 위로 0.5.  실이 끊긴 물체만 움직인다 */
const FLC=['#F1C86B','#B8C2C0','#6B7371'],FLH=6.4;
ANIMS.float3=o=>{
  const CS=66,LS=105;o.d.items=[0,1,2].map(()=>({y:0,v:0,rel:null,init:false}));
  o.onPhase=k=>{o.d.items.forEach((it,i)=>{if(k<=i){it.rel=null;it.init=false;it.v=0;}else if(it.rel==null)it.rel=o.t;});};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const pw=W/3,ty=H*.1,th=H*.7,yS=ty+th*.2,yb=ty+th-62,dt=Math.min(.04,t-(o.d.lt||t));o.d.lt=t;
    const names=['(가)','(나)','(다)'],caps=['위로 떠오른다','정지해 있다','아래로 가라앉는다'],FS=60;
    o.d.items.forEach((it,i)=>{
      const tx=i*pw+10,tw=pw-20,x=tx+tw/2,G=D.FLOAT_G[i],top=i===2,barY=ty-8;
      if(!it.init){it.y=top?yS+CS/2+78:yb-CS/2-LS;it.init=true;}
      const Bf=y=>clamp((y+CS/2-yS)/CS,0,1);
      const rel=it.rel!=null&&t>=it.rel;let rest=false;
      if(rel){bodyStep(it,dt,Bf,G);if(it.y+CS/2>=yb){it.y=yb-CS/2;it.v=0;rest=true;}}
      tankBack(ctx,tx,ty,tw,th,yS);ctx.save();ctx.fillStyle='#D8C9A6';ctx.fillRect(tx,yb,tw,62);ctx.restore();
      // 실 : (가)(나)는 바닥 고리 → 물체 아래, (다)는 위쪽 막대 → 물체 위. 끊긴 뒤에는 물체에 붙은 짧은 실만 따라온다
      const ax=x,ay=top?it.y-CS/2:it.y+CS/2,anc=top?barY:yb;
      if(!top){ctx.save();ctx.fillStyle='#6E7F7C';ctx.beginPath();ctx.arc(x,yb+2,9,Math.PI,0);ctx.fill();ctx.strokeStyle='#4F5A56';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,yb-5,7,0,TAU);ctx.stroke();ctx.restore();}
      if(!rel)stringC(ctx,ax,ay,x,top?anc:yb-8,i===1);
      else{const dir=top?-1:1;stringC(ctx,ax,ay,ax+dir*0,ay+dir*(top?-26:26),true);   // 물체에 달린 실 조각
        if(!top)stringC(ctx,x,yb-8,x,yb-30,false);}                                  // 고리에 남은 실 조각
      rr(ctx,x-CS/2,it.y-CS/2,CS,CS,6);ctx.save();ctx.fillStyle=FLC[i];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4F5A56';ctx.stroke();ctx.restore();
      tankFront(ctx,tx,ty,tw,th,yS,t);
      if(top){ctx.save();ctx.fillStyle='#A9855B';ctx.strokeStyle='#5B4A3A';ctx.lineWidth=2.4;rr(ctx,tx-4,barY-6,tw+8,12,3);ctx.fill();ctx.stroke();ctx.restore();
        if(rel){stringC(ctx,x,barY+6,x,barY+30,true);}}                             // 막대에 남은 실 조각
      // 실이 끊기는 순간의 불꽃
      if(rel&&t-it.rel<.5){const u=(t-it.rel)/.5,cy0=top?(barY+it.y-CS/2)/2:(yb+it.y+CS/2)/2;ctx.save();ctx.globalAlpha=1-u;ctx.strokeStyle='#E8A400';ctx.lineWidth=3.2;ctx.lineCap='round';
        for(let k=0;k<8;k++){const a=k*Math.PI/4,r1=10+u*8,r2=22+u*16;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r1,cy0+Math.sin(a)*r1);ctx.lineTo(x+Math.cos(a)*r2,cy0+Math.sin(a)*r2);ctx.stroke();}ctx.restore();}
      txt(ctx,names[i],x,yb+62+28,30,INK,'center',900);
      // 힘 화살표 : 부력·중력은 모두 물체 가운데(작용점, 검은 점)에서 시작한다. 실이 당기는 힘은 실이 붙은 곳에서 시작한다
      const B=Bf(it.y),held=!rel,w=15;
      ctx.save();ctx.globalAlpha=1;
      vArrow(ctx,x,it.y,B*FS,-1,CB,w,24);vArrow(ctx,x,it.y,G*FS,1,CG,w,24);
      if(held){const T=B-G;if(Math.abs(T)>.01)vArrow(ctx,x+CS/2+20,top?it.y-CS/2:it.y+CS/2,Math.abs(T)*FS,T>0?1:-1,CD,w-3,20);}
      if(rest){vArrow(ctx,x+CS/2-12,it.y+CS/2,(G-B)*FS,-1,'#55615F',11,14);}
      ctx.fillStyle=INK;ctx.beginPath();ctx.arc(x,it.y,5.5,0,TAU);ctx.fill();ctx.restore();
      if(rel)txt(ctx,caps[i],x,yb+62+58,24,i===0?CB:i===1?SUBC:CG,'center',800);
      else txt(ctx,i===1?'실이 느슨하다 (당기는 힘 0)':'실로 묶여 있다',x,yb+62+58,22,SUBC,'center',800);
    });
    const any3=o.d.items[2].rel!=null;
    txtMulti(ctx,[['파랑',CB],[' = 부력 · ',SUBC],['주황',CG],[' = 중력 · ',SUBC],['보라',CD],[' = 실이 당기는 힘',SUBC]].concat(any3?[[' · ',SUBC],['회색','#55615F'],[' = 바닥이 떠받치는 힘',SUBC]]:[]),W/2,H-12,20,700);
  };
};

/* ---------- 화물선. 단계 0 빈 배 → 1 짐을 싣는다(짐이 갑판에 닿을 때마다 더 가라앉고 부력도 커진다) → 2 정리 ----------
   물에 잠긴 부분의 단면적 ∝ 부피(모식). 중력 G = 1.0 + 짐(0.5 씩). 떠 있으면 B = G.  크레인이 짐을 갑판에 내려놓은 순간 중력이 늘어난다 */
function hullArea(d,w,H){const wb=w*.74;d=clamp(d,0,H);return wb*d+(w-wb)*d*d/(2*H);}
const BOXG=.5;
ANIMS.ship=o=>{
  const SW=340,HH=124,D0=40,BW=SW*.17,BH=38;
  const A0=hullArea(D0,SW,HH),Bk=1/A0;
  const T1=2.6;
  o.d.reset=()=>{o.d.y=D0;o.d.v=0;o.d.load=0;o.d.tk=[null,null,null];};o.d.reset();   // o.d.y = 흘수(물에 잠긴 깊이), tk[i] = i번째 짐을 싣기 시작한 때
  o.onPhase=k=>{if(k===0){o.d.reset();return;}for(let i=0;i<k&&i<3;i++)if(o.d.tk[i]==null)o.d.tk[i]=Math.max(o.t,i?o.d.tk[i-1]+T1:0);};   // 스페이스바 한 번에 짐 하나씩
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const wl=H*.5,cx=W*.62,dt=Math.min(.04,t-(o.d.lt||t));o.d.lt=t;
    const dockX=W*.02,dockW=W*.22,dockY=wl-24,towerX=dockX+10,jibY=dockY-260;
    const uOf=i=>o.d.tk[i]==null?0:clamp((t-o.d.tk[i])/T1,0,1);
    let ld=0;while(ld<3&&uOf(ld)>=1)ld++;
    if(ld>o.d.load)o.d.load=ld;                // 짐이 갑판에 내려앉은 순간에 무게가 늘어난다
    const G=1+BOXG*o.d.load,Bfn=d=>Bk*hullArea(d,SW,HH);
    bodyStep(o.d,dt,Bfn,G);o.d.y=clamp(o.d.y,5,HH-6);
    const d=o.d.y,deckY=wl-(HH-d);
    ctx.save();ctx.fillStyle='#C9D3D1';ctx.fillRect(dockX,dockY,dockW,H-dockY-8);ctx.strokeStyle='#8FA19E';ctx.lineWidth=3;ctx.strokeRect(dockX,dockY,dockW,H-dockY-8);ctx.restore();
    ctx.save();ctx.fillStyle=WATER;ctx.fillRect(dockX+dockW,wl,W-dockX-dockW-6,H-wl-8);ctx.restore();
    shipC(ctx,cx,deckY,SW,HH,o.d.load);
    // 크레인 : 탑은 항구 왼쪽 끝에, 팔(붐)은 배 위까지. 짐은 탑과 겹치지 않는 곳에서 집어 올린다
    ctx.save();ctx.fillStyle='#F4C33B';ctx.strokeStyle=INK;ctx.lineWidth=3;rr(ctx,towerX,jibY,24,dockY-jibY,3);ctx.fill();ctx.stroke();
    rr(ctx,towerX,jibY,cx-towerX+40,16,3);ctx.fill();ctx.stroke();ctx.restore();
    const cols=['#F4C33B','#2A9D8B','#E5533D'],slotX=i=>cx-SW*.42+i*(BW+4)+BW/2,hiY=jibY+78;
    const sx0=i=>towerX+70+i*(BW+8)+BW/2;
    for(let i=0;i<3;i++){
      if(i<o.d.load)continue;
      const sx=sx0(i),sy=dockY-BH,u=uOf(i);
      let bx=sx,by=sy;const tx2=slotX(i),ty2=deckY-BH;
      if(u>0){
        if(u<.22){by=sy+(hiY-sy)*ease(u/.22);}
        else if(u<.62){bx=sx+(tx2-sx)*ease((u-.22)/.4);by=hiY;}
        else{bx=tx2;by=hiY+(ty2-hiY)*ease((u-.62)/.38);}
      }
      rr(ctx,bx-BW/2,by,BW,BH,3);ctx.save();ctx.fillStyle=cols[i%3];ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();
      if(u>0){ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,jibY+16);ctx.stroke();
        ctx.fillStyle=INK;rr(ctx,bx-9,jibY+12,18,10,2);ctx.fill();ctx.restore();}
    }
    ctx.save();ctx.fillStyle='rgba(111,179,216,.3)';ctx.fillRect(dockX+dockW,wl,W-dockX-dockW-6,H-wl-8);ctx.strokeStyle=WATER_D;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(dockX+dockW,wl);ctx.lineTo(W-6,wl);ctx.stroke();ctx.restore();
    const wb=SW*.74,wlw=wb+(SW-wb)*(d/HH);
    if(o.phase>=1){const a=P(o,1,.6);ctx.save();ctx.globalAlpha=.85*a;ctx.strokeStyle=CB;ctx.lineWidth=3.5;ctx.setLineDash([9,6]);
      ctx.beginPath();ctx.moveTo(cx-wlw/2,wl);ctx.lineTo(cx+wlw/2,wl);ctx.lineTo(cx+wb/2,deckY+HH);ctx.lineTo(cx-wb/2,deckY+HH);ctx.closePath();ctx.stroke();ctx.restore();
      ctx.save();ctx.globalAlpha=a;pill(ctx,'물에 잠긴 부분',cx-SW*.22,wl+d+36,24,CB,'#fff');ctx.restore();}
    // 힘 화살표 : 선체 가운데(작용점)에서 위·아래로
    const B=Bfn(d),FS=60,ay=deckY+HH*.5,bx0=cx+SW*.14;
    vArrow(ctx,bx0,ay,B*FS,-1,CB,14,24);vArrow(ctx,bx0,ay,G*FS,1,CG,14,24);
    ctx.save();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(bx0,ay,6,0,TAU);ctx.fill();ctx.restore();
    pill(ctx,'부력',bx0-50,ay-B*FS+16,22,CB,'#fff');pill(ctx,'중력',bx0+50,ay+G*FS-16,22,CG,'#fff');   // 배 색과 겹쳐도 보이도록 알약 글자
    if(o.phase>=3&&o.d.load>=3){const a=P(o,3,.6);ctx.save();ctx.globalAlpha=a;band(ctx,'짐을 실을수록 부력도 커진다 (떠 있으면 부력 = 중력)',W/2,H-30,26);ctx.restore();}
  };
};

/* ---------- 잠수함. 단계 0 물 위에 떠 있다 → 1 공기탱크에 바닷물을 채운다 (중력 ↑, 부력은 완전히 잠긴 뒤에는 그대로) ---------- */
ANIMS.sub=o=>{
  const SL=330,SH=120;
  o.d.reset=()=>{o.d.y=0;o.d.v=0;o.d.fill=0;o.d.t0=null;o.d.inited=false;};o.d.reset();
  o.onPhase=k=>{if(k===0)o.d.reset();else if(o.d.t0==null)o.d.t0=o.t;};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const wl=H*.28,floor=H*.84,cx=W*.5,dt=Math.min(.04,t-(o.d.lt||t));o.d.lt=t;
    const G0=.62,G1=1.5;
    if(!o.d.inited){o.d.inited=true;o.d.y=wl+SH*G0-SH/2;}
    const tl=o.d.t0==null?0:t-o.d.t0;o.d.fill=clamp(tl/5,0,1);
    const G=G0+(G1-G0)*o.d.fill,Bf=y=>clamp((y+SH/2-wl)/SH,0,1);
    let rest=false;bodyStep(o.d,dt,Bf,G);
    if(o.d.y+SH/2>=floor){o.d.y=floor-SH/2;o.d.v=0;rest=true;}
    const y=o.d.y;
    ctx.save();ctx.fillStyle=WATER;ctx.fillRect(10,wl,W-20,floor-wl);ctx.fillStyle='#D8C9A6';ctx.fillRect(10,floor,W-20,H-floor-10);ctx.restore();
    ctx.save();ctx.lineJoin='round';
    rr(ctx,cx-SL/2,y-SH/2,SL,SH,SH/2);ctx.fillStyle='#8DA3B8';ctx.fill();ctx.lineWidth=3.4;ctx.strokeStyle=INK;ctx.stroke();
    rr(ctx,cx-30,y-SH/2-32,64,34,7);ctx.fillStyle='#8DA3B8';ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+14,y-SH/2-32);ctx.lineTo(cx+14,y-SH/2-56);ctx.lineTo(cx+40,y-SH/2-56);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-SL/2+8,y);ctx.lineTo(cx-SL/2-32,y-20);ctx.lineTo(cx-SL/2-32,y+20);ctx.closePath();ctx.fillStyle='#6E859B';ctx.fill();ctx.stroke();
    [-90,-35,20].forEach(dx=>{ctx.beginPath();ctx.arc(cx+dx,y-34,11,0,TAU);ctx.fillStyle='#E6F1FA';ctx.fill();ctx.stroke();});
    // 공기탱크 : 크게. 바닷물이 차오르면 공기가 줄어든다

    if(o.d.fill<.98){ctx.fillStyle='#9FB4C4';for(let i=0;i<9;i++){if(i>=3&&i<=5)continue;ctx.beginPath();ctx.arc(tx+20+i*27,ty+th/2,4,0,TAU);ctx.fill();}}
    ctx.restore();
    ctx.save();ctx.fillStyle='rgba(111,179,216,.28)';ctx.fillRect(10,wl,W-20,floor-wl);ctx.strokeStyle=WATER_D;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,wl);ctx.lineTo(W-10,wl);ctx.stroke();ctx.restore();
    txt(ctx,'공기탱크',tx+tw/2,ty+th/2,24,INK,'center',900);
    if(o.d.t0!=null&&o.d.fill<.98){arrow(ctx,tx-16,ty+th+26,tx+24,ty+th*.6,'#4F6B86',7,18);txt(ctx,'바닷물이 들어온다',tx-22,ty+th+40,22,SUBC,'right',800);}
    // 힘 화살표 : 몸통 가운데(작용점)에서 위·아래로

    txt(ctx,'부력',ax-38,y-B*FS+10,24,CB,'center',900);txt(ctx,'중력',ax+38,y+G*FS-6,24,CG,'center',900);

/* 슬라이드. 문장은 data.py 의 B 에서 가져와야 학습지와 빈칸이 일치한다.
   빈칸 순서는 학습지 교사용 정답과 같다: 위쪽·기체·부력 | 위 | 반대 | 감소·뺀 | 클수록·커진다 | 크면·같으면·작으면 | 부피·증가 | 중력 */

/* '해 보기' : ●에서 시작하는 화살표를 끌어서 그린다. 가까운 ●을 골라 길이는 일정하게 하고 방향만 본다. 정답 방향과 35° 이내면 맞음 (파랑 ● = 부력, 주황 ● = 중력) */
function bindArrows(el){
  const svg=el.querySelector('.scn svg');if(!svg)return;
  svg.querySelectorAll('.uarr,.ubadge').forEach(n=>n.remove());
  if(svg._bound)return;svg._bound=true;stopAll(svg);svg.style.touchAction='none';svg.style.cursor='crosshair';
  const dots=[...svg.querySelectorAll('.gdot')],NS='http://www.w3.org/2000/svg',PW=165;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  let cur=null;
  const mk=(tag,at)=>{const n=document.createElementNS(NS,tag);Object.keys(at).forEach(k=>n.setAttribute(k,at[k]));return n;};
  const draw=(c,ang)=>{const L=48,x2=c.cx+Math.cos(ang)*L,y2=c.cy+Math.sin(ang)*L,hb=12*.8;
    c.g.innerHTML='';c.g.appendChild(mk('line',{x1:c.cx+Math.cos(ang)*8,y1:c.cy+Math.sin(ang)*8,x2:x2-Math.cos(ang)*hb,y2:y2-Math.sin(ang)*hb,stroke:c.col,'stroke-width':5,'stroke-linecap':'round'}));
    const p1=[x2-Math.cos(ang-.45)*12,y2-Math.sin(ang-.45)*12],p2=[x2-Math.cos(ang+.45)*12,y2-Math.sin(ang+.45)*12];
    c.g.appendChild(mk('polygon',{points:`${x2},${y2} ${p1} ${p2}`,fill:c.col}));};
  svg.addEventListener('pointerdown',e=>{
    const p=pt(e);let best=-1,bd=1e9;dots.forEach((d,i)=>{const dd=Math.hypot(p.x-d.getAttribute('cx'),p.y-d.getAttribute('cy'));if(dd<bd){bd=dd;best=i;}});
    if(best<0||bd>34)return;const d=dots[best],i=best;
    svg.querySelectorAll(`[data-i="${i}"].uarr,[data-i="${i}"].ubadge`).forEach(n=>n.remove());
    const g=mk('g',{class:'uarr','data-i':i});svg.appendChild(g);
    cur={i,g,cx:+d.getAttribute('cx'),cy:+d.getAttribute('cy'),ok:+d.getAttribute('data-ang'),kind:d.getAttribute('data-kind'),col:d.getAttribute('fill'),ang:null};
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    move(e);});
  const move=e=>{if(!cur)return;const p=pt(e),dx=p.x-cur.cx,dy=p.y-cur.cy;if(Math.hypot(dx,dy)<6)return;cur.ang=Math.atan2(dy,dx);draw(cur,cur.ang);};
  svg.addEventListener('pointermove',move);
  const up=()=>{if(!cur)return;const c=cur;cur=null;if(c.ang==null){c.g.remove();return;}
    let df=Math.abs(c.ang*180/Math.PI-c.ok)%360;if(df>180)df=360-df;const ok=df<=35,pi=Math.floor(c.i/2),x0=pi*PW,by=c.kind==='b'?9:35;
    const b=mk('g',{class:'ubadge','data-i':c.i});
    b.appendChild(mk('rect',{x:x0+22,y:by,width:121,height:23,rx:11.5,fill:ok?'#1F7A6C':'#F4C33B'}));
    const t=mk('text',{x:x0+82.5,y:by+16,'text-anchor':'middle','font-size':12.5,'font-weight':800,fill:ok?'#fff':INK});
    t.textContent=ok?(c.kind==='b'?'부력 방향 정답!':'중력 방향 정답!'):(c.kind==='b'?'부력 방향은?':'중력 방향은?');b.appendChild(t);svg.appendChild(b);};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
