/* ---------- 화살표 ----------
   fmForce: 작용점 (x,y)(화면)에서 힘 F=[fx,fy](물리) 방향으로 길이 k·|F|. obj = 어느 물체의 힘인지(같은 물체 → 같은 k 인지 검사), eq = 평형 짝 이름(길이가 같아야 함) */
function fmForce(ctx,x,y,F,k,label,col,opt){opt=opt||{};const m=Math.hypot(F[0],F[1]);if(m<1e-12)return null;const L=k*m,ux=F[0]/m,uy=-F[1]/m,x1=x+ux*L,y1=y+uy*L;
  qaPush('farrow',{obj:opt.obj||'',name:label||'',F:[F[0],F[1]],k,len:L,ang:Math.atan2(uy,ux),eq:opt.eq||''});
  arrow(ctx,x,y,x1,y1,col||FMC.force,opt.w||8,opt.head||22);
  if(label&&opt.lab!==false){const lp=opt.lp||'end',sz=opt.sz||24;let lx,ly,al;
    if(lp==='end'){[lx,ly,al]=fmLabEnd(x1,y1,ux,uy,sz);}
    else if(lp==='side'){const s=opt.side||1;lx=(x+x1)/2+(-uy)*s*20;ly=(y+y1)/2+ux*s*20;al=(-uy)*s>0.3?'left':(-uy)*s<-0.3?'right':'center';}
    else{lx=lp[0];ly=lp[1];al=opt.al||'center';}
    if(opt.pill)fmPill(ctx,label,lx,ly,sz,col||FMC.force);else txt(ctx,label,lx,ly,sz,col||FMC.force,al,900);}
  return [x1,y1];}
/* 화살표 끝 너머에 이름표: 가로에 가까우면 끝 옆(왼/오른쪽 정렬), 세로에 가까우면 끝 위·아래 가운데 */
function fmLabEnd(x1,y1,ux,uy,sz){if(Math.abs(ux)>=.45)return [x1+ux*12,y1+uy*12+(Math.abs(uy)>.3?Math.sign(uy)*sz*.4:0),ux>0?'left':'right'];return [x1,y1+Math.sign(uy||1)*(sz*.5+10),'center'];}
/* fmMove: 운동 방향(속이 빈 화살촉, 길이 FM_ML 고정). v=[vx,vy](물리) */
function fmMove(ctx,x,y,v,label,opt){opt=opt||{};const m=Math.hypot(v[0],v[1]);if(m<1e-12)return null;const L=opt.len||FM_ML,ux=v[0]/m,uy=-v[1]/m,x1=x+ux*L,y1=y+uy*L,hl=opt.head||22,a=Math.atan2(uy,ux);
  qaPush('marrow',{v:[v[0],v[1]],ang:a,len:L});
  if(window.QA_ON&&QA.cur){const p=qaPt(ctx,x,y),q=qaPt(ctx,x1,y1);QA.cur._qa.push({x1:p[0],y1:p[1],x2:q[0],y2:q[1],c:FMC.move});}
  ctx.save();ctx.strokeStyle=FMC.move;ctx.lineWidth=opt.w||7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x1-ux*hl*.85,y1-uy*hl*.85);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-Math.cos(a-.45)*hl,y1-Math.sin(a-.45)*hl);ctx.lineTo(x1-Math.cos(a+.45)*hl,y1-Math.sin(a+.45)*hl);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();ctx.restore();
  if(label&&opt.lab!==false){const lp=opt.lp||'end';let lx,ly,al;if(lp==='end'){[lx,ly,al]=fmLabEnd(x1,y1,ux,uy,opt.sz||24);}
    else if(lp==='side'){const s=opt.side||1;lx=(x+x1)/2+(-uy)*s*22;ly=(y+y1)/2+ux*s*22;al=(-uy)*s>0.3?'left':(-uy)*s<-0.3?'right':'center';}else{lx=lp[0];ly=lp[1];al=opt.al||'center';}
    txt(ctx,label,lx,ly,opt.sz||24,FMC.move,al,900);}
  return [x1,y1];}

/* ---------- 물체 ----------
   굴러가는 공(v3.33): roll = {th} 이면 옆에서 본 공 — 무늬 전체가 회전각 th(= 지나온 길이 / 그린 반지름)만큼 돈다(미끄러지면 무늬가 돌지 않는다).
   roll = {th, ux, uy} 이면 위에서 본 공 — 회전축이 수평이라 무늬가 운동 방향(ux,uy)으로 넘어가 사라지고 반대쪽에서 다시 나타난다(무늬 위치 = r·sin th, 보이는 쪽 cos th > 0). */
function fmBall(ctx,x,y,r,kind,alpha,roll){const K={pp:['#FFB347','#B4540F'],tennis:['#C9E265','#6C8A1E'],golf:['#FFFFFF','#7D8A90'],bb:['#E07A2F','#8A3D12'],puck:['#7FC7B8','#1F7A6C'],book:['#E9C46A','#8A6A1E']}[kind||'pp'];
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=K[0];ctx.fill();
  ctx.save();ctx.clip();
  if(roll&&roll.ux!=null){const th=roll.th;[0,Math.PI].forEach(ph=>{const c=Math.cos(th+ph);if(c<=0)return;const d=r*Math.sin(th+ph)*.82,mx=x+roll.ux*d,my=y+roll.uy*d,a=Math.atan2(roll.uy,roll.ux);
      ctx.save();ctx.translate(mx,my);ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,0,Math.max(1,r*.34*c),r*.34,0,0,TAU);ctx.fillStyle=K[1];ctx.globalAlpha*=.55;ctx.fill();ctx.restore();});
    /* 둥근 공으로 보이게 밝은 면 */
    ctx.beginPath();ctx.arc(x-r*.32,y-r*.32,r*.35,0,TAU);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();}
  else{const th=roll?roll.th:0;ctx.translate(x,y);ctx.rotate(th);ctx.translate(-x,-y);
    if(kind==='pp'||kind==='puck'){ctx.strokeStyle=K[1];ctx.lineWidth=Math.max(1.5,r*.1);ctx.globalAlpha*=.7;ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y-r*.5,r*.18,0,TAU);ctx.fillStyle=K[1];ctx.fill();}
    if(kind==='tennis'){ctx.lineWidth=Math.max(1.5,r*.1);ctx.strokeStyle='#F5F9E8';ctx.beginPath();ctx.arc(x-r*.9,y,r*.75,-1,1);ctx.stroke();ctx.beginPath();ctx.arc(x+r*.9,y,r*.75,Math.PI-1,Math.PI+1);ctx.stroke();}
    if(kind==='bb'){ctx.lineWidth=Math.max(1.5,r*.08);ctx.strokeStyle='#5A2A0A';ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();ctx.beginPath();ctx.arc(x-r*1.3,y,r*.95,-.75,.75);ctx.stroke();ctx.beginPath();ctx.arc(x+r*1.3,y,r*.95,Math.PI-.75,Math.PI+.75);ctx.stroke();}
    if(kind==='golf'){ctx.fillStyle='rgba(125,138,144,.45)';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(x+Math.cos(i*.9)*r*.55,y+Math.sin(i*.9)*r*.55,r*.13,0,TAU);ctx.fill();}ctx.beginPath();ctx.arc(x,y-r*.55,r*.2,0,TAU);ctx.fillStyle='#D8382B';ctx.fill();}}
  ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.lineWidth=Math.max(2,r*.14);ctx.strokeStyle=K[1];ctx.stroke();ctx.restore();}
/* 굴러가는 공의 회전 정보: 엔진의 지나온 길이 s(m) × 화면 배율 k ÷ 그린 반지름 r(px). side=true 옆모습, 아니면 위에서 본 모습(속도 방향 필요) */
function fmRoll(p,k,r,side){const th=(p.s||0)*k/r;if(side)return {th:Math.sign(p.vx||1)*th};const v=Math.hypot(p.vx,p.vy)||1,ux=(p.vx||1)/v,uy=-(p.vy||0)/v;return {th,ux,uy};}
/* 잔상(같은 시간 간격의 물체 모습): pts = 화면 좌표 [[x,y,roll?],…] — 나중 것일수록 진하게 */
function fmGhosts(ctx,pts,r,kind,opt){opt=opt||{};const n=pts.length;qaPush('flash',{n,pts:pts.map(p=>[Math.round(p[0]),Math.round(p[1])])});
  pts.forEach((p,i)=>fmBall(ctx,p[0],p[1],r,kind,(opt.a0==null?.22:opt.a0)+(opt.a1==null?.5:opt.a1)*(i/Math.max(1,n-1)),p[2]));}
/* 옆에서 본 손(한 덩어리 윤곽 — 손바닥·네 손가락·엄지·손목·소매). up=true: 손바닥이 위(공을 받친다), false: 손바닥이 아래(위에서 공을 쥔다).
   (x,y) = 손바닥 가운데(공이 닿는 곳). 손가락은 +x 쪽, 소매는 −x 쪽. 손가락 끝이 살짝 말려 올라가 공을 감싼다. */
function fmHand(ctx,x,y,s,up,dir){const sy=up?1:-1,sx=dir||1,sk='#F2C4A2',sk2='#E3A982',ol='#8F5E42';ctx.save();ctx.translate(x,y);ctx.scale(s*sx,s*sy);ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=2.2/s;ctx.strokeStyle=ol;
  ctx.fillStyle='#7FC7B8';rr(ctx,-96,-4,34,24,5);ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(31,122,108,.6)';ctx.beginPath();ctx.moveTo(-70,-2);ctx.lineTo(-70,18);ctx.stroke();ctx.strokeStyle=ol;
  ctx.fillStyle=sk;ctx.beginPath();
  ctx.moveTo(-64,-1);ctx.bezierCurveTo(-48,-2,-34,2,-22,3);           /* 손목 위 → 손바닥(살짝 오목 — 공이 놓이는 곳) */
  ctx.bezierCurveTo(-8,5,8,4,20,1);ctx.bezierCurveTo(30,-2,38,-8,42,-12);   /* 손가락 안쪽 — 끝이 위로 말림 */
  ctx.bezierCurveTo(46,-15,50,-12,48,-8);ctx.bezierCurveTo(44,2,34,10,20,13); /* 손가락 끝 둥글게 → 손가락 바깥쪽 */
  ctx.bezierCurveTo(2,17,-24,18,-44,16);ctx.bezierCurveTo(-54,15,-60,17,-64,18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle=sk2;ctx.lineWidth=1.6/s;[[6,6,34,-3],[8,10,38,2],[4,13,30,9]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.quadraticCurveTo((a+c)/2,(b+d)/2+3,c,d);ctx.stroke();});   /* 손가락 사이 */
  ctx.strokeStyle=ol;ctx.lineWidth=2.2/s;ctx.fillStyle=sk;ctx.beginPath();                    /* 엄지(손바닥 쪽에서 앞으로 뻗음) */
  ctx.moveTo(-30,4);ctx.bezierCurveTo(-24,-6,-14,-12,-4,-13);ctx.bezierCurveTo(2,-14,4,-9,0,-7);ctx.bezierCurveTo(-8,-4,-14,0,-18,5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-3,-11,2.6,1.6,-.3,0,TAU);ctx.fill();   /* 엄지 손톱 */
  ctx.restore();}
/* 휴대용 선풍기(위에서 본 모습): (x,y) 바람이 나오는 면의 가운데, ang = 바람의 방향(화면 각) */
/* 바람(공기 흐름): 선풍기 앞에서 바람 방향으로 흘러가며 조금씩 퍼지는 바람줄기(꺾쇠 머리) — 지역 좌표(+x = 바람 방향) */
function fmAir(ctx,s,tt,reach,al){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3.2;
  for(let i=0;i<10;i++){const p=((tt||0)*.85+i*.381)%1,a=(al==null?1:al)*Math.sin(Math.PI*p),x=10*s+p*reach,base=(((i*3)%5)-2)*11*s,yy=base*(1+.9*p)+Math.sin((tt||0)*5+i)*2*s,L=24*s;
    ctx.strokeStyle=`rgba(122,91,181,${(.75*a).toFixed(3)})`;ctx.beginPath();ctx.moveTo(x-L,yy);ctx.lineTo(x,yy);ctx.moveTo(x-8*s,yy-6*s);ctx.lineTo(x,yy);ctx.lineTo(x-8*s,yy+6*s);ctx.stroke();}
  ctx.restore();}
function fmFan(ctx,x,y,ang,s,on,tt,reach){s=s||1;ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.lineJoin='round';ctx.strokeStyle='#33404A';ctx.lineWidth=3;
  ctx.fillStyle='#F2A7B5';rr(ctx,-58*s,-9*s,34*s,18*s,6*s);ctx.fill();ctx.stroke();
  ctx.fillStyle='#FFF4F6';rr(ctx,-26*s,-30*s,24*s,60*s,10*s);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(51,64,74,.5)';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(-2*s,i*11*s);ctx.lineTo(-26*s,i*11*s);ctx.stroke();}
  if(on)fmAir(ctx,s,tt,reach||120*s);
  ctx.restore();}

/* ---------- 엔진 표본 → 화면 ---------- */
/* 비교용 잔상: 바람이 없을 때 같은 시각의 공(점선 원 — 색이 아니라 모양으로 구별) */
function fmGhostRef(ctx,P,r){ctx.save();ctx.setLineDash([5,4]);ctx.lineWidth=2.2;ctx.strokeStyle='rgba(70,84,80,.75)';P.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();});ctx.restore();}
function fmFlashPts(sim,V,filter){return sim.flashes.filter(filter||(()=>true)).map(p=>[V.X(p.x),V.Y(p.y)]);}
/* 그린 물체 자리 기록(엔진 값과 같은지 검사) */
function fmObj(id,V,s,sx,sy){qaPush('obj',{id,x:s.x,y:s.y,sx,sy,ex:V.X(s.x),ey:V.Y(s.y)});}

/* ---------- 쇼트 트랙 선수(옆모습, 오른쪽을 향해 깊이 웅크린 자세) — 경기복·헬멧(고글)·장갑·긴 날 ----------
   (x,y) = 날이 얼음에 닿는 곳의 가운데. 단위: 키 약 62(웅크림). reach = 앞으로 뻗은 팔이 더 나가는 길이(미는 선수). ghost=true 면 흐린 한 가지 색(잔상) */
function fmSkater(ctx,x,y,s,col,reach,ghost){s=s||1;reach=reach||0;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineJoin='round';ctx.lineCap='round';
  const suit=ghost?'#9DB3CF':col,dark=ghost?'#B9C6D6':'#1F2A44',ol=ghost?'rgba(0,0,0,0)':'#22303A';
  const limb=(pts,w,c)=>{ctx.strokeStyle=ol;ctx.lineWidth=w+2.4;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke();};
  const blade=(x0,x1,yb)=>{ctx.strokeStyle=ghost?'#C9D3DC':'#7D8A90';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x0,yb);ctx.lineTo(x1,yb);ctx.quadraticCurveTo(x1+3,yb-1,x1+3,yb-3);ctx.stroke();};
  /* 뒤로 뻗은 다리(밀기 다리) */
  limb([[-4,-28],[-20,-18],[-34,-9]],7,dark);ctx.fillStyle=ghost?'#C9D3DC':'#111';rr(ctx,-42,-11,14,7,2);ctx.fill();blade(-46,-26,-2.5);
  ctx.strokeStyle=ghost?'#C9D3DC':'#7D8A90';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-40,-4);ctx.lineTo(-41,-2.5);ctx.moveTo(-31,-4);ctx.lineTo(-30,-2.5);ctx.stroke();
  /* 굽힌 앞다리 */
  limb([[0,-30],[16,-22],[8,-6]],7.5,dark);ctx.fillStyle=ghost?'#C9D3DC':'#111';rr(ctx,2,-8,14,7,2);ctx.fill();blade(-4,22,0);
  ctx.strokeStyle=ghost?'#C9D3DC':'#7D8A90';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(5,-1);ctx.lineTo(5,0);ctx.moveTo(14,-1);ctx.lineTo(14,0);ctx.stroke();
  /* 몸통(거의 수평으로 숙임) + 옆줄 무늬 */
  ctx.fillStyle=suit;ctx.strokeStyle=ol;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-34);ctx.bezierCurveTo(-6,-46,10,-50,26,-45);ctx.lineTo(27,-38);ctx.bezierCurveTo(12,-37,0,-30,-6,-25);ctx.closePath();ctx.fill();ctx.stroke();
  if(!ghost){ctx.strokeStyle='#F4C33B';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-5,-32);ctx.bezierCurveTo(4,-40,14,-42,25,-41);ctx.stroke();}
  /* 뒷짐 진 팔(뒤 손이 허리 위에) · 앞팔(미는 선수는 앞으로 뻗음) */
  limb([[20,-43],[8,-44],[-2,-40]],5,suit);
  if(reach>0){limb([[22,-41],[30+reach*.6,-38],[36+reach,-36]],5,suit);ctx.fillStyle=ghost?'#DDE4EA':'#FFFFFF';ctx.strokeStyle=ol;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(38+reach,-36,3.4,0,TAU);ctx.fill();ctx.stroke();}
  else{limb([[22,-41],[24,-33],[22,-26]],5,suit);ctx.fillStyle=ghost?'#DDE4EA':'#FFFFFF';ctx.strokeStyle=ol;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(22,-24.5,3.2,0,TAU);ctx.fill();ctx.stroke();}
  /* 헬멧 + 고글 */
  ctx.fillStyle=suit;ctx.strokeStyle=ol;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(33,-46,7.6,6.8,.15,0,TAU);ctx.fill();ctx.stroke();
  if(!ghost){ctx.fillStyle='#2B3A4A';ctx.beginPath();ctx.ellipse(38,-45,3.4,2.4,.15,0,TAU);ctx.fill();ctx.fillStyle='#F2C4A2';ctx.beginPath();ctx.ellipse(37,-40.5,3,2,0,0,TAU);ctx.fill();}
  ctx.restore();}
/* 놀이기구 아이콘(학습지 ride_icon 과 같은 모양) */
function fmBook(ctx,x,y,w,h,ang){ctx.save();ctx.translate(x,y);ctx.rotate(ang||0);ctx.fillStyle='#E9C46A';ctx.strokeStyle='#8A6A1E';ctx.lineWidth=3;rr(ctx,-w/2,-h/2,w,h,4);ctx.fill();ctx.stroke();ctx.fillStyle='#FFF8E1';ctx.fillRect(-w/2+6,h/2-9,w-12,6);ctx.restore();}

/* 물체에 작용하는 힘과 운동 — 애니메이션. 움직임은 모두 엔진 FM(engine/sim_forcemotion.js)이 시간 걸음으로 계산한 값이다.
   빈칸 공개 단계(o.phase) = 학습지 빈칸 순서. 결과(잔상·움직임)는 그 결과를 묻는 빈칸을 열 때, 또는 실험 버튼을 누를 때 처음 나타난다.
   화살표: fmForce(길이 = k × 힘의 크기, 같은 물체 같은 k) · fmMove(운동 방향, 길이 일정) — 모두 엔진 값에서 그리고 qaPush 로 기록(qa_spec.js 가 대조). */

/* 공용: 시뮬을 화면 시간에 맞춰 돌린다(pace = 느리게 보기 배율). 결과는 프레임 간격과 무관(엔진이 정수 걸음으로만 감) */
function fmRun(o,key,mk,pace,on){const d=o.d;if(!d[key])d[key]=mk();const s=d[key];if(on){s.advance(o._dt*(pace||1));}return s;}
function fmReset(o,key){o.d[key]=null;}

/* ================= 표지 : 책상 위를 굴러가는 탁구공(위에서 본 모습 — 결과를 미리 보이지 않게 바람 없이) ================= */
ANIMS.cover=o=>{let s=null,hold=0;o.frame=()=>{const {ctx,W,H}=o;clear(o,false);const dt=fmTick(o);o._dt=dt;
  if(!s||hold>1.6){s=mkFan(0);hold=0;}s.advance(dt);if(s.frozen)hold+=dt;
  const F=D.FAN,k=(W-60)/(F.table[2]-F.table[0]),V=fmView(30-F.table[0]*k,H*.58,k);
  ctx.save();rr(ctx,V.X(F.table[0]),V.Y(F.table[3]),(F.table[2]-F.table[0])*k,(F.table[3]-F.table[1])*k,18);ctx.fillStyle=FMC.table;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=FMC.tableE;ctx.stroke();ctx.restore();
  fmGhosts(ctx,s.flashes.filter(p=>p.x>=0).map(p=>[V.X(p.x),V.Y(p.y),fmRoll(p,k,13)]),13,'pp');fmBall(ctx,V.X(s.x),V.Y(s.y),13,'pp',1,fmRoll(s,k,13));
  qaState(o,{x:s.x,y:s.y});};};

/* ================= STAGE 1 도입 : 서랍장 위의 책을 고양이가 앞발로 민다 ================= */
function fmDrawer(ctx,x,y,w,h){ctx.save();ctx.fillStyle='#8A5A3B';ctx.strokeStyle='#4E3220';ctx.lineWidth=3;rr(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
  for(let i=0;i<3;i++){const yy=y+14+i*(h-20)/3;ctx.fillStyle='#A06C48';rr(ctx,x+12,yy,w-24,(h-20)/3-10,6);ctx.fill();ctx.stroke();ctx.fillStyle='#4E3220';ctx.fillRect(x+w/2-24,yy+(h-20)/6-8,48,8);}
  ctx.restore();}
/* 서랍장 위에 앉은 고양이(왼쪽을 봄). (cx,cy) = 고양이가 앉은 바닥 가운데, paw = 앞발 끝이 닿는 곳(책의 오른쪽 면) — 앞발 길이는 어깨에서 발끝까지 */
function fmCat(ctx,cx,cy,paw){ctx.save();ctx.lineJoin='round';ctx.lineCap='round';const ol='#8A4B1E',fur='#F2A65A',st='#C7782F';
  ctx.strokeStyle=ol;ctx.lineWidth=3;ctx.fillStyle=fur;
  ctx.beginPath();ctx.moveTo(cx+38,cy-6);ctx.bezierCurveTo(cx+80,cy-10,cx+86,cy-60,cx+66,cy-84);ctx.stroke();ctx.strokeStyle=fur;ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle=ol;ctx.lineWidth=3;   /* 꼬리 */
  ctx.beginPath();ctx.ellipse(cx+16,cy-34,36,34,0,0,TAU);ctx.fill();ctx.stroke();                                   /* 몸 */
  ctx.strokeStyle=st;ctx.lineWidth=5;[[6,-58,12,-40],[22,-62,26,-42],[38,-52,40,-34]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(cx+a,cy+b);ctx.lineTo(cx+c,cy+d);ctx.stroke();});
  ctx.strokeStyle=ol;ctx.lineWidth=3;ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(cx+22,cy-4,14,8,0,0,TAU);ctx.fill();ctx.stroke();   /* 뒷발 */
  /* 앞다리: 어깨 → 발끝 */
  const sx=cx-8,sy=cy-44,ang=Math.atan2(paw[1]-sy,paw[0]-sx),L=Math.hypot(paw[0]-sx,paw[1]-sy)-8;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(ang);ctx.fillStyle=fur;ctx.beginPath();rr(ctx,0,-8,L,16,8);ctx.fill();ctx.stroke();
  ctx.strokeStyle=st;ctx.lineWidth=4;for(let q=L*.3;q<L-12;q+=L*.28){ctx.beginPath();ctx.moveTo(q,-7);ctx.lineTo(q+3,7);ctx.stroke();}
  ctx.strokeStyle=ol;ctx.lineWidth=3;ctx.fillStyle='#F6B26B';ctx.beginPath();ctx.ellipse(L,0,10,11,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#F6B26B';[-6,0,6].forEach(d=>{ctx.beginPath();ctx.arc(L+7,d,3.4,0,TAU);ctx.fill();ctx.stroke();});ctx.restore();
  /* 머리 */
  const hx=cx-10,hy=cy-80;ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(hx-20,hy-12);ctx.lineTo(hx-16,hy-40);ctx.lineTo(hx-2,hy-22);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(hx+20,hy-12);ctx.lineTo(hx+18,hy-40);ctx.lineTo(hx+4,hy-22);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(hx,hy,24,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#33404A';ctx.beginPath();ctx.ellipse(hx-10,hy-2,3,5,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(hx+6,hy-2,3,5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#E07A8F';ctx.beginPath();ctx.moveTo(hx-5,hy+7);ctx.lineTo(hx+1,hy+7);ctx.lineTo(hx-2,hy+11);ctx.closePath();ctx.fill();
  ctx.strokeStyle=ol;ctx.lineWidth=1.6;[[-14,8,-30,4],[-14,11,-30,13],[10,8,26,4],[10,11,26,13]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(hx+a,hy+b);ctx.lineTo(hx+c,hy+d);ctx.stroke();});
  ctx.restore();}
/* 서랍장 위 책 모형: 고양이가 앞발로 잠깐(0.12 초) 민다 → 미는 힘 > 최대 정지 마찰력 → 미끄러지며 마찰력으로 느려짐 → 서랍장 끝에서 사진처럼 멈춤(다음 순간은 도입 질문)
   크기: 서랍장 폭 0.9 m · 책 폭 0.25 m · 책의 왼쪽 끝이 서랍장 끝에서 0.25 m. 마찰 계수 0.3(나무 위 책) — 숫자는 화면에 쓰지 않음 */
const FM_BOOK={F:30,push:.07,mu:.3,edge:-.25,w:.25,chest:.9};
const mkBook=()=>FM.sim({x:0,vx:0,forces:[{k:'const',fx:-FM_BOOK.F,fy:0,t0:0,t1:FM_BOOK.push,name:'미는 힘'},{k:'friction',mu:FM_BOOK.mu,name:'마찰력'}],until:s=>s.x<=FM_BOOK.edge});
ANIMS.intro=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);const dt=fmTick(o);o._dt=dt;const ph=o.phase;
  const dx=W*.1,dy=H*.44,dw=W*.62,k=dw/FM_BOOK.chest,bw=FM_BOOK.w*k,bh=34,X0=dx+(-FM_BOOK.edge)*k+bw/2,V=fmView(X0,dy-bh/2,k);
  fmDrawer(ctx,dx,dy,dw,H*.5);ctx.fillStyle='#C9B79C';ctx.fillRect(16,dy+H*.5,W-32,8);
  const s=fmRun(o,'b',mkBook,.2,ph>=1);
  const bx=V.X(s.x),by=dy-bh/2;
  /* 앞발: 미는 동안 책의 오른쪽 면에 붙어 따라가고, 다 민 뒤에는 그 자리에 잠깐 멈췄다가 천천히 돌아온다(책과 떨어짐) */
  const rest=X0+bw/2,endX=V.X(o.d.xEnd!=null?o.d.xEnd:0)+bw/2;if(s.t>=FM_BOOK.push&&o.d.xEnd==null)o.d.xEnd=s.x;
  const pawX=s.t<FM_BOOK.push||o.d.xEnd==null?bx+bw/2:(s.t<FM_BOOK.push+.5?endX:endX+(rest-endX)*Math.min(1,(s.t-FM_BOOK.push-.5)/.6));
  fmBook(ctx,bx,by,bw,bh);fmObj('book',V,s,bx,V.Y(0));fmCat(ctx,rest+70,dy,[pawX+12,by]);
  const pushing=ph>=1&&s.t<FM_BOOK.push;
  if(pushing){const L=s.forceList().find(f=>f.name==='미는 힘');fmForce(ctx,bx+bw/2,by,[L.fx,L.fy],5,'미는 힘',FMC.force,{obj:'book',lp:[bx,by-44]});}
  if(ph>=1&&s.frozen){fmPill(ctx,'⏸ 사진처럼 잠깐 멈춤 — 다음 순간 책은?',W*.5,H*.1,26,FMC.ans,'#FFF3E6');}
  if(ph<1)fmPill(ctx,'고양이가 앞발로 책을 밀면?',W*.5,H*.1,26,FMC.ink);
  qaState(o,{res:false,pushed:ph>=1,pushing,paw:pawX,bookR:bx+bw/2});};};

/* ================= 해 보기 과정 : 장치(옆에서 본 모습) — 미끄럼대는 받침대 위에 걸쳐 있고, 공은 미끄럼대를 굴러 내려와 책상 위를 굴러간다 ================= */
ANIMS.lab=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);const dt=fmTick(o);o._dt=dt;const ph=o.phase;
  const ty=H*.66,tx0=W*.04,tx1=W*.96,F=D.FAN,r=17,rampH=H*.24,sx0=W*.07,sx1=W*.17,sy=ty-rampH;
  ctx.save();ctx.fillStyle=FMC.table;ctx.strokeStyle=FMC.tableE;ctx.lineWidth=3;rr(ctx,tx0,ty,tx1-tx0,22,5);ctx.fill();ctx.stroke();ctx.fillStyle=FMC.tableE;ctx.fillRect(tx0+30,ty+22,18,H*.2);ctx.fillRect(tx1-48,ty+22,18,H*.2);ctx.restore();
  ctx.save();ctx.fillStyle='#D9E6EE';ctx.strokeStyle='#7D97A8';ctx.lineWidth=3;rr(ctx,sx0,sy,sx1-sx0,rampH,6);ctx.fill();ctx.stroke();ctx.restore();   /* 받침대 */
  const A=[sx1-14,sy-7],Bp=[W*.4,ty-7],L=Math.hypot(Bp[0]-A[0],Bp[1]-A[1]),ux=(Bp[0]-A[0])/L,uy=(Bp[1]-A[1])/L,nx=uy,ny=-ux;   /* 미끄럼대 윗면 선(받침대 윗면 모서리 → 책상) */
  ctx.save();ctx.lineCap='round';ctx.strokeStyle=ph===1?FMC.ans:'#7E9152';ctx.lineWidth=ph===1?18:14;ctx.beginPath();ctx.moveTo(A[0]-ux*16,A[1]-uy*16);ctx.lineTo(Bp[0],Bp[1]);ctx.stroke();ctx.strokeStyle='#B9C98E';ctx.lineWidth=8;ctx.stroke();ctx.restore();
  const mx=A[0]+ux*L*.66,my=A[1]+uy*L*.66;
  txt(ctx,'받침대',(sx0+sx1)/2,sy+rampH*.55,24,FMC.SUBT,'center',800);txt(ctx,'미끄럼대',mx-nx*62,my-ny*62+8,24,FMC.SUBT,'center',800);txt(ctx,'책상',tx1-90,ty+50,24,FMC.SUBT,'center',800);
  /* 공 중심이 지나는 길: 미끄럼대 윗면에서 (반지름+판 두께의 반)만큼 위 → 책상 위에서 반지름만큼 위. 두 길이 만나는 곳에서 이어짐(자리·빠르기 끊김 없음) */
  const off=r+7,C0=[A[0]+nx*off,A[1]+ny*off],tS=(ty-r-C0[1])/uy,Xb=C0[0]+ux*tS;
  const k=(tx1-60-Xb)/F.end,Lm=tS/k;   /* 같은 화면 축척(px/m)으로 미끄럼대 길이를 m 로 */
  const mkSide=()=>FM.sim({x:-Lm,y:0,flashEvery:0,forces:[{k:'const',fx:F.v0*F.v0/(2*Lm),fy:0,zone:[-Lm-.01,-1,0,1],name:'ramp'},{k:'friction',mu:F.mu,name:'마찰력'}],until:q=>q.x>=F.end});   /* 미끄럼대 위: 일정하게 빨라짐 → 끝에서 속력 v0 → 책상 위: 거의 같은 빠르기 */
  const s=fmRun(o,'r',mkSide,1.5,ph===2);if(ph===2&&s.frozen){o.d.hold=(o.d.hold||0)+dt;if(o.d.hold>1){fmReset(o,'r');o.d.hold=0;}}
  const onR=s.x<0,bx=onR?C0[0]+ux*(tS+s.x*k):Xb+s.x*k,by=onR?C0[1]+uy*(tS+s.x*k):ty-r,path=(s.x+Lm)*k;
  fmBall(ctx,bx,by,r,'pp',1,{th:path/r});if(ph!==2)txt(ctx,'탁구공',bx+4,by-44,24,FMC.SUBT,'center',800);
  if(ph===2&&s.speed()>1e-6)fmMove(ctx,bx-30,by-56,onR?[ux,-uy]:[s.vx,s.vy],'운동 방향',{lp:[bx+50,by-56],al:'left'});
  if(ph>=3){const fx=W*.74,fy=ty-34;fmFan(ctx,fx,fy,Math.PI,1,false,0);txt(ctx,'휴대용 선풍기',fx-10,fy-56,24,FMC.SUBT,'center',800);
    fmPill(ctx,'같은 방향 · 반대 방향 · 나란하지 않은 방향',W*.5,H*.1,24,FMC.wind);}
  qaState(o,{res:false,roll:path/r});};};

/* ================= [시뮬] 탁구공과 바람(위에서 본 책상) ================= */
const FAN_ANS={1:0,2:1,3:2};   /* 예상 정답 키 — check_scenes 가 실제 실험 결과(엔진)와 대조한다 */
const FAN_OPT={1:[[0,'빨라진다'],[1,'느려진다'],[2,'방향이 바뀐다']],2:[[0,'빨라진다'],[1,'느려진다'],[2,'방향이 바뀐다']],3:[[0,'속력만'],[1,'운동 방향만'],[2,'둘 다 변한다']]};
const fanKey=(e,c)=>e===3?(c.dir&&c.speed?2:c.dir?1:0):(c.dir?2:c.speed>0?0:1);   /* 실험 결과(엔진 비교) → 예상 보기 번호 */
function fmFanRun(sp,e){const d=sp.data;if(!d.init)return;if(e&&sp.v['p'+e]==null){d.msg='먼저 결과를 예상해 골라 보자!';d.cls='';return;}
  Object.assign(d,{ex:e,run:true,s:mkFan(e),msg:e?'과정 '+e+' — 미끄럼대에서 공을 굴린다…':'바람 없이 공을 굴린다…',cls:'',lift:0,done:false});}
const SPFAN=SIMSPEC.define({id:'fan',
  vars:[{id:'p1',label:'예상 ①',choice:FAN_OPT[1],def:null},{id:'p2',label:'예상 ②',choice:FAN_OPT[2],def:null},{id:'p3',label:'예상 ③',choice:FAN_OPT[3],def:null}],
  flow:[{label:'예상: 바람이 공의 운동 방향과 같은 방향이면 공은?',var:'p1'},{label:'① 같은 방향으로 바람',act:'e1',btn:'실험'},
        {label:'예상: 반대 방향이면 공은?',var:'p2'},{label:'② 반대 방향으로 바람',act:'e2',btn:'실험'},
        {label:'예상: 나란하지 않은 방향이면?',var:'p3'},{label:'③ 나란하지 않은 방향으로 바람',act:'e3',btn:'실험'}],
  extra:[{id:'e1',label:'실험',onClick:sp=>fmFanRun(sp,1)},{id:'e2',label:'실험',onClick:sp=>fmFanRun(sp,2)},{id:'e3',label:'실험',onClick:sp=>fmFanRun(sp,3)},
         {id:'base',label:'바람 없이 굴리기',onClick:sp=>fmFanRun(sp,0)}],
  pace:1,compact:true,clickDriven:true,scale:{mode:'schematic',note:'공은 보기 쉽게 크게 그렸고 책상·바람 구간은 모식이다(숫자 없음)'},motion:true});
ANIMS.fansim=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o,false);const sp=SPFAN,d=sp.data,v=sp.v;
  if(!d.init)Object.assign(d,{init:1,ex:0,run:false,s:null,rec:{},msg:'',cls:'',tt:0,lift:0,done:false});
  const dt=sp.dt(o.t);d.tt+=dt;o._tt=d.tt;fmBg(o);
  const F=D.FAN,k=(W-60)/(F.table[2]-F.table[0]),V=fmView(30-F.table[0]*k,H*.555,k);
  /* 책상 · 미끄럼대 */

/* ================= 쇼트 트랙 : 같은 빠르기로 미끄러지다가 → 미는 동안만 미는 힘(빨라짐) → 손이 떨어진 뒤 그 빠르기로 계속 ================= */
const mkBack=()=>FM.sim({vx:D.SKATE.v0,forces:[{k:'const',fx:-D.SKATE.F,fy:0,t0:D.SKATE.t0,t1:D.SKATE.push,name:'앞 선수가 미는 힘(반작용)'},{k:'friction',mu:D.SKATE.mu,name:'마찰력'}]});   /* 미는 동안 뒤 선수도 같은 크기의 힘을 반대 방향으로 받는다(교사 메모) */
ANIMS.skate=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);o._hits=[];const dt=fmTick(o);o._dt=dt;const ph=o.phase,run=ph>=1,TE=D.SKATE.push+1.7;
  const k=(W-270)/6.9,iy=H*.76,V=fmView(140,iy,k),sc=2.7,d0=(46*sc)/k;
  ctx.save();ctx.fillStyle='#E8F3F8';rr(ctx,20,iy,W-40,H*.2,12);ctx.fill();ctx.strokeStyle='#B8D4E0';ctx.lineWidth=2;ctx.stroke();ctx.restore();txt(ctx,'얼음',W-70,iy+92,24,FMC.SUBT,'center',800);
  const f=fmRun(o,'f',mkSkate,.6,run),b=fmRun(o,'b',mkBack,.6,run&&!(f.t>TE));if(f.t>TE)f.frozen=true;

  f.flashes.forEach((p,i)=>{fmSkater(ctx,V.X(p.x+d0),iy,sc,'#2F5FB0',0,true);});
  qaPush('flash',{n:f.flashes.length});
  f.flashes.forEach((p,i)=>{const x=V.X(p.x+d0);ctx.save();ctx.strokeStyle=p.t>D.SKATE.t0+1e-9&&p.t<=D.SKATE.push+1e-9?FMC.ans:'#5C6B68';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,iy+10);ctx.lineTo(x,iy+30);ctx.stroke();ctx.restore();});
  const P=f.flashes,iA=P.findIndex(p=>p.t>=D.SKATE.t0-1e-9),iB=P.findIndex(p=>p.t>=D.SKATE.push-1e-9);
  if(iA>=0&&iB>iA){const xa=V.X(P[iA].x+d0),xb2=V.X(P[iB].x+d0);ctx.save();ctx.fillStyle='rgba(180,84,15,.16)';ctx.fillRect(xa,iy+34,xb2-xa,26);ctx.restore();txt(ctx,'미는 동안',(xa+xb2)/2,iy+47,24,FMC.ans,'center',900);}
  const xb=V.X(b.x),xf=V.X(f.x+d0),pushing=run&&f.t>=D.SKATE.t0&&f.t<D.SKATE.push;
  const reach=f.t<D.SKATE.push?Math.max(0,Math.min(34,((xf-6*sc)-xb)/sc-38)):0;   /* 뒤 선수의 손끝 = 앞 선수의 허리(밀기 전·미는 동안) */
  fmSkater(ctx,xb,iy,sc,'#5C6B68',reach);fmSkater(ctx,xf,iy,sc,'#2F5FB0',0);fmObj('front',V,{x:f.x+d0,y:0},xf,iy);
  fmMove(ctx,xf-10,iy-sc*72,[1,0],'운동 방향',{len:70,lp:[xf+70,iy-sc*72],al:'left'});
  const L=f.forceList().find(x=>x.name==='미는 힘');
  if(L.on)fmForce(ctx,xf-sc*7,iy-sc*31,[L.fx,L.fy],150,'미는 힘',FMC.force,{obj:'front',lp:[xf-sc*4,iy-sc*62],pill:true});
  if(!run)fmPill(ctx,'뒤 선수가 앞 선수를 밀면?',W*.5,H*.1,26,FMC.ink);
  else if(f.t<D.SKATE.t0)fmPill(ctx,'두 선수가 같은 빠르기로 미끄러진다',W*.5,H*.1,24,FMC.ink);
  else if(f.t>=D.SKATE.push)fmPill(ctx,'손이 떨어진 뒤에는 더 빨라지지 않고 그 빠르기로 계속 미끄러진다',W*.5,H*.1,24,FMC.ans,'#FFF3E6');
  if(run&&f.frozen)fmReplay(o,W-110,H*.22,()=>{fmReset(o,'f');fmReset(o,'b');});
  txt(ctx,'흐린 모습·눈금 = 같은 시간 간격',40,H*.22,24,FMC.SUBT,'left',800);
  if(!run){/* 출발 전 장면: 두 선수가 함께 달리고 있다(바람에 날리는 듯한 속도선 + 운동 방향) — 결과(밀린 뒤)는 보이지 않는다 */
    [xb,xf].forEach(x=>{ctx.save();ctx.strokeStyle='rgba(92,107,104,.45)';ctx.lineWidth=3;ctx.lineCap='round';[-60,-40,-20].forEach((dy,j)=>{ctx.beginPath();ctx.moveTo(Math.max(70,x-sc*40-20-j*8),iy+dy*sc*.9);ctx.lineTo(Math.max(30,x-sc*40-60-j*8),iy+dy*sc*.9);ctx.stroke();});ctx.restore();});
    fmMove(ctx,xb-10,iy-sc*72,[1,0],'',{len:60});fmPill(ctx,'두 선수가 같은 빠르기로 함께 달리는 중',W*.5,H*.3,24,FMC.ink);}

    const P=f.flashes,G=P.slice(1).map((p,i)=>({g:(p.x-P[i].x)*k,push:p.t>D.SKATE.t0+1e-9&&P[i].t<D.SKATE.push-1e-9})),x0=W*.38,bw2=Math.min(30,(W*.42)/13),by0=H*.40,hs=1.25;
    txt(ctx,'같은 시간 동안 간 거리',x0,H*.27,24,FMC.ink,'left',900);txt(ctx,'빗금 = 미는 동안',W-40,H*.27,24,FMC.ans,'right',800);
    ctx.save();ctx.strokeStyle='#5C6B68';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0-6,by0);ctx.lineTo(x0+13*(bw2+6),by0);ctx.stroke();ctx.restore();

    qaPush('bars',{g:G.map(q=>q.g)});}

/* ================= STAGE 3 : 같은 크기의 알짜힘이 계속 작용할 때 — 비스듬한 방향(방향 일정) vs 늘 수직인 방향(위에서 본 모습) =================
   비스듬 → 휘면서 잔상 간격이 넓어짐(속력·방향 모두 변함). 늘 수직 → 원을 그리며 잔상 간격이 같음(운동 방향만 변함 — 인공위성과 같은 원운동). 두 칸은 같은 크기의 힘·같은 축척. */
const FM_NP={v:.8,F:.64,flash:.4,Tobl:2.4};
const FM_NP_R=FM_NP.v*FM_NP.v/FM_NP.F;   /* 원의 반지름 mv²/F */

const mkPerpZ=()=>FM.sim({x:0,y:0,vx:FM_NP.v,flashEvery:fmSt(FM_NP.flash),freezeOnFlash:true,forces:[{k:'perp',mag:FM_NP.F,side:1,name:'알짜힘'}],until:s=>s.t>=2*Math.PI*FM_NP_R/FM_NP.v-1e-9});
ANIMS.nonpar=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);o._hits=[];const dt=fmTick(o);o._dt=dt;const ph=o.phase,h=(H-40)/2,k=(h-112)/(2*FM_NP_R),r=12;

    const s=fmRun(o,'n'+i,mk,1.3,run);fmGhosts(ctx,s.flashes.slice(0,-1).map(p=>[V.X(p.x),V.Y(p.y),fmRoll(p,k,r)]),r,'pp');const X=V.X(s.x),Y=V.Y(s.y);fmBall(ctx,X,Y,r,'pp',1,fmRoll(s,k,r));fmObj('np'+i,V,s,X,Y);
    const f=s.forceList()[0];fmMove(ctx,X,Y,[s.vx,s.vy],'운동 방향',{len:56});if(f.on&&!s.frozen)fmForce(ctx,X,Y,[f.fx,f.fy],110,'알짜힘',FMC.force,{obj:'np'+i});
    if(run&&s.frozen){fmReplay(o,W-110,y+30,()=>fmReset(o,'n'+i));txt(ctx,i?'잔상 간격이 같다 — 원운동':'잔상 간격이 넓어지며 휜다',W-50,y+h-34,24,FMC.ans,'right',900);}
    o['_np'+i]=s;});
  txt(ctx,'위에서 본 모습(모식) · 알짜힘이 계속 작용',W-50,H-12,24,FMC.SUBT,'right',800);

/* ================= 비스듬히 던져 올린 농구공 — 골대를 지난 뒤에도 운동이 이어진다(골망이 앞으로 가는 운동을 줄이고, 공은 중력으로 떨어진다) ================= */

const mkBballFull=()=>{const B=D.BBALL;return FM.sim({x:B.x0,y:B.y0,vx:B.vx,vy:B.vy,flashEvery:fmSt(B.flash),forces:[{k:'gravity',name:'중력'},{k:'dragx',c:34,zone:FM_NET,name:'골망이 미는 힘'}],until:s=>s.y<=.12&&s.vy<0});};
ANIMS.bball=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);o._hits=[];const dt=fmTick(o);o._dt=dt;const ph=o.phase,run=ph>=1,B=D.BBALL;

  const hx=V.X(B.hoop[0]),hy=V.Y(B.hoop[1]);ctx.save();ctx.fillStyle='#E0A526';ctx.fillRect(hx+40,hy-60,12,H-28-(hy-60));ctx.fillStyle='#fff';ctx.strokeStyle='#33404A';ctx.lineWidth=3;ctx.fillRect(hx+30,hy-76,12,70);ctx.strokeRect(hx+30,hy-76,12,70);
  ctx.strokeStyle='#9AA6AB';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx-28,hy+2);ctx.lineTo(hx-16,hy+46);ctx.lineTo(hx+16,hy+46);ctx.lineTo(hx+28,hy+2);ctx.moveTo(hx-22,hy+20);ctx.lineTo(hx+22,hy+20);ctx.stroke();ctx.restore();

  if(!s.frozen){if(s.speed()>1e-6)fmMove(ctx,X,Y,[s.vx,s.vy],'운동 방향',{len:60,lp:s.x>B.hoop[0]-.3?[X-70,Y-30]:'end',al:'right'});fmForce(ctx,X,Y,[0,-G],KF,'중력',FMC.force,{obj:'bb',lp:[X+20,Y+48],al:'left'});
    const n=s.forceList().find(f=>f.k==='dragx');if(n&&n.on)fmForce(ctx,X,Y,[n.fx,n.fy],KF,'',FMC.force,{obj:'bb',lab:false});}
  if(!run)fmPill(ctx,'비스듬히 던져 올리는 순간',W*.42,H*.1,26,FMC.ink);
  if(run&&s.frozen){txt(ctx,'중력은 어느 위치에서나',W*.42,H*.72,24,FMC.ans,'center',900);txt(ctx,'크기·방향이 같다',W*.42,H*.72+32,24,FMC.ans,'center',900);fmReplay(o,W*.42,H*.72+90,()=>fmReset(o,'b'));}
  qaState(o,{run,flashN:P.length,cls:FM.classify(inF.length>2?inF:P)});};};

/* ================= 인공위성(위에서 본 원 궤도 — 모식) ================= */

ANIMS.sat=o=>{o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);const dt=fmTick(o);o._dt=dt;const ph=o.phase,run=ph>=1;
  const R=Math.min(W,H)*.36,cx=W*.5,cy=H*.52,V=fmView(cx,cy,R/D.SAT.r),KF=R*.3/(satGM()/D.SAT.r/D.SAT.r);

    fmMove(ctx,X-60,Y-46,[-1,0],'운동 방향',{len:62,lp:[X-70,Y-80],al:'right'});fmPill(ctx,'책의 가운데가 서랍장 끝에 다다른 순간 — 이제 어떻게 움직일까?',W*.5,40,24,FMC.ink);}
  if(run&&s.phase==='tip')fmPill(ctx,'모서리 위에서 기울어진다',W*.5,40,24,FMC.ink);
  if(run&&s.phase==='free'&&!s.frozen)fmPill(ctx,'서랍장을 벗어나면 중력만 — 운동 방향과 비스듬',W*.5,40,24,FMC.ans,'#FFF3E6');
  if(run&&s.frozen){fmPill(ctx,'앞으로 나아가며 기울어져 휘어 떨어졌다',W*.5,40,24,FMC.ans,'#FFF3E6');fmReplay(o,W*.2,H*.2,()=>fmReset(o,'f'));}
  const fr=s.flashes.filter(p=>p.phase==='free');
  qaState(o,{run,flashN:s.flashes.length,cls:fr.length>2?FM.classify(fr).cat:null,phase:s.phase,
    minGap:Math.min(...s.flashes.concat([s]).map(p=>Math.min(...bookCorners(p,p.th).filter(c=>c[0]>1e-3).map(c=>c[1]*k).concat([99]))))});};};

/* ================= 과학 가치·태도 : 양궁 깃발(위에서 본 모습, 선택) ================= */
const mkArrow=w=>()=>FM.sim({vx:6,flashEvery:fmSt(.12),forces:w?[{k:'const',fx:0,fy:1.1,zone:[1,-9,9,9],name:'바람'}]:[],until:s=>s.x>=8});
ANIMS.arch=o=>{cvHitInit(o);o.frame=()=>{const {ctx,W,H}=o;clear(o);fmBg(o);o._hits=[];const dt=fmTick(o);o._dt=dt;const ph=o.phase,k=(W-280)/8,V=fmView(90,H*.55,k);
  ctx.save();ctx.fillStyle='#CFE8B4';rr(ctx,20,60,W-40,H-150,14);ctx.fill();ctx.restore();
  const tx=V.X(8),ty=V.Y(0);[60,44,28,12].forEach((r,i)=>{ctx.beginPath();ctx.arc(tx,ty,r,0,TAU);ctx.fillStyle=['#FFFFFF','#2F6FB0','#D8382B','#F4C33B'][i];ctx.fill();ctx.strokeStyle='#33404A';ctx.lineWidth=2;ctx.stroke();});
  const wind=ph>=2,px=tx,py=ty-190;   /* 위에서 본 깃대(점) + 깃발: 바람이 불면 바람 쪽(위)으로 나부낀다 */
  ctx.save();ctx.fillStyle='#E07A2F';ctx.strokeStyle='#8A3D12';ctx.lineWidth=2;ctx.beginPath();
  if(wind){const fl=Math.sin(o.t*8)*5;ctx.moveTo(px-7,py);ctx.lineTo(px+fl,py-56);ctx.lineTo(px+7,py);}else{ctx.moveTo(px-6,py);ctx.lineTo(px-6,py+16);ctx.lineTo(px+6,py+16);ctx.lineTo(px+6,py);}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(px,py,7,0,TAU);ctx.fillStyle='#5C6B68';ctx.fill();ctx.restore();
  txt(ctx,'깃발(위에서 봄)',px-18,py+10,24,FMC.SUBT,'right',800);
  const s=fmRun(o,wind?'w':'n',mkArrow(wind),.18,ph>=1);
  s.flashes.forEach((p,i)=>{const x=V.X(p.x),y=V.Y(p.y),a=Math.atan2(-p.vy,p.vx);ctx.save();ctx.globalAlpha=.25+.5*i/Math.max(1,s.flashes.length-1);ctx.translate(x,y);ctx.rotate(a);ctx.strokeStyle='#33404A';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-40,0);ctx.lineTo(0,0);ctx.stroke();ctx.restore();});
  qaPush('flash',{n:s.flashes.length});
  if(ph>=1){const X=V.X(s.x),Y=V.Y(s.y);fmMove(ctx,X,Y,[s.vx,s.vy],'운동 방향',{len:56,lp:[X-30,Y+44],al:'center'});const w=s.forceList()[0];if(w&&w.on)fmForce(ctx,X,Y,[w.fx,w.fy],60,'바람의 방향',FMC.wind,{obj:'arrow',lp:[X-14,Y-56],al:'right'});}
  txt(ctx,ph<1?'활을 쏘기 전':ph<2?'바람이 없을 때':'옆에서 바람이 불 때',W*.5,40,26,FMC.ink,'center',900);
  qaState(o,{wind,ang:Math.atan2(s.vy,s.vx)});};};

/* ================= 점검 문제 Q4 : (가)(나) 잔상 ================= */
ANIMS.q4=o=>{const A=mkQ4a(),Bq=mkQ4b();A.runTo(D.Q4_MODELS.a.flash*(D.Q4_MODELS.a.n-1)+1e-9);Bq.runTo(D.Q4_MODELS.b.flash*(D.Q4_MODELS.b.n-1)+1e-9);
  o.frame=()=>{const {ctx,W,H}=o;clear(o,false);fmBg(o);const ph=o.phase;const pw=(W-52)/2;
    fmPanel(ctx,20,14,pw,H-28,'(가) 곧은 길',null,28);fmPanel(ctx,32+pw,14,pw,H-28,'(나) 원 둘레',null,28);
    const ka=(pw-80)/A.flashes[A.flashes.length-1].x,Va=fmView(56,H*.55,ka);fmGhosts(ctx,A.flashes.map(p=>[Va.X(p.x),Va.Y(0)]),13,'puck',{a0:.3,a1:.7});
    const p0=A.flashes[0];fmMove(ctx,Va.X(0),Va.Y(0)-52,[1,0],'운동 방향',{len:60,lp:[Va.X(0)+70,Va.Y(0)-52],al:'left',sz:28});
    if(ph>=1){const p=A.flashes[2],f=p.F[0];fmForce(ctx,Va.X(p.x),Va.Y(0),[f.fx,f.fy],200,'알짜힘',FMC.force,{obj:'q4a',lp:[Va.X(p.x)-40,Va.Y(0)+46],al:'center',sz:28});}
    const r=D.Q4_MODELS.b.r,kb=Math.min(pw*.32,(H-120)*.4)/r,cx=32+pw+pw/2,cy=H*.54,Vb=fmView(cx,cy,kb);
    ctx.save();ctx.strokeStyle='#C9D3D0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r*kb,0,TAU);ctx.stroke();ctx.restore();
    fmGhosts(ctx,Bq.flashes.map(p=>[Vb.X(p.x),Vb.Y(p.y)]),13,'puck',{a0:.3,a1:.7});const b0=Bq.flashes[0];
    fmMove(ctx,Vb.X(b0.x)-50,Vb.Y(b0.y)+40,[1,0],'운동 방향',{len:56,lp:[Vb.X(b0.x)-60,Vb.Y(b0.y)+40],al:'right',sz:28});
    if(ph>=2)txt(ctx,'간격이 같다',cx,H-50,28,FMC.ans,'center',900);
    if(ph>=3)[1,3,5].forEach(i=>{const p=Bq.flashes[i],f=p.F[0];fmForce(ctx,Vb.X(p.x),Vb.Y(p.y),[f.fx,f.fy],60,i===3?'알짜힘':'',FMC.force,{obj:'q4b'+i,lab:i===3,sz:28});});
    txt(ctx,'진할수록 나중',20+pw/2,H-50,28,FMC.SUBT,'center',800);
    qaState(o,{a:FM.relKind([A.flashes[1].F[0].fx,A.flashes[1].F[0].fy],[A.flashes[1].vx,A.flashes[1].vy]),b:FM.relKind([Bq.flashes[1].F[0].fx,Bq.flashes[1].F[0].fy],[Bq.flashes[1].vx,Bq.flashes[1].vy],1e-3),bcat:FM.classify(Bq.flashes).cat});};};

  <div class="chbar"><button class="cbtn go" data-chact="check">정답 확인</button><button class="cbtn" data-chact="hint">💡 힌트</button><button class="cbtn" data-chact="new">↻ 새 문제</button></div>
  <div class="chmsg" data-chmsg></div><div class="chstar" data-chstar></div></div>`;
const FM_HINTS=['알짜힘이 운동 방향과 같은 줄 위에 있으면(같은·반대) 길은 곧고 빠르기만 바뀐다.','알짜힘이 늘 운동 방향과 수직이면 빠르기는 그대로이고 길만 휜다(인공위성).','비스듬하면? 빠르기도 바뀌고 길도 휜다(농구공).'];
function chRender(){const root=document.querySelector('.slide.active .chbox');if(!root)return;const m=root.querySelector('[data-chmsg]');m.textContent=FMCH.msg;m.className='chmsg'+(FMCH.cls?' '+FMCH.cls:'');
  root.querySelectorAll('[data-chp]').forEach(b=>{b.classList.toggle('sel',FMCH.pick[+b.dataset.chp]===+b.dataset.v);b.disabled=FMCH.solved;});
  root.querySelector('[data-chstar]').textContent='★ 모은 별 '+FMCH.total+'개 · 도전 '+FMCH.round+'번째';root.querySelector('[data-chact="check"]').disabled=FMCH.solved;}
window.chRender=chRender;
function chCheck(){if([0,1,2].some(i=>FMCH.pick[i]==null)){FMCH.msg='A, B, C 모두 골라야 확인할 수 있어.';FMCH.cls='';return;}
  const bad=[0,1,2].filter(i=>FMCH.pick[i]!==FMCH.S.ans[i]).length;
  if(!bad){FMCH.solved=true;FMCH.stars=Math.max(1,3-FMCH.hints-FMCH.wrong);FMCH.total+=FMCH.stars;FMCH.cls='ok';FMCH.msg='정답! 별 '+FMCH.stars+'개. 이제 실제로 움직이는 모습(잔상)을 확인해 보자.';return;}
  FMCH.wrong++;FMCH.cls='bad';FMCH.msg='아직 맞지 않는 것이 '+bad+'개 있어. 알짜힘과 운동 방향이 이루는 방향을 다시 보자.';}
function chEnter(el){const root=el.querySelector('.chbox');if(!root)return;if(!FMCH.S)FMCH.shuffle();FMCH.reset();
  if(!root._b){root._b=1;stopAll(root);root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(e.detail>0)b.blur();
    if(b.dataset.chp!=null&&!FMCH.solved){FMCH.pick[+b.dataset.chp]=+b.dataset.v;}
    else if(b.dataset.chact==='check'&&!FMCH.solved)chCheck();
    else if(b.dataset.chact==='hint'&&!FMCH.solved){FMCH.msg='💡 '+FM_HINTS[Math.min(FMCH.hints,2)];FMCH.hints=Math.min(3,FMCH.hints+1);FMCH.cls='';}
    else if(b.dataset.chact==='new'){FMCH.round++;FMCH.shuffle();FMCH.reset();}
    chRender();});}
  chRender();}

S({stageNo:4,chip:'디지털+탐구 · 조사하기',title:'여러 가지 상황에서 힘의 작용 탐구하기',tocName:'[탐구] 소재 고르기 · 조사',note:NT.inq,
  body:`<div class="panel glow"><div class="pt"><div>1. 힘의 작용과 관련하여 탐구할 소재를 하나 골라 보자.</div></div>
   <div class="fmtopic">${D.TOPICS.map(t=>`<span>${t}</span>`).join('')}</div></div>
   <div class="panel"><div class="pt"><div>2. 고른 소재와 관련된 운동 영상을 누리망에서 찾아, 물체의 <b>속력</b>과 <b>운동 방향</b>이 어떻게 변하는지 조사해 보자.</div></div>
   <div class="pt"><div style="color:#4A5A58">${D.SEARCH_EX}</div></div></div>${ASK('물체에 어떤 힘이 작용하고 있는지도<br>생각해 봐!')}`});

/* 놀이기구 = 행(한 놀이기구의 관찰을 한 줄로 읽는다 — 학습지 표와 같은 모양·같은 빈칸 순서) */
const RIDETAB=`<table class="to fmtab"><tr><th>놀이기구</th><th>속력 변화</th><th>운동 방향 변화</th><th>분류</th></tr>
  ${D.RIDE_ROWS.map(r=>`<tr><th>${r[0]}</th><td>${T(r[1])}</td><td>${T(r[2])}</td><td>${T(r[3])}</td></tr>`).join('')}</table>`;
S({stageNo:4,rows:false,chip:'디지털+탐구 · 분류하기 1',title:'놀이기구의 속력과 운동 방향은 어떻게 변할까?',tocName:'[탐구] 놀이기구 운동 정리',note:NT.rides,
  body:`<div style="display:flex;gap:18px;height:100%"><div style="flex:0 0 700px;display:flex;flex-direction:column;gap:10px"><div class="pt fmhint" style="font-size:24px">▶ 영상 보기를 눌러 관찰한 뒤 빈칸을 열자. (첫 줄은 예시)</div>${RIDETAB}</div>
   <div style="flex:1;min-width:0">${A('rides',700)}</div></div>`,step:syncA('rides',9)});

sortSlide({id:'fmsort',stageNo:4,chip:'디지털+탐구 · 분류하기 2',title:'물체의 운동을 세 가지로 분류해 보자',tocName:'[탐구] 운동 분류하기',seed:11,
  cards:[[D.RIDE_ROWS[0][0],'a'],[D.RIDE_ROWS[1][0],'a'],['시소','c'],['그네','c']].concat(D.SORT_EXTRA.map(([t,b])=>[t,b])),
  bins:{a:['속력만 변하는 운동',''],b:['운동 방향만 변하는 운동',''],c:['속력과 운동 방향이 모두 변하는 운동','']},
  left:`<div class="panel glow"><div class="pt"><div>물체에 작용하는 힘과 운동 방향을 생각하며 카드를 알맞은 칸에 놓아 보자.</div></div></div>${NOTE('※ 대관람차 칸은 일정한 빠르기로 돌 때를 생각한다.')}`,
  done:'대관람차 칸 = 운동 방향만 변하는 예',extra:{note:NT.sort}});

TS({stageNo:4,chip:'분류하기 2 · 정리',title:'운동의 세 가지 분류와 알짜힘의 방향',tocName:'분류와 알짜힘의 방향',anim:'cls',max:2,note:NT.sum,tw:600,
  text:`<div class="panel glow mfsm">${LL(B.s4_class)}</div>`});

TS({stageNo:4,chip:'도입 질문 풀기',title:'서랍장에서 떨어진 책은 어떻게 움직일까?',tocName:'도입 질문 풀기',anim:'intro2',max:1,note:NT.intro2,tw:560,
  text:`<div class="panel glow">${L(D.INTRO_ANS)}</div>${ASK('비스듬히 던진 농구공과<br>무엇이 닮았을까?')}`});

TS({stageNo:4,chip:'과학 가치·태도',title:'양궁 선수는 왜 깃발을 볼까?',tocName:'과학 가치·태도 : 양궁 깃발',anim:'arch',max:2,extra:2,note:NT.arch,tw:560,
  text:`<div class="panel glow"><div class="pt"><div>양궁 경기를 보면 선수들이 과녁 위에 달린 작은 깃발을 보고 화살을 쏜다. 선수들이 깃발을 보는 까닭을 화살의 운동과 관련지어 생각해 보자.</div></div></div>${ASK('바람이 화살에<br>힘을 작용하면?')}`});

/* ================= 복습 (미션당 1장) ================= */
D.REVIEW.forEach((r,i)=>S({review:true,chip:'미션 '+'①②③'[i]+' 확인',title:r.title,tocName:'복습 '+'①②③'[i]+' '+r.title.split(': ')[1],
  body:`<div class="qnote" style="font-size:28px">미션 ${'①②③'[i]} ${D.MISSIONS[i]}</div><div class="panel">${LL(r.lines)}</div>`}));

/* ================= BOSS ================= */
QSA(1,D.Q1_Q,D.Q1,D.Q1_NOTE,220,null,{note:NT.q});
QOX(2,D.Q2_Q,D.Q2,D.Q2_NOTE,{note:NT.q,hints:D.Q2_HINTS});
QOX(3,D.Q3_Q,D.Q3,D.Q3_NOTE,{note:NT.q,hints:D.Q3_HINTS});
QT(4,'단답형 · ★ 도전',D.Q4_Q,`<div style="display:flex;gap:18px;align-items:center"><div style="flex:0 0 660px"><div class="fig" style="height:500px;flex:none"><canvas data-a="q4"></canvas></div></div>
  <div class="qlist" style="flex:1;min-width:0">${D.Q4.map(([t,an],i)=>`<div class="qitem"><span class="mk">(${i+1})</span><span class="txt">${t}</span><span class="bl" style="margin-left:auto;min-width:110px;text-align:center">${an}</span></div>`).join('')}</div></div>`,D.Q4_NOTE,{note:NT.q,step:syncA('q4',3)});
QD(5,D.Q5_Q,D.Q5_MODEL,D.Q5_KEYS,null,{sub:'서술형 · ★ 도전',note:NT.q});

S({ch:'E',chName:'마무리',chip:'스스로 점검',title:'오늘 배운 내용을 점검해 보자',tocName:'스스로 점검',
  body:`<div class="panel glow">${D.SELF_CHECK.map(t=>`<div class="step" style="font-size:31px;font-weight:700;margin:12px 0">☐ &nbsp;${t}</div>`).join('')}</div>
   <div class="bubbleRow"><img class="mascot" src="${FM_MASCOT}" alt="탐이"><div class="bubble">모두 체크했다면 오늘 수업 성공!<br>주변의 운동을 세 가지로 나누어 보자.</div></div>`});

/* 선택 표시 */
['[도전] 출발 모습만 보고 맞혀라','과학 가치·태도 : 양궁 깃발'].forEach(n=>{const d=SLIDES.find(x=>x.tocName===n);if(d){d.chip=(d.chip||'').replace(/ · 선택$/,'')+' · 선택';d.tocName=n+' (선택)';}});

/* ---------- 시작 (자동 추가 — 단원 파일에 쓰지 않는다) ---------- */
assignStages();buildDeck();fit();setMode(/self/i.test(location.hash),true);go(0,0);
</script></body></html>
