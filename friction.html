/* 접촉면 그림 (윗면 y). kind: ice 얼음(매끄러운 판) · soil 흙 · desk 책상 · sand 사포 · rough 거친 면 · smooth 매끄러운 면 — figs.py 의 surf() 와 같은 색 */
function surfC(ctx,x,y,w,h,kind,seed){
  const r=_lcg(seed||7);ctx.save();ctx.lineWidth=2.4;
  const base={ice:['#CFE7F4','#8FBAD3'],soil:['#B98B5B','#7B5A38'],desk:['#E8CB94','#A4813F'],sand:['#5F666B','#343A3E'],smooth:['#D3E1EA','#8FA7B6'],rough:['#8E9894','#4F5A56']}[kind]||['#ccc','#888'];
  if(kind==='rough'){
    const n=Math.max(4,Math.round(w/14));ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y);
    for(let i=0;i<n;i++){ctx.lineTo(x+w*(i+.5)/n,i%2?y-6:y+1);ctx.lineTo(x+w*(i+1)/n,y);}
    ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fillStyle=base[0];ctx.fill();ctx.strokeStyle=base[1];ctx.lineJoin='round';ctx.stroke();ctx.restore();return;}
  ctx.fillStyle=base[0];ctx.fillRect(x,y,w,h);ctx.strokeStyle=base[1];ctx.strokeRect(x,y,w,h);
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(kind==='ice'||kind==='smooth'){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';
    for(let i=0;i<Math.max(2,w/70);i++){const a=x+20+i*70+r()*14;ctx.beginPath();ctx.moveTo(a,y+h*.38);ctx.lineTo(a+22,y+h*.38);ctx.stroke();}}
  else if(kind==='soil'){ctx.fillStyle='#7B5A38';for(let i=0;i<w/9;i++){ctx.beginPath();ctx.arc(x+4+r()*(w-8),y+4+r()*(h-8),1.2+r()*1.8,0,TAU);ctx.fill();}}
  else if(kind==='desk'){ctx.strokeStyle='#C9A468';ctx.lineWidth=1.6;[.32,.68].forEach(k=>{ctx.beginPath();ctx.moveTo(x+4,y+h*k);ctx.lineTo(x+w-4,y+h*k);ctx.stroke();});}
  else if(kind==='sand'){for(let i=0;i<w/3.2;i++){ctx.fillStyle=r()>.45?'#C9CFD2':'#2E3438';ctx.beginPath();ctx.arc(x+2+r()*(w-4),y+2+r()*(h-4),.8+r()*1.0,0,TAU);ctx.fill();}}
  ctx.restore();ctx.restore();
}
/* 상자·병뚜껑(청록). (x,y)=왼쪽 위, 회전 중심 (px,py) 기준 rot(라디안) */
function boxC(ctx,x,y,w,h,rot,px,py,fill){
  ctx.save();if(rot){ctx.translate(px,py);ctx.rotate(rot);ctx.translate(-px,-py);}
  rr(ctx,x,y,w,h,Math.min(7,h/3));ctx.fillStyle=fill||BOXF;ctx.fill();ctx.lineWidth=2.6;ctx.strokeStyle=BOXS;ctx.stroke();
  rr(ctx,x+6,y+5,w-12,Math.max(3,h*.12),3);ctx.fillStyle='rgba(255,255,255,.38)';ctx.fill();ctx.restore();
}
/* 가로 화살표: (x,y)에서 시작해 dir(+1 오른쪽 / -1 왼쪽) 방향으로 len 만큼 */
function hArrow(ctx,x,y,len,dir,col,lw,head){if(len<4)return;arrow(ctx,x,y,x+dir*len,y,col,lw||9,head||22);}
/* 알약 이름표: 색 바탕 + 흰 글자 */
function pill(ctx,s,x,y,size,fill,color){
  ctx.save();ctx.font=`800 ${size}px Pretendard,sans-serif`;const w=ctx.measureText(s).width+30,h=size*1.6;
  rr(ctx,x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=fill;ctx.fill();ctx.restore();txt(ctx,s,x,y+1,size,color||'#fff');
}
/* 노란 강조 띠 이름표 */
function band(ctx,s,x,y,size){
  ctx.save();ctx.font=`800 ${size}px Pretendard,sans-serif`;const w=ctx.measureText(s).width+40,h=size*1.7;
  rr(ctx,x-w/2,y-h/2,w,h,12);ctx.fillStyle=YEL;ctx.fill();ctx.restore();txt(ctx,s,x,y+1,size,INK);
}
/* 이름표 줄: 알약 이름표(고정 너비) + 설명 글. 설명이 길면 글자 크기를 줄여 캔버스 안에 넣는다 */
function defRow(o,k,x0,y,label,desc,fill,pw){
  if(o.phase<k)return;const {ctx,W}=o,a=P(o,k,.6);pw=pw||128;const tx=x0+pw+16;
  let fs=27;ctx.save();ctx.font=`700 ${fs}px Pretendard,sans-serif`;const w0=ctx.measureText(desc).width,room=W-tx-14;if(w0>room)fs=Math.floor(fs*room/w0);ctx.restore();
  ctx.save();ctx.globalAlpha=a;ctx.translate((1-a)*-26,0);
  rr(ctx,x0,y-27,pw,54,27);ctx.fillStyle=fill;ctx.fill();
  txt(ctx,label,x0+pw/2,y+1,30,'#fff','center',900);
  txt(ctx,desc,tx,y+1,fs,INK,'left',700);
  ctx.restore();
}
/* 빗면 (왼쪽 위 → 오른쪽 아래). (xl,yl)=위쪽 끝 윗면, (xr,yr)=아래쪽 끝 윗면. 받침대 포함 */
function inclineC(ctx,xl,yl,xr,yr,thick){
  thick=thick||12;ctx.save();ctx.lineJoin='round';
  ctx.fillStyle='#C7D2D0';ctx.strokeStyle='#7E8F8B';ctx.lineWidth=2.4;rr(ctx,xl-8,yl+2,52,yr-yl+thick+6,5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(xl-14,yl-6);ctx.lineTo(xr,yr-2);ctx.lineTo(xr,yr+thick-2);ctx.lineTo(xl-14,yl+thick-6);ctx.closePath();
  ctx.fillStyle='#7FBBE6';ctx.fill();ctx.strokeStyle='#2F6FB0';ctx.lineWidth=3;ctx.stroke();ctx.restore();
}
/* 자 (100 cm = len px, 10 cm 눈금) */
function rulerC(ctx,x,y,len,h,label){
  ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.fillRect(x,y,len,h);ctx.strokeRect(x,y,len,h);
  for(let k=0;k<=10;k++){const xx=x+len*k/10;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+(k%5===0?h*.62:h*.4));ctx.stroke();
    if(k%5===0&&label!==false)txt(ctx,String(k*10),xx,y+h+14,17,SUBC,'center',700);}
  ctx.restore();
}
function dashV(ctx,x,y1,y2,col,lw){ctx.save();ctx.strokeStyle=col||SUBC;ctx.lineWidth=lw||2.5;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();ctx.restore();}
function dashH(ctx,x1,x2,y,col,lw){ctx.save();ctx.strokeStyle=col||SUBC;ctx.lineWidth=lw||2.5;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();}
/* 가로 치수 괄호 (x1→x2, 높이 y): 양끝 세로선 + 가로선 + 가운데 글자 */
function dimH(ctx,x1,x2,y,label,col,size){
  col=col||INK;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y-10);ctx.lineTo(x1,y+10);ctx.moveTo(x2,y-10);ctx.lineTo(x2,y+10);ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();
  if(label)txt(ctx,label,(x1+x2)/2,y+26,size||24,col,'center',800);
}
/* 마찰 모형 값 (data.py 에서 가져옴) */
const SIM_H=D.SIM_H, SURF_D=D.SURF.map(([n,m])=>({name:n,mu:m,d:D.SIM_H/m}));   // 같은 높이에서 놓았을 때 미끄러진 거리 d = H/μ (cm)
const SURF_KIND={'매끄러운 판':'smooth','책상':'desk','사포':'sand'};

/* 애니메이션: ANIMS.이름 = o => { o.frame = () => {…} }.  슬라이드의 anim:'이름' 과 연결.
   단계(o.phase) = 슬라이드의 '공개한 빈칸 번호'. 자습 모드에서도 같은 규칙이므로 단계 = 빈칸 번호로 설계했다.
   색(학습지와 같음): 주황 = 마찰력 · 파랑 = 손이 작용하는 힘 · 청록 = 물체(병뚜껑·상자) · 보라 = 물체의 운동 방향
   화살표의 길이는 힘의 크기에 비례한다(같은 눈금). 마찰력 = μ × 무게 (모식: 접촉면이 같으면 무게에 비례, 무게가 같으면 μ에 비례) */

const FSC=140;                       // 마찰력 화살표: 무게 1 N·마찰 계수 1 일 때의 길이(px)  →  길이 = FSC × μ × (무게 N)
const farrow=(ctx,x,y,len,dir,w)=>hArrow(ctx,x,y,len,dir,CF,w||10,Math.min(24,len*.8));   // 마찰력 화살표(주황)
const mapAt=(a,b,k)=>a+(b-a)*k;

/* ---------- 표지(짙은 바탕): 서로 다른 면 위를 미끄러지다 멈추는 병뚜껑 ---------- */
ANIMS.cover=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o,false);
    const kinds=[['smooth','#CFE7F4'],['desk','#E8CB94'],['sand','#8E979B']],gy0=H*.22,gap=H*.25;
    kinds.forEach(([k],i)=>{
      const gy=gy0+gap*(i+1)-6,mu=[.15,.4,.8][i],T=4.6,tt=((t+i*.9)%T)-.5,Ts=1.9*(.4/mu)*(i===0?.55:1);
      surfC(ctx,40,gy,W-80,26,k,i+3);
      if(tt<0)return;
      const d=Math.min(W-200,(.4/mu)*260)*(i===0?.85:1),v0=2*d/Ts;
      const u=Math.min(tt,Ts),x=70+v0*u-.5*(v0/Ts)*u*u;
      boxC(ctx,x,gy-36,78,36,0,x,gy,BOXF);
      if(tt<Ts)hArrow(ctx,x+39,gy+13,Math.min(120,150*mu),-1,'#FFD7A8',8,18);
    });
  };
};

/* ---------- STAGE 1 : 빙판길과 흙길.  단계: 1 크게 · 2 접촉면 · 3 마찰력 ----------
   신발이 같은 속력으로 미끄러지기 시작한다 → 빙판에서는 멀리, 흙길에서는 금방 멈춘다(마찰력이 크다) */
function shoeC(ctx,x,gy,s){        // (x,gy)=밑창 가운데·땅에 닿는 곳
  ctx.save();ctx.translate(x,gy);ctx.scale(s,s);ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-62,-18);ctx.lineTo(-62,-72);ctx.quadraticCurveTo(-62,-84,-48,-84);ctx.lineTo(-20,-84);ctx.quadraticCurveTo(-6,-84,0,-66);ctx.quadraticCurveTo(14,-38,50,-34);ctx.quadraticCurveTo(70,-32,70,-18);ctx.closePath();
  ctx.fillStyle='#F6F1E6';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#4F5A56';ctx.stroke();
  rr(ctx,-66,-18,140,18,9);ctx.fillStyle='#4F5A56';ctx.fill();
  ctx.strokeStyle='#C9C2B0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,-74);ctx.lineTo(-8,-58);ctx.moveTo(-14,-76);ctx.lineTo(2,-60);ctx.stroke();
  ctx.restore();
}
ANIMS.road=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const rows=[{k:'ice',name:'빙판길',tint:TINT_ICE,mu:.15,d:.62},{k:'soil',name:'흙길',tint:TINT_SOIL,mu:.6,d:.16}];
    const rh=(H-44)/2,T=5.8;
    rows.forEach((r,i)=>{
      const y0=i*rh,gy=y0+rh*.6,L=W-120;
      ctx.save();ctx.fillStyle=r.tint;rr(ctx,6,y0+6,W-12,rh-12,18);ctx.fill();ctx.restore();
      txt(ctx,r.name,28,y0+34,30,INK,'left',900);
      surfC(ctx,18,gy,W-36,rh*.2,r.k,i+11);
      const tt=(t%T)-.5,Ts=r.k==='ice'?3.2:.8,d=L*r.d,v0=2*d/Ts,u=clamp(tt,0,Ts);
      const sx=W*.2+(tt<0?0:v0*u-.5*(v0/Ts)*u*u);
      shoeC(ctx,sx,gy,.9);
      // 신발의 운동 방향 (보라): 미끄러지는 동안
      if(tt>=0&&tt<Ts){hArrow(ctx,sx-40,gy-132,80,1,CD,9,22);}
      txt(ctx,'미끄러지는 방향',W-30,y0+34,22,CD,'right',800);
      // 1 : 신발이 미끄러지지 않게 하는 힘(주황) — 길이는 힘의 크기. 흙길이 더 길다
      if(o.phase>=1&&tt>=0&&tt<Ts){const a=P(o,1,.5)||1;ctx.save();ctx.globalAlpha=a;farrow(ctx,sx+56,gy+rh*.1,r.mu*170,-1,9);ctx.restore();}
      if(o.phase>=1){const a=P(o,1,.6)||1;ctx.save();ctx.globalAlpha=a;
        txt(ctx,r.k==='ice'?'작은 힘 · 멀리 미끄러진다':'큰 힘 · 금방 멈춘다',28,y0+rh-24,25,CF,'left',800);ctx.restore();}
      // 2 : 접촉면 (신발 바닥과 땅이 닿는 곳)
      if(o.phase>=2){const a=P(o,2,.6)||1;ctx.save();ctx.globalAlpha=.55*a;ctx.fillStyle=YEL;rr(ctx,sx-70,gy-5,150,10,5);ctx.fill();ctx.restore();
        ctx.save();ctx.globalAlpha=a;pill(ctx,'접촉면',W-100,gy-rh*.22,26,YEL,INK);ctx.restore();}
      // 3 : 마찰력 이름표
      if(o.phase>=3){const a=P(o,3,.5)||1;ctx.save();ctx.globalAlpha=a;pill(ctx,'마찰력',W-100,y0+rh-26,28,CF,'#fff');ctx.restore();}
    });
    if(o.phase===0)band(ctx,'같은 속력으로 미끄러지기 시작한 신발은 어떻게 될까?',W/2,H-20,24);
  };
};

/* ---------- 미끄러짐 실험 한 줄: 빗면에서 놓은 병뚜껑이 면 위에서 미끄러져 멈춘다 ----------
   · 그림은 축척을 맞춘다: 놓는 높이 H = SIM_H cm, 빗면의 수평 거리 RUN cm, 눈금 1 cm = pxcm px.
   · 병뚜껑은 빗면 '위에 닿은 채' 미끄러져 내려온다(바닥이 빗면 윗면, 병뚜껑 바닥을 빗면 방향으로 기울인다).
   · 속력이 끊기지 않게 한다: 빗면에서 처음 속력 0 인 등가속 s = ½·a·t², 끝에서 속력 v0 = 2L/TI.
     수평면에서는 같은 v0 로 시작하는 등감속 x = v0·u − ½(v0/Ts)·u², 멈추는 시간 Ts = 2·d/v0 (d = H/μ).
     같은 높이에서 놓으면 v0 가 같으므로, 마찰이 클수록(μ↑) d 와 Ts 가 모두 짧다. */
function slideRow(o,c){
  const {ctx,W}=o,y0=c.y0,rh=c.rh,RUN=21,Hc=D.SIM_H,LM=26,RM=26;
  const pxcm=(W-LM-RM-20)/(RUN+c.maxcm),gy=y0+rh*.7,Bx=LM+34+RUN*pxcm,Rx=LM+34,Ry=gy-Hc*pxcm;   // R = 놓는 자리(높이 H), B = 빗면 끝
  const L=Math.hypot(Bx-Rx,gy-Ry),ux=(Bx-Rx)/L,uy=(gy-Ry)/L,ang=Math.atan2(uy,ux);
  // 책상(또는 사포) — 빗면 아래에서부터 이어진다
  surfC(ctx,LM,gy,W-LM-RM,rh*.15,c.kind,c.seed||3);
  // 눈금: 0 = 빗면 끝(B)
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=2;
  for(let k=0;k<=c.maxcm;k+=10){const xx=Bx+k*pxcm;ctx.beginPath();ctx.moveTo(xx,gy+rh*.15);ctx.lineTo(xx,gy+rh*.15+9);ctx.stroke();txt(ctx,String(k),xx,gy+rh*.15+23,17,SUBC,'center',700);}
  ctx.restore();txt(ctx,'cm',Bx-16,gy+rh*.15+23,17,SUBC,'right',700);
  // 빗면(아크릴 판): 윗면이 R→B. 위쪽은 받침대가 받치고, R 보다 34 px 더 위까지 이어진다
  const Ex=Rx-22*ux,Ey=Ry-22*uy,nx=-uy,ny=ux,th=9;
  ctx.save();ctx.lineJoin='round';
  ctx.fillStyle='#C7D2D0';ctx.strokeStyle='#7E8F8B';ctx.lineWidth=2.4;rr(ctx,Ex-6,Ey+th+2,40,gy-(Ey+th+2),4);ctx.fill();ctx.stroke();      // 받침대
  ctx.beginPath();ctx.moveTo(Ex,Ey);ctx.lineTo(Bx,gy);ctx.lineTo(Bx-nx*th,gy-ny*th);ctx.lineTo(Ex-nx*th,Ey-ny*th);ctx.closePath();
  ctx.fillStyle='#8CC4EC';ctx.fill();ctx.strokeStyle='#2F6FB0';ctx.lineWidth=2.6;ctx.stroke();ctx.restore();
  // 놓는 자리 표시(노란 테이프) : 빗면 윗면에 붙인 띠
  ctx.save();ctx.translate(Rx,Ry);ctx.rotate(ang);ctx.fillStyle=YEL;ctx.fillRect(-3,-3,6,6);ctx.restore();
  const dpx=c.d*pxcm,v0=2*L/c.TI,Ts=2*dpx/v0,tt=c.tt;
  let px,py,rot,sliding=false,done=false,onInc=false;
  if(tt<=0){px=Rx;py=Ry;rot=ang;}
  else if(tt<c.TI){const s=L*(tt/c.TI)*(tt/c.TI);px=Rx+ux*s;py=Ry+uy*s;rot=ang*clamp((L-s)/24,0,1);onInc=true;}
  else{const u=Math.min(tt-c.TI,Ts);px=Bx+v0*u-.5*(v0/Ts)*u*u;py=gy;rot=0;sliding=tt-c.TI<Ts;done=!sliding;}
  c.Ts=Ts;c.TIN=c.TI+Ts;
  const sx=Bx+dpx;
  if(done||c.showStop){ctx.save();ctx.strokeStyle=INK;ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,gy-40);ctx.lineTo(sx,gy+2);ctx.stroke();ctx.restore();}
  boxC(ctx,px-22,py-20,44,20,rot,px,py,BOXF);
  // 운동 방향(보라)·마찰력(주황): 수평면에서 미끄러지는 동안(마찰력은 접촉점에서 시작, 운동 방향의 반대)
  if(sliding){hArrow(ctx,px-18,py-46,64,1,CD,8,18);if(c.arrows)farrow(ctx,px,py+rh*.07,c.mu*FSC*1.1,-1,8);}
  if(done&&c.showDist){dimH(ctx,Bx,sx,gy-50,null,INK);txt(ctx,'미끄러진 거리 '+(Math.round(c.d*10)/10)+' cm',(Bx+sx)/2,gy-74,23,INK,'center',900);}
  return {px,done,sliding,pxcm,Bx,gy,sx};
}

/* STAGE 2 : 병뚜껑 미끄러뜨리기.  단계: 1 짧다(미끄러진 거리) · 2 크다(마찰력 화살표 길이)   ※ 마찰력의 방향(반대)은 바로 다음 '해 보기' 슬라이드에서 다룬다 */
ANIMS.slide=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const rh=(H-44)/2,T=5.4,tt=(t%T)-.5;
    const rows=[{kind:'desk',name:'책상',mu:.4},{kind:'sand',name:'사포',mu:.8}];
    rows.forEach((r,i)=>{
      const y0=i*rh,d=D.SIM_H/r.mu;
      ctx.save();ctx.fillStyle=i?TINT_B:TINT_WOOD;rr(ctx,4,y0+4,W-8,rh-8,16);ctx.fill();ctx.restore();
      txt(ctx,r.name+' 위',W*.42,y0+34,28,INK,'left',900);
      slideRow(o,{y0,rh,kind:r.kind,mu:r.mu,d,TI:1.2,tt,maxcm:36,arrows:o.phase>=2,showDist:o.phase>=1,showStop:false,seed:i+4});
      if(o.phase>=2){const a=P(o,2,.6)||1;ctx.save();ctx.globalAlpha=a;txt(ctx,i?'마찰력이 더 크다 (화살표가 더 길다)':'마찰력이 더 작다',W-30,y0+32,24,CF,'right',900);ctx.restore();}
    });
    if(o.phase===0)band(ctx,'같은 위치에서 놓은 병뚜껑이 미끄러진 거리를 비교해 보자',W/2,H-20,24);
    if(o.phase===2)txt(ctx,'주황 화살표 = 마찰력(길이는 크기) · 보라 화살표 = 운동 방향',W-30,H-20,21,INK,'right',800);
  };
};

/* 활동 : 가상 실험 — 면을 고르면 병뚜껑은 출발점으로 돌아가 기다리고, [놓기]를 누르면 미끄러진다.  d = H/μ (같은 높이 H = SIM_H cm) */
const CAP={s:1,go:0,req:0,rec:{}};
ANIMS.cap=o=>{
  o.d.last=-1;o.d.t0=0;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    if(CAP.req!==o.d.last){o.d.last=CAP.req;o.d.t0=t;}
    const sd=SURF_D[CAP.s],rh=H*.56,tt=CAP.go?t-o.d.t0:0;
    txt(ctx,'놓는 높이 '+D.SIM_H+' cm (모두 같게)',W-24,26,23,INK,'right',800);
    const c={y0:0,rh,kind:SURF_KIND[sd.name],mu:sd.mu,d:sd.d,TI:1.0,tt,maxcm:85,arrows:true,showDist:false,showStop:false,seed:9};
    const r=slideRow(o,c);
    const fin=CAP.go&&tt>c.TIN;
    if(fin&&CAP.rec[CAP.s]==null)CAP.rec[CAP.s]=sd.d;
    if(fin){dimH(ctx,r.Bx,r.sx,r.gy-50,null,INK);txt(ctx,'미끄러진 거리 '+(Math.round(sd.d*10)/10)+' cm',Math.max(r.Bx+120,(r.Bx+r.sx)/2),r.gy-76,24,INK,'center',900);}
    const by=rh+54;
    SURF_D.forEach((s,i)=>{const x=24+i*((W-48)/3),w=(W-48)/3-12,has=CAP.rec[i]!=null;
      rr(ctx,x,by,w,86,16);ctx.fillStyle=has?'#fff':'rgba(255,255,255,.4)';ctx.fill();ctx.lineWidth=has?3:2;ctx.strokeStyle=i===CAP.s?CB:'#C9D3D1';ctx.stroke();
      txt(ctx,s.name,x+w/2,by+27,25,INK,'center',900);txt(ctx,has?(Math.round(s.d*10)/10)+' cm':'?',x+w/2,by+62,32,has?CB:SUBC,'center',900);});
    const n=Object.keys(CAP.rec).length;
    if(!CAP.go)band(ctx,'면을 고르고 [놓기]를 눌러 보자',W/2,H-30,26);
    else if(!fin)band(ctx,'병뚜껑이 미끄러지는 중…',W/2,H-30,26);
    else if(n>=3)band(ctx,'미끄러진 거리가 짧을수록 마찰력은 크다 (화살표가 길다)',W/2,H-30,25);
    else band(ctx,'다른 면에서도 놓아 보자',W/2,H-30,26);
  };
};

/* ---------- STAGE 3 : 마찰력의 크기.  단계: 1 거칠수록 · 2 무거울수록 ----------
   세 장면: (가) 거친 면·무거운 상자  (나) 매끄러운 면·무거운 상자  (다) 매끄러운 면·가벼운 상자
   끄는 힘은 세 장면 모두 같다(같은 길이의 파랑 화살표).  운동 마찰력은 (가) > (나) > (다) (화살표 길이는 크기 순서만 나타내는 모식).
   알짜힘 = 끄는 힘 − 마찰력,  가속도 a = 알짜힘 / 질량  →  마찰력이 클수록 천천히 가속된다. 거리 x = ½·a·t² (같은 출발점·같은 시각에 출발)
   비교는 '한 가지만 다르게' : 1단계에서는 (가)·(나)만(접촉면만 다름), 2단계에서는 (나)·(다)만(무게만 다름) 움직이고 나머지는 출발점에 정지한다. */
const SZ_CASES=[{n:'(가)',surf:'rough',sn:'거친 면',bw:90,bh:66,bn:'무거운 상자',f:70,m:2},{n:'(나)',surf:'smooth',sn:'매끄러운 면',bw:90,bh:66,bn:'무거운 상자',f:45,m:2},{n:'(다)',surf:'smooth',sn:'매끄러운 면',bw:60,bh:44,bn:'가벼운 상자',f:22,m:1}];
const SZ_PULL=100;                          // 끄는 힘(화살표 길이, px) — 세 장면 모두 같다
ANIMS.size=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const act=o.phase===0?[0,0,0]:(o.phase===1?[1,1,0]:[0,1,1]);
    const rh=(H-50)/3,T=3.2,HOLD=.7,CYC=T+HOLD+.9,tc=t%CYC,tm=Math.max(0,Math.min(T,tc-HOLD));
    const acc=SZ_CASES.map(c=>(SZ_PULL-c.f)/c.m),trav=W-32-90-40-SZ_PULL-30;
    // 움직이는 두 상자 중 빠른 쪽이 T 초 동안 trav 의 85 % 를 가도록 눈금(k)을 정한다 (두 상자는 같은 k → 가속도 비가 그대로 보인다)
    const mx=Math.max(...acc.filter((_,i)=>act[i]),1),k=.85*trav/(.5*mx*T*T);
    const fade=Math.min(1,(CYC-tc)/.5);
    SZ_CASES.forEach((c,i)=>{
      const y0=i*rh,gy=y0+rh*.7,on=act[i];
      ctx.save();ctx.fillStyle=[TINT_F,TINT_ICE,TINT_B][i];rr(ctx,5,y0+5,W-10,rh-10,16);ctx.fill();ctx.restore();
      ctx.save();ctx.globalAlpha=(o.phase===0||on)?1:.45;
      txt(ctx,c.n+' '+c.sn+' · '+c.bn,24,y0+30,24,INK,'left',900);
      surfC(ctx,16,gy,W-32,rh*.15,c.surf,i+20);
      const x=on?Math.min(trav,.5*acc[i]*k*tm*tm):0,bx=34+x;
      ctx.globalAlpha=((o.phase===0||on)?1:.45)*(on?Math.max(0,fade):1);
      boxC(ctx,bx,gy-c.bh,c.bw,c.bh,0,bx,gy,BOXF);
      const hA=(o.phase===0||on);
      if(hA){hArrow(ctx,bx+c.bw+4,gy-c.bh/2,SZ_PULL,1,CH,Math.max(6,10),22);txt(ctx,'끄는 힘',bx+c.bw+10,gy-c.bh/2-20,19,CH,'left',800);}
      if(on){farrow(ctx,bx+c.bw/2+c.f/2,gy+rh*.075,c.f,-1,10);txt(ctx,'마찰력',bx+c.bw/2+c.f/2+10,gy+rh*.075,19,CF,'left',900);}
      ctx.restore();
    });
    if(o.phase===0)band(ctx,'세 상자를 같은 힘으로 끌면 어떻게 움직일까?',W/2,H-24,24);
    if(o.phase===1)band(ctx,'(가)와 (나) : 무게는 같고 접촉면만 다르다 · 끄는 힘은 같다',W/2,H-24,23);
    if(o.phase>=2)band(ctx,'(나)와 (다) : 접촉면은 같고 무게만 다르다 · 끄는 힘은 같다',W/2,H-24,23);
  };
};

/* ---------- 마찰력의 방향.  단계: 1 정지(반대) · 2 운동(반대) ----------
   정지: 손바닥이 상자를 오른쪽으로 밀지만 상자가 움직이지 않는다 → 정지 마찰력: 미는 힘과 크기가 같고 방향은 왼쪽
   운동: 상자가 오른쪽으로 일정한 속력으로 미끄러진다 → 운동 마찰력: 크기는 미는 힘과 같고(알짜힘 0) 방향은 운동 방향의 반대(왼쪽)
   모든 화살표는 같은 눈금(110 px = 같은 크기). 마찰력은 상자 바닥 가운데(접촉면)에서 시작한다. */
ANIMS.dir=o=>{
  o.d.x=0;o.d.last=0;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=Math.min(.04,t-o.d.last);o.d.last=t;o.d.x+=70*dt;
    const rh=H/2,AL=110,bw=96,bh=72,trav=W*.3;
    [['물체가 정지해 있을 때',TINT_B,false],['물체가 운동할 때',TINT_D,true]].forEach(([name,tint,mov],i)=>{
      const y0=i*rh,gy=y0+rh*.64;
      ctx.save();ctx.fillStyle=tint;rr(ctx,5,y0+5,W-10,rh-10,16);ctx.fill();ctx.restore();
      txt(ctx,name,26,y0+32,27,INK,'left',900);
      surfC(ctx,16,gy,W-32,rh*.15,'desk',i+30);
      const pos=mov?o.d.x%trav:0,fade=mov?Math.min(1,pos/40,(trav-pos)/40):1,bx=W*.3+pos;
      ctx.save();ctx.globalAlpha=Math.max(0,fade);
      boxC(ctx,bx,gy-bh,bw,bh,0,bx,gy,BOXF);
      drawHand(ctx,'palm',bx,gy-bh/2,.4,0,true);                                         // 손바닥이 상자 왼쪽 면에 닿아 민다
      hArrow(ctx,bx+8,gy-bh-22,AL,1,CH,11,26);txt(ctx,'미는 힘',bx+8+AL+12,gy-bh-22,22,CH,'left',800);
      if(mov){hArrow(ctx,bx+8,gy-bh-62,70,1,CD,9,22);txt(ctx,'운동 방향',bx+8+82,gy-bh-62,22,CD,'left',800);}
      const k=mov?2:1;
      if(o.phase>=k){const a=P(o,k,.6)||1;ctx.globalAlpha=Math.max(0,fade)*a;farrow(ctx,bx+bw/2,gy+rh*.075,AL,-1,11);txt(ctx,'마찰력',bx+bw/2+12,gy+rh*.075,22,CF,'left',900);}
      ctx.restore();
      if(i===0&&o.phase===0)txt(ctx,'밀어도 움직이지 않는다',W-26,y0+32,24,SUBC,'right',800);
      if(o.phase>=k)txt(ctx,mov?'일정한 속력 : 미는 힘 = 마찰력 (크기가 같고 방향은 반대)':'움직이지 않을 때 : 미는 힘 = 마찰력 (크기가 같고 방향은 반대)',W/2,y0+rh-22,22,INK,'center',800);
    });
  };
};

/* ---------- STAGE 4 : 마찰력을 이용하는 예.  단계: 1 작아(스노보드) · 2 커져(제동 장치) · 3 조절(컬링) ----------
   · 스노보드: 처음 속력으로 눈 위를 미끄러진다. 마찰력이 작아서 천천히 느려지며 멀리 간다(등감속, 화살표 = 운동 반대).
   · 제동 장치: 브레이크 패드가 바퀴 테를 잡으면 패드–테 접촉점에서 테의 운동을 방해하는 마찰력(테가 움직이는 방향의 반대)이 생겨 바퀴가 멈춘다.
   · 컬링: 스톤은 얼음 위에서 느려진다. 브러시로 문지르면 마찰력이 작아져(화살표 절반) 덜 느려지므로 더 멀리 간다. 길이 ∝ 감속 크기 */
function glideX(tc,x0,v0,segs){            // segs: [[끝나는 시각, 감속 a],…] 마지막 구간 뒤에는 멈출 때까지 같은 a
  let x=x0,v=v0,t0=0,a=segs[0][1];
  for(const [te,ai] of segs){a=ai;const dt=Math.min(tc,te)-t0;if(dt>0){const tstop=v/a,u=Math.min(dt,tstop);x+=v*u-.5*a*u*u;v=Math.max(0,v-a*u);}
    if(tc<=te)return {x,v,a};t0=te;}
  const u=Math.min(Math.max(0,tc-t0),v/a);x+=v*u-.5*a*u*u;v=Math.max(0,v-a*u);return {x,v,a};
}
ANIMS.uses=o=>{
  o.d.w=3;o.d.ang=0;o.d.last=0;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=Math.min(.04,t-o.d.last);o.d.last=t;
    const rh=H/3,names=['스노보드','자전거 제동 장치','컬링'],tints=[TINT_ICE,TINT_H,TINT_D];
    for(let i=0;i<3;i++){
      const y0=i*rh,gy=y0+rh*.62;
      ctx.save();ctx.fillStyle=tints[i];rr(ctx,5,y0+5,W-10,rh-10,16);ctx.fill();ctx.restore();
      txt(ctx,names[i],28,y0+30,26,INK,'left',900);
      const on=o.phase>=i+1,a=on?(P(o,i+1,.6)||1):0;
      if(i===0){                                              // 스노보드(옆모습): 눈 위를 미끄러지며 천천히 느려진다
        surfC(ctx,16,gy,W-32,rh*.16,'ice',41);
        const T=6,tc=(t%T)-.4,r=glideX(Math.max(0,tc),50,150,[[99,15]]),x=r.x,mv=tc>=0&&r.v>.5;
        ctx.save();ctx.translate(x,gy);ctx.scale(1.3,1.3);
        rr(ctx,0,-12,170,12,6);ctx.fillStyle='#8C6BC8';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4B3480';ctx.stroke();       // 보드
        ctx.beginPath();ctx.moveTo(150,-12);ctx.quadraticCurveTo(178,-14,176,-26);ctx.lineWidth=3;ctx.strokeStyle='#4B3480';ctx.stroke();       // 앞쪽이 살짝 들린 보드 끝
        rr(ctx,64,-24,44,12,5);ctx.fillStyle='#4F5A56';ctx.fill();                                                                 // 바인딩
        rr(ctx,70,-62,32,40,8);ctx.fillStyle='#F6F1E6';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4F5A56';ctx.stroke();           // 부츠·다리
        ctx.restore();
        if(on&&mv){ctx.save();ctx.globalAlpha=a;farrow(ctx,x+110,gy+rh*.07,.15*FSC*.9,-1,8);ctx.restore();}
      }else if(i===1){                                        // 제동 장치: 패드가 테를 잡으면 마찰력으로 바퀴가 멈춘다
        const cx=W*.34,R=40,cy=gy-R-5,brk=on&&((t%5)>2.2);
        surfC(ctx,16,gy,W-32,rh*.16,'desk',43);
        o.d.w+=((brk?0:7)-o.d.w)*Math.min(1,dt*(brk?3.2:2));o.d.ang+=o.d.w*dt;
        ctx.save();ctx.translate(cx,cy);
        ctx.lineWidth=9;ctx.strokeStyle='#3C4A47';ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.stroke();                              // 타이어
        ctx.lineWidth=3;ctx.strokeStyle='#B9C4C1';ctx.beginPath();ctx.arc(0,0,R-6.5,0,TAU);ctx.stroke();                            // 테(림)
        ctx.rotate(o.d.ang);ctx.lineWidth=1.6;ctx.strokeStyle='#8A9794';for(let k=0;k<14;k++){const q=k*TAU/14;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo((R-7)*Math.cos(q),(R-7)*Math.sin(q));ctx.stroke();}
        ctx.fillStyle='#4F5A56';ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill();ctx.restore();
        // 캘리퍼·패드: 테의 맨 위에 닿는다(손잡이로 당기면 눌린다)
        const gap=brk?0:9,padY=cy-R+3-12-gap;
        ctx.save();ctx.strokeStyle='#4F5A56';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-60,cy-R-34);ctx.lineTo(cx-10,cy-R-34);ctx.lineTo(cx,padY+2);ctx.stroke();ctx.restore();
        rr(ctx,cx-15,padY,30,12,3);ctx.fillStyle=brk?CF:'#8A9794';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#4F5A56';ctx.stroke();
        txt(ctx,'브레이크 패드',cx+30,cy-R-30,19,SUBC,'left',700);
        hArrow(ctx,cx+R+28,cy-8,56,1,CD,7,18);txt(ctx,'자전거의 진행 방향',cx+R+92,cy-8,19,CD,'left',800);
        curveArrow(ctx,cx+R*.75,cy-R*.62,cx+R*1.15,cy-R*.1,cx+R*.85,cy+R*.5,SUBC,3,12);txt(ctx,'바퀴 회전',cx+R+34,cy+R*.62,18,SUBC,'left',700);
        // 마찰력: 패드와 닿은 바퀴 테의 접촉점에서 시작, 테가 움직이는 방향(오른쪽)의 반대(왼쪽). 바퀴가 도는 동안만(멈추면 사라진다)
        if(on&&brk&&o.d.w>.4){ctx.save();ctx.globalAlpha=a;farrow(ctx,cx,cy-R-4,70,-1,8);ctx.restore();}
      }else{                                                  // 컬링: 문지르면 감속이 절반(마찰력이 절반) → 더 멀리 간다. 문지르지 않는 회와 문지르는 회를 번갈아 보여 준다
        surfC(ctx,16,gy,W-32,rh*.16,'ice',42);
        const T=6.6,kc=Math.floor(t/T),tc=(t%T)-.4,AA=45,AB=22.5,tA=1.5,sw=on&&kc%2===1;
        const r=glideX(Math.max(0,tc),60,150,sw?[[tA,AA],[99,AB]]:[[99,AA]]),x=r.x,mv=tc>=0&&r.v>.5,sweep=sw&&tc>=tA&&mv;
        const xs=glideX(99,60,150,[[99,AA]]).x;                                         // 문지르지 않을 때 멈추는 위치
        if(on){ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle=SUBC;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(xs+83,gy-62);ctx.lineTo(xs+83,gy+rh*.16);ctx.stroke();ctx.restore();
          if(!(mv&&x>xs-40))txt(ctx,'문지르지 않으면 여기까지',xs+92,gy+rh*.08,17,SUBC,'left',700);}      // 화살표와 겹치는 동안은 글자를 잠시 숨긴다
        ctx.save();ctx.translate(x,gy);ctx.scale(1.3,1.3);rr(ctx,0,-34,64,34,15);ctx.fillStyle='#8E979B';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4F5A56';ctx.stroke();rr(ctx,16,-48,32,14,6);ctx.fillStyle='#D85C4A';ctx.fill();ctx.stroke();ctx.restore();
        const bx=x+150+(sweep?Math.sin(t*14)*9:0);
        ctx.save();ctx.strokeStyle='#7B5A38';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx+(sweep?34:60),sweep?gy-128:gy-100);ctx.lineTo(bx,sweep?gy-6:gy-40);ctx.stroke();
        rr(ctx,bx-26,sweep?gy-10:gy-48,48,12,4);ctx.fillStyle='#E7B54B';ctx.fill();ctx.restore();                       // 브러시: 문지를 때만 얼음에 닿는다
        if(on&&mv){ctx.save();ctx.globalAlpha=a;farrow(ctx,x+42,gy+rh*.07,r.a*1.2,-1,8);ctx.restore();}
        if(on&&tc>=0)txt(ctx,sw?(sweep?'문지른다 : 마찰력이 작아져 덜 느려진다':'(곧 문지르기 시작)'):'문지르지 않는다',W-26,y0+30,22,sweep?CF:SUBC,'right',800);
      }
      if(on){ctx.save();ctx.globalAlpha=a;
        const lab=['눈 위에서는 마찰력이 작다 → 잘 미끄러진다','제동 장치를 작동하면 마찰력이 커진다 → 멈춘다','브러시로 문질러 마찰력을 조절한다'][i];
        txt(ctx,lab,W-26,y0+rh-22,24,CF,'right',900);ctx.restore();}
    }
  };
};

/* ---------- 선택 : 확대해 보면 (요철설 모형) ----------
   매끄러워 보이는 면도 아주 작게 보면 울퉁불퉁하다. 움직이려 하면 위 물체의 요철이 아래 면의 요철과 맞물려 걸린다.
   모식 모형: 위 물체의 높이 오르내림 dy = h·(1 − |1 − 2·dx′/λ|)  (dx′ = dx mod λ, 삼각파) */
ANIMS.zoom=o=>{
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const rh=(H-40)/2;
    [['매끄러워 보이는 면',6,26,TINT_ICE],['거친 면',16,44,TINT_F]].forEach(([name,h,lam,tint],i)=>{
      const y0=i*rh,by=y0+rh*.62;
      ctx.save();ctx.fillStyle=tint;rr(ctx,5,y0+5,W-10,rh-10,16);ctx.fill();ctx.restore();
      txt(ctx,name+' (확대 모식)',26,y0+30,25,INK,'left',900);
      const pad=40,x0=pad,x1=W-pad,N=Math.floor((x1-x0)/lam);
      // 아래 면: 삼각 요철
      ctx.beginPath();ctx.moveTo(x0,y0+rh-14);ctx.lineTo(x0,by);
      for(let k=0;k<N;k++){ctx.lineTo(x0+lam*(k+.5),by-h*1.6);ctx.lineTo(x0+lam*(k+1),by);}
      ctx.lineTo(x0+N*lam,y0+rh-14);ctx.closePath();ctx.fillStyle='#B98B5B';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#7B5A38';ctx.lineJoin='round';ctx.stroke();
      // 위 물체: 오른쪽으로 밀리며 요철을 넘는다. 위 물체의 바닥도 같은 요철 → 요철이 맞물렸을 때(ph=0)는 가장 낮고, 꼭대기끼리 만나면(ph=.5) 가장 높이 들린다
      const tooth=h*1.6,m=Math.max(3,Math.floor(W*.36/lam)),bw=m*lam,AR=64,travel=x1-x0-bw-AR-30,dx=((t*(i?16:34))%travel),bx=x0+AR+14+dx;
      const ph=(((bx-x0)/lam)%1+1)%1,dy=tooth*(1-Math.abs(1-2*ph));
      ctx.save();ctx.translate(0,-dy);
      ctx.beginPath();ctx.moveTo(bx,by-96);ctx.lineTo(bx,by);
      for(let k=0;k<m;k++){ctx.lineTo(bx+lam*(k+.5),by-tooth);ctx.lineTo(bx+lam*(k+1),by);}
      ctx.lineTo(bx+bw,by-96);ctx.closePath();ctx.fillStyle=BOXF;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=BOXS;ctx.lineJoin='round';ctx.stroke();ctx.restore();
      const bxx=bx;
      hArrow(ctx,bx-AR-6,by-48-dy,AR,1,CH,9,22);txt(ctx,'미는 힘',bx-AR-6,by-74-dy,21,CH,'left',800);      // 미는 힘: 도막 뒤쪽(왼쪽)에서 도막을 향해(모든 장면 같은 크기)
      const FL=i?90:36,fx=bx+bw/2+FL/2;farrow(ctx,fx,by+rh*.17,FL,-1,9);txt(ctx,'마찰력',fx+10,by+rh*.17,21,CF,'left',900);
    });
    band(ctx,'같은 힘으로 밀 때 요철이 더 많이 걸리는 면에서 더 천천히 움직인다 (모식 그림)',W/2,H-18,22);
  };
};

/* ---------- 선택 : 가상 용수철저울 — 나무 도막을 당겨 움직이기 시작할 때의 눈금 ----------
   눈금 = μ × 도막의 무게(도막 1개 1 N).  책상 μ=.40, 사포 μ=.80 → 0.4 / 0.8 / 0.8 / 1.6 N
   당기는 동안 눈금은 천천히 커지고, 도막이 움직이기 시작하는 순간의 눈금을 읽는다(그 뒤 일정한 속력으로 당긴다고 보고 같은 값으로 단순화) */
const PULL={s:0,n:1,go:0,req:0,rec:{}};
ANIMS.pull=o=>{
  o.d.last=-1;o.d.t0=0;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    if(PULL.req!==o.d.last){o.d.last=PULL.req;o.d.t0=t;}
    const ps=D.PULL_SURF[PULL.s],mu=ps[1],fmax=mu*PULL.n*D.PULL_W,tt=PULL.go?t-o.d.t0:0;
    const gy=H*.44,TP=2.2,u=clamp(tt/TP,0,1),pulling=PULL.go&&tt<TP,moving=PULL.go&&tt>=TP;
    const reading=PULL.go?(pulling?fmax*u:fmax):0,mv=moving?Math.min(W*.1,(tt-TP)*70):0;
    surfC(ctx,16,gy,W-32,34,SURF_KIND[ps[0]],12);
    const bw=96,bh=54,bx=W*.2+mv,n=PULL.n,sy=gy-bh*.5;
    for(let k=0;k<n;k++)boxC(ctx,bx,gy-(k+1)*bh,bw,bh,0,bx,gy,BOXF);
    // 고리 → 용수철저울(케이스·눈금·바늘) → 손잡이를 쥔 손 : 모두 이어져 있다
    const sx=bx+bw+34,sw=Math.min(240,W*.3),hx=sx+sw+30;
    ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx+bw,sy);ctx.lineTo(sx,sy);ctx.stroke();                                    // 도막 ↔ 저울 고리(줄)
    ctx.fillStyle='#fff';rr(ctx,sx,sy-30,sw,60,10);ctx.fill();ctx.lineWidth=4;ctx.stroke();                 // 저울 케이스
    for(let k=0;k<=4;k++){const xx=sx+14+(sw-28)*k/4;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(xx,sy-30);ctx.lineTo(xx,sy-16);ctx.stroke();txt(ctx,k===4?'2 N':String(k*.5),xx,sy-46,19,SUBC,'center',700);}
    const nx=sx+14+(sw-28)*reading/2;ctx.strokeStyle=CF;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(nx,sy-28);ctx.lineTo(nx,sy+28);ctx.stroke();
    ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sx+sw,sy);ctx.lineTo(hx,sy);ctx.stroke();                         // 저울 ↔ 손잡이
    ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(hx,sy-24);ctx.lineTo(hx,sy+24);ctx.stroke();ctx.restore();                         // 손잡이(세로 막대)
    drawHand(ctx,'grip',hx,sy,.5,0,false);                                                                   // 손이 손잡이를 쥐고 있다
    if(PULL.go&&reading>.05)farrow(ctx,bx+bw/2,gy+17,reading*FSC*.55,-1,9);                                   // 마찰력: 도막 바닥 가운데에서 왼쪽
    const by=H-196;
    rr(ctx,24,by,W-48,74,16);ctx.fillStyle='#fff';ctx.fill();
    txt(ctx,'도막 '+n+'개 · '+ps[0]+' 위',24+(W-48)*.26,by+37,26,INK,'center',900);
    txt(ctx,'눈금 '+reading.toFixed(1)+' N',24+(W-48)*.7,by+37,32,CF,'center',900);
    const ky=H-96;
    [[0,1],[0,2],[1,1],[1,2]].forEach(([s,k],i)=>{const key=s+'-'+k,w=(W-48)/4-8,x=24+i*((W-48)/4),has=PULL.rec[key]!=null;
      rr(ctx,x,ky,w,70,12);ctx.fillStyle=has?'#fff':'rgba(255,255,255,.4)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=(s===PULL.s&&k===PULL.n)?CB:'#C9D3D1';ctx.stroke();
      txt(ctx,D.PULL_SURF[s][0]+' · 도막 '+k+'개',x+w/2,ky+22,18,INK,'center',800);txt(ctx,has?PULL.rec[key]+' N':'?',x+w/2,ky+50,26,has?CF:SUBC,'center',900);});
    if(moving){const key=PULL.s+'-'+PULL.n;PULL.rec[key]=fmax.toFixed(1);}
    if(!PULL.go)band(ctx,'면과 도막 수를 고르고 [당기기]를 눌러 보자',W/2,28,24);
    else if(pulling)band(ctx,'천천히 당긴다 : 움직이기 직전의 눈금을 읽는다',W/2,28,23);
    else band(ctx,'도막이 움직이기 시작했다 → 눈금 '+fmax.toFixed(1)+' N',W/2,28,24);
  };
};

/* ---------- 선택 : 밀어 보기 (지도서 보충·심화) — 정지 마찰력 · 최대 정지 마찰력 · 운동 마찰력 ----------
   상자 무게 PUSH_W = 10 N, 최대 정지 마찰력 5 N, 운동 마찰력 4 N.  미는 힘 F 를 0 → 8 N 로 조절한다.
   F ≤ 5 : 움직이지 않는다 (마찰력 = F)   F > 5 : 움직이기 시작 → 마찰력 4 N (이후 F ≥ 4 이면 계속 움직이고, 4 보다 작아지면 멈춘다) */
const PUSH={F:0,auto:0,tgt:0,reset:0};
ANIMS.push=o=>{
  o.d.mov=false;o.d.x=0;o.d.last=0;
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=Math.min(.04,t-o.d.last);o.d.last=t;
    if(PUSH.reset){PUSH.reset=0;o.d.mov=false;o.d.x=0;o.d.v=0;o.d.done=false;}
    if(PUSH.auto&&!o.d.done){const d=PUSH.tgt-PUSH.F;PUSH.F+=Math.sign(d)*Math.min(Math.abs(d),1.5*dt);                // 스페이스바: 1회 → 최대 정지 마찰력까지, 2회 → 그 이상으로 커져 도막이 움직인다
      const r=document.querySelector('.slide.active [data-sl="F"] input'),vv=document.querySelector('.slide.active [data-sl="F"] .val');
      if(r)r.value=PUSH.F;if(vv)vv.textContent=(Math.round(PUSH.F*10)/10)+' N';}
    const F=PUSH.F,MS=D.PUSH_MAXS,KN=D.PUSH_KIN;
    if(!o.d.mov&&F>MS&&!o.d.done)o.d.mov=true;
    if(o.d.mov&&F<KN&&(o.d.v||0)<=.01)o.d.mov=false;                          // 미는 힘이 운동 마찰력보다 작아져도 속력이 0 이 될 때까지는 계속 미끄러진다
    const fr=o.d.mov?KN:Math.min(F,MS);                                // 마찰력의 크기
    o.d.v=o.d.v||0;if(o.d.mov&&!o.d.done){o.d.v=Math.max(0,o.d.v+(F-KN)*38*dt);}else o.d.v=0;       // 알짜힘 = 미는 힘 − 운동 마찰력 → 가속(질량 1 kg: 10 N)
    o.d.x+=o.d.v*dt;if(o.d.x>=W*.38){o.d.x=W*.38;o.d.v=0;o.d.done=true;}       // 오른쪽 끝(멈춤 턱)에 닿으면 한 번만 움직이고 멈춘다
    const gy=H*.44,bx=W*.28+o.d.x,bw=110,bh=84,U=Math.min(46,(W*.3)/8);
    surfC(ctx,16,gy,W-32,34,'desk',44);rr(ctx,W*.28+W*.38+bw+8,gy-bh-6,16,bh+6,4);ctx.save();ctx.fillStyle='#7B5A38';ctx.fill();ctx.restore();
    boxC(ctx,bx,gy-bh,bw,bh,0,bx,gy,BOXF);txt(ctx,'10 N',bx+bw/2,gy-bh/2,28,'#fff','center',900);
    drawHand(ctx,'palm',bx-8,gy-bh/2,.5,0,true);
    if(F>.05)hArrow(ctx,bx+10,gy-bh-24,F*U,1,CH,11,Math.min(26,F*U*.8));
    txt(ctx,'미는 힘 '+F.toFixed(1)+' N',bx+10,gy-bh-56,24,CH,'left',900);
    if(!o.d.done){farrow(ctx,bx+bw*.5+fr*U*.5,gy+19,fr*U,-1,11);
    txt(ctx,'마찰력 '+fr.toFixed(1)+' N',bx+bw*.5-6,gy+60,26,CF,'left',900);}
    // 그래프 : 미는 힘 → 마찰력
    const g={x:100,y:gy+104,w:W-170,h:H-(gy+104)-124,x0:0,x1:8,y0:0,y1:6,xl:'미는 힘 (N)',yl:'마찰력 (N)',xt:[0,2,4,6,8],yt:[0,2,4,6]};
    plotAxes(ctx,g);
    ctx.save();ctx.strokeStyle=CF;ctx.lineWidth=5;ctx.lineJoin='round';ctx.beginPath();
    ctx.moveTo(plotX(g,0),plotY(g,0));ctx.lineTo(plotX(g,MS),plotY(g,MS));ctx.lineTo(plotX(g,MS),plotY(g,KN));ctx.lineTo(plotX(g,8),plotY(g,KN));ctx.stroke();ctx.restore();
    plotDot(ctx,g,F,fr,CH,10);
    txt(ctx,'최대 정지 마찰력 '+MS+' N',plotX(g,MS)-10,plotY(g,MS)-18,20,CF,'right',800);txt(ctx,'운동 마찰력 '+KN+' N',plotX(g,8),plotY(g,KN)+26,20,CF,'right',800);
    band(ctx,o.d.done?'오른쪽 끝에 닿아 멈췄다 (처음으로 돌아가면 다시 해 볼 수 있다)':o.d.mov?'상자가 움직인다 : 운동 마찰력 '+KN+' N 이 작용한다':(F<.05?'미는 힘을 조절해 보자':'움직이지 않는다 : 마찰력 = 미는 힘'),W/2,H-26,25);
  };
};

/* 슬라이드. 문장은 data.py 의 B 에서 가져와야 학습지와 빈칸이 일치한다.
   T('…[[정답]]…') → 정답이 .bl(클릭하면 나타나는 빈칸)이 된다.
   빈칸 순서는 학습지 교사용 정답과 같다: 크게·접촉면·마찰력 | 짧다·크다 | 반대 | 거칠수록·무거울수록 | 반대·반대 | 작아·커져·조절 */

/* '해 보기' : ●(접촉면)에서 시작하는 화살표를 끌어서 그린다. 길이는 일정하게 하고 방향만 본다. 정답 방향과 35° 이내면 맞음 */
const SCN_OK=['정답! 왼쪽','정답! 빗면 위쪽','정답! 오른쪽'];
function bindArrows(el){
  const svg=el.querySelector('.scn svg');if(!svg)return;
  svg.querySelectorAll('.uarr,.ubadge').forEach(n=>n.remove());
  if(svg._bound)return;svg._bound=true;stopAll(svg);svg.style.touchAction='none';svg.style.cursor='crosshair';
  const dots=[...svg.querySelectorAll('.gdot')],NS='http://www.w3.org/2000/svg';
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  let cur=null;
  const mk=(tag,at)=>{const n=document.createElementNS(NS,tag);Object.keys(at).forEach(k=>n.setAttribute(k,at[k]));return n;};
  const draw=(c,ang)=>{const L=54,x2=c.cx+Math.cos(ang)*L,y2=c.cy+Math.sin(ang)*L,hb=12*.8;
    c.g.innerHTML='';c.g.appendChild(mk('line',{x1:c.cx+Math.cos(ang)*8,y1:c.cy+Math.sin(ang)*8,x2:x2-Math.cos(ang)*hb,y2:y2-Math.sin(ang)*hb,stroke:INK,'stroke-width':5,'stroke-linecap':'round'}));
    const p1=[x2-Math.cos(ang-.45)*12,y2-Math.sin(ang-.45)*12],p2=[x2-Math.cos(ang+.45)*12,y2-Math.sin(ang+.45)*12];
    c.g.appendChild(mk('polygon',{points:`${x2},${y2} ${p1} ${p2}`,fill:INK}));};
  svg.addEventListener('pointerdown',e=>{
    const p=pt(e),i=Math.max(0,Math.min(2,Math.floor(p.x/160))),d=dots[i];if(!d)return;
    svg.querySelectorAll(`[data-i="${i}"].uarr,[data-i="${i}"].ubadge`).forEach(n=>n.remove());
    const g=mk('g',{class:'uarr','data-i':i});svg.appendChild(g);
    cur={i,g,cx:+d.getAttribute('cx'),cy:+d.getAttribute('cy'),ok:+d.getAttribute('data-ang'),ang:null};
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    move(e);});
  const move=e=>{if(!cur)return;const p=pt(e),dx=p.x-cur.cx,dy=p.y-cur.cy;if(Math.hypot(dx,dy)<6)return;cur.ang=Math.atan2(dy,dx);draw(cur,cur.ang);};
  svg.addEventListener('pointermove',move);
  const up=()=>{if(!cur)return;const c=cur;cur=null;if(c.ang==null){c.g.remove();return;}
    let df=Math.abs(c.ang*180/Math.PI-c.ok)%360;if(df>180)df=360-df;const ok=df<=35,x0=c.i*160;
    const b=mk('g',{class:'ubadge','data-i':c.i});
    b.appendChild(mk('rect',{x:x0+52,y:9,width:100,height:24,rx:12,fill:ok?'#1F7A6C':'#F4C33B'}));
    const t=mk('text',{x:x0+102,y:25.5,'text-anchor':'middle','font-size':12.5,'font-weight':800,fill:ok?'#fff':INK});t.textContent=ok?SCN_OK[c.i]:'반대 방향은?';b.appendChild(t);svg.appendChild(b);};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}

  step(n,el){el.querySelectorAll('.garrow').forEach(g=>g.classList.toggle('on',n>=1));}});

/* 가상 실험 — 면을 골라 병뚜껑을 놓는다 (선택) */
S({stageNo:2,chip:'가상 실험',title:'면을 바꿔 병뚜껑을 놓아 보자',tocName:'가상 실험 : 병뚜껑',note:NX('s2'),rows:true,
  body:`<div class="col" style="flex:0 0 440px;gap:16px;justify-content:flex-start">
    <div class="panel" style="font-size:29px;line-height:1.5">같은 높이에서 병뚜껑을 놓는다. 면을 고르고 [놓기]를 눌러, 미끄러진 거리를 비교해 보자.</div>
    <div class="qnote" style="font-size:27px;margin:0">접촉면</div>
    ${btnRow('data-surf',D.SURF.map((s,i)=>[i,s[0]]),'sbtns')}
    <div class="gkinds"><button class="cbtn go" data-go>놓기</button><button class="cbtn" data-clr>지우기</button></div>
    <div class="qnote" style="font-size:26px">주황 화살표가 길수록 마찰력이 크다</div>
  </div><div class="col">${A('cap',700)}</div>`,
  enter(el){
    CAP.s=1;CAP.go=0;CAP.req++;CAP.rec={};markBtns(el,'[data-surf]',CAP.s);
    if(el._bound)return;el._bound=true;el.querySelectorAll('.gkinds').forEach(stopAll);
    el.querySelectorAll('[data-surf] .cbtn').forEach(b=>b.addEventListener('click',()=>{CAP.s=+b.dataset.v;CAP.go=0;markBtns(el,'[data-surf]',CAP.s);}));   // 면을 바꾸면 병뚜껑은 출발점에서 기다린다
    el.querySelector('[data-go]').addEventListener('click',()=>{CAP.go=1;CAP.req++;});
    el.querySelector('[data-clr]').addEventListener('click',()=>{CAP.rec={};CAP.go=0;});
  }});

/* ================= STAGE 3 : 마찰력의 크기와 방향 =================
   빈칸 1 거칠수록 · 2 무거울수록  /  1 반대(정지) · 2 반대(운동) */
TS({stageNo:3,chip:'크기',title:'마찰력의 크기',tocName:'마찰력의 크기',anim:'size',max:2,note:NX('s3'),tw:560,h:640,
  text:`<div class="panel glow">${LL(B.s3_size)}</div>
   <div class="qnote step" style="font-size:26px">끄는 힘은 모두 같다 &nbsp;|&nbsp; 마찰력의 크기 (모식) &nbsp;(가) &gt; (나) &gt; (다)</div>`});

TS({stageNo:3,chip:'방향',title:'마찰력의 방향',tocName:'마찰력의 방향',anim:'dir',max:2,note:NX('s3'),tw:600,h:660,
  text:`<div class="panel glow">${LL(B.s3_dir)}</div>
   <div class="qnote step" style="font-size:26px">‘운동을 방해하는 방향’ = 미끄러지려는(미는) 방향의 반대</div>`});

/* 가상 용수철저울 — 나무 도막을 당겨 본다 (선택) */
S({stageNo:3,chip:'가상 실험',title:'나무 도막을 당길 때의 눈금',tocName:'가상 용수철저울',note:NX('s3'),rows:true,
  body:`<div class="col" style="flex:0 0 430px;gap:16px;justify-content:flex-start">
    <div class="panel" style="font-size:28px;line-height:1.5">도막이 움직이기 시작할 때의 용수철저울 눈금을 읽는다. 도막 1개의 무게는 ${D.PULL_W} N이다.</div>
    <div class="qnote" style="font-size:27px;margin:0">접촉면</div>
    ${btnRow('data-ps',D.PULL_SURF.map((s,i)=>[i,s[0]]),'sbtns')}
    <div class="qnote" style="font-size:27px;margin:0">도막 수</div>
    ${btnRow('data-pn',[[1,'1개'],[2,'2개']],'sbtns')}
    <div class="gkinds"><button class="cbtn go" data-go>당기기</button><button class="cbtn" data-clr>지우기</button></div>
  </div><div class="col">${A('pull',700)}</div>`,
  enter(el){
    PULL.s=0;PULL.n=1;PULL.go=0;PULL.req++;PULL.rec={};markBtns(el,'[data-ps]',PULL.s);markBtns(el,'[data-pn]',PULL.n);
    if(el._bound)return;el._bound=true;el.querySelectorAll('.gkinds').forEach(stopAll);
    el.querySelectorAll('[data-ps] .cbtn').forEach(b=>b.addEventListener('click',()=>{PULL.s=+b.dataset.v;PULL.go=0;markBtns(el,'[data-ps]',PULL.s);}));
    el.querySelectorAll('[data-pn] .cbtn').forEach(b=>b.addEventListener('click',()=>{PULL.n=+b.dataset.v;PULL.go=0;markBtns(el,'[data-pn]',PULL.n);}));
    el.querySelector('[data-go]').addEventListener('click',()=>{PULL.go=1;PULL.req++;});
    el.querySelector('[data-clr]').addEventListener('click',()=>{PULL.rec={};PULL.go=0;});
  }});

/* 확대해 보면 — 마찰력이 생기는 까닭(요철설 모식) (선택) */
S({stageNo:3,chip:'확대해 보면',title:'매끄러워 보여도 확대하면?',tocName:'확대해 보면',note:NX('s1'),rows:true,
  body:`<div class="col" style="flex:0 0 520px;gap:18px;justify-content:flex-start">
    <div class="panel" style="font-size:30px;line-height:1.55">매끄러워 보이는 면도 아주 작게 보면 <b>울퉁불퉁</b>하다. 물체를 밀면 두 면의 울퉁불퉁한 부분이 서로 걸린다.</div>
    <div class="qnote" style="font-size:27px">거친 면은 걸리는 부분이 더 커서 마찰력이 더 크다. (모식 그림)</div>
  </div><div class="col">${A('zoom',660)}</div>`});

/* 밀어 보기 — 정지 마찰력과 운동 마찰력 (선택, 지도서 보충·심화) */
S({stageNo:3,chip:'밀어 보기',title:'미는 힘을 키워 보자',tocName:'밀어 보기',note:NX('s3'),rows:true,extra:2,
  step(n,el){const was=PUSH.stp;PUSH.stp=n;PUSH.auto=n>=1?1:0;PUSH.tgt=n>=2?8:(n===1?D.PUSH_MAXS:0);
    if(n<2&&was===2||n===0){PUSH.reset=1;} if(n===0){PUSH.F=0;const r=el.querySelector('[data-sl="F"] input');if(r){r.value=0;el.querySelector('[data-sl="F"] .val').textContent='0 N';}}},
  body:`<div class="col" style="flex:0 0 430px;gap:16px;justify-content:flex-start">
    <div class="panel" style="font-size:28px;line-height:1.5">무게 ${D.PUSH_W} N인 상자를 수평면에서 민다. 미는 힘을 천천히 키우면 마찰력은 어떻게 변할까?</div>
    ${sliderHTML('F','미는 힘',0,8,0.5,0,CH,v=>v+' N')}
    <div class="qnote" style="font-size:26px">스페이스바 1번: 최대 정지 마찰력까지 커진다 → 2번: 더 커져 상자가 움직인다 (슬라이더로 직접 조절도 가능). 움직이기 시작하는 순간의 마찰력이 가장 크다 (최대 정지 마찰력)</div>
  </div><div class="col">${A('push',700)}</div>`,
  enter(el){
    PUSH.F=0;PUSH.auto=0;const r=el.querySelector('[data-sl="F"] input');if(r){r.value=0;el.querySelector('[data-sl="F"] .val').textContent='0 N';}
    if(el._bound)return;el._bound=true;bindSlider(el,'F',v=>v+' N',v=>{PUSH.auto=0;PUSH.F=v;});
  }});

/* ================= STAGE 4 : 마찰력을 이용하는 예 =================
   빈칸 1 작아 · 2 커져 · 3 조절 */
TS({stageNo:4,chip:'이용',title:D.STAGES[4],tocName:'마찰력을 이용하는 예',anim:'uses',max:3,note:NX('s4'),tw:620,h:660,
  text:`<div class="panel glow" style="font-size:29px">${LL(B.s4_use)}</div>`});

/* 우리 주변 — 지도서의 예 6가지를 그림으로 (선택, 빈칸 없음) */
S({stageNo:4,chip:'생각해 보기',title:'우리 주변의 마찰력 이용 찾기',tocName:'마찰력을 이용하는 예 찾기',note:NX('s4'),
  body:`<div class="qnote" style="text-align:center">${D.FIND_Q}</div>
   <div class="tiny" style="text-align:center;font-size:26px">모둠에서 이야기해 본 뒤 눌러서 예시를 확인하자 (주황 화살표 = 마찰력)</div>
   <div class="exgrid">${FIG_EXAMPLES.map(e=>`<div class="cd step"><div class="exfig">${e.svg}</div><div class="exnm">${e.name}<span class="exchip ${e.chip==='크게'?'up':'dn'}">마찰력 ${e.chip}</span></div><div class="excap">${e.cap}</div></div>`).join('')}</div>`});

/* 카드 분류 — 마찰력을 크게? 작게? (선택, 빈칸 없음) */
sortSlide({id:'fr',stageNo:4,chip:'카드 분류',title:'마찰력을 크게 할까, 작게 할까?',tocName:'카드 분류 : 크게·작게',seed:5,
  left:`<div class="panel" style="padding:20px;font-size:29px;line-height:1.6">미끄러지지 않게 하려면 마찰력을 <b>크게</b>, 잘 미끄러지게 하려면 마찰력을 <b>작게</b> 한다.</div><div class="tiny" style="font-size:26px;text-align:center">카드의 방법은 마찰력을 어떻게 하려는 것일까?</div>`,
  bins:{a:['마찰력을 크게',''],b:['마찰력을 작게','']},
  cards:D.SORT_CARDS,
  extra:{note:NX('s4')}});

/* ================= 정리 (빈칸 반복) ================= */
S({review:true,chip:'정리 ①',title:'마찰력이란',tocName:'정리 ① 마찰력',
  body:`<div class="panel">${LL(B.s1_def.concat(B.s2_obs))}</div>`});
S({review:true,chip:'정리 ②',title:'마찰력의 방향과 크기',tocName:'정리 ② 방향과 크기',
  body:`<div class="panel">${LL(B.s2_dir.concat(B.s3_size,B.s3_dir))}</div>`});
S({review:true,chip:'정리 ③',title:'마찰력을 이용하는 예',tocName:'정리 ③ 이용',
  body:`<div class="panel">${LL(B.s4_use)}</div>`});

/* ================= BOSS : 개념 확인 퀘스트 (학습지 Q1~Q5와 같은 문제) ================= */
QSA(1,D.Q1_Q,D.Q1,D.Q1_NOTE,220,null,{note:NX('q')});
QSA(2,D.Q2_Q,D.Q2,D.Q2_NOTE,260,null,{note:NX('q')});
QOX(3,D.Q3_Q,D.Q3,D.Q3_NOTE,{note:NX('q')});
QMC(4,D.Q4_Q,D.Q4_OPTS,D.Q4_ANS-1,D.Q4_NOTE,{note:NX('q')});
QD(5,D.Q5_Q,D.Q5_MODEL,D.Q5_KEYS,D.Q5_NOTE,{note:NX('q')});

/* ================= 마무리 : 스스로 점검 ================= */
S({ch:'E',chName:'마무리',chip:'스스로 점검',title:'오늘 배운 내용을 점검해 봅시다',tocName:'스스로 점검',
  body:`<div class="panel glow">${D.SELF_CHECK.map(t=>`<div class="step" style="font-size:36px;font-weight:700;margin:12px 0">☐ &nbsp;${t}</div>`).join('')}</div>
   <div class="bubbleRow"><img class="mascot" src="${MASCOT_FRIC}" alt="탐이"><div class="bubble">모두 체크했다면 오늘 수업 성공!<br>수고했어요!</div></div>`});

/* 수업 45분 운영 — '선택' 표시는 빈칸·문제가 없는 활동 슬라이드에만 붙인다 (학습지와의 1:1 대응이 깨지지 않는다) */
['가상 실험 : 병뚜껑','가상 용수철저울','확대해 보면','밀어 보기','마찰력을 이용하는 예 찾기','카드 분류 : 크게·작게'].forEach(n=>{
  const d=SLIDES.find(x=>x.tocName===n);if(d){d.chip=(d.chip||'')+' · 선택';d.tocName=n+' (선택)';}});

/* ---------- 시작 (자동 추가 — 단원 파일에 쓰지 않는다) ---------- */
assignStages();buildDeck();fit();setMode(/self/i.test(location.hash),true);go(0,0);
</script></body></html>
