/* ───────────────── 활동용 애니메이션 (빈칸 단계와 무관, 직접 조작) ───────────────── */

/* 또 다른 해 보기 : 지구 둘레 아무 곳이나 눌러 물체를 놓으면 지구 중심 쪽으로 떨어진다.  GLOBE.kind = 'ball' | 'drop' | 'human' */
const GLOBE={kind:'ball',ext:false};
ANIMS.globe=o=>{
  const R=165,cx=o.W/2,cy=o.H/2+14;o.d.items=[];o.d.last=0;
  o.cv.style.cursor='pointer';o.cv.style.touchAction='none';
  o.cv.onclick=e=>e.stopPropagation();
  o.cv.onpointerdown=e=>{e.stopPropagation();
    const r=o.cv.getBoundingClientRect(),x=(e.clientX-r.left)*o.W/r.width,y=(e.clientY-r.top)*o.H/r.height;
    const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);
    if(d<R+30)return;                                                    // 지구 안쪽은 무시
    if(o.d.items.length>=14)o.d.items.shift();
    const lim=Math.min(o.W/2-30,o.H/2-50)+14;                           // 화면 밖으로 나가지 않게
    o.d.items.push({a:Math.atan2(dy,dx),r:Math.min(d,Math.max(R+90,lim)),v:0,kind:GLOBE.kind,landed:false,n:o.d.items.length});
  };
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const dt=Math.min(.05,t-o.d.last);o.d.last=t;
    body(ctx,cx,cy,R,CE,TINT_E);
    ball(ctx,cx,cy,7,INK);txt(ctx,'지구 중심',cx,cy+30,24,CE,'center',800);
    let land=0;
    o.d.items.forEach(it=>{
      const hum=it.kind==='human',stop=R+(hum?-2:(it.kind==='drop'?11:17));
      if(!it.landed){it.v+=1100*dt;it.r-=it.v*dt;if(it.r<=stop){it.r=stop;it.landed=true;}}
      if(it.landed)land++;
      const ca=Math.cos(it.a),sa=Math.sin(it.a),x=cx+it.r*ca,y=cy+it.r*sa;
      if(it.kind==='ball')ball(ctx,x,y,17,'#8B5A2B');
      else if(it.kind==='drop'){ctx.save();ctx.translate(x,y);ctx.rotate(it.a+Math.PI/2);drop(ctx,0,0,1.15,CM);ctx.restore();}
      else{ctx.save();ctx.translate(x,y);ctx.rotate(it.a+Math.PI/2);
        drawHuman(ctx,0,0,.85,it.landed?{near_arm:[8,12]}:{near_arm:[150,172],far_arm:[-150,-172],near_leg:[24,-10],far_leg:[-20,-8]},
          {shirt:['#F4C33B','#8E9AAF','#D8C3A5'][it.n%3],tail:it.n%2===0});ctx.restore();}
      // 중력 화살표: 물체의 가운데(●)에서 지구 중심 쪽으로
      const off=hum?44:0,sd=hum?36:0,px=x+ca*off-sa*sd,py=y+sa*off+ca*sd;   // 사람은 몸 옆에서 시작해 몸을 가리지 않게
      if(GLOBE.ext){ctx.save();ctx.strokeStyle=CG;ctx.globalAlpha=.8;ctx.lineWidth=4;ctx.setLineDash([12,9]);ctx.beginPath();ctx.moveTo(hum?x:px-ca*72,hum?y:py-sa*72);ctx.lineTo(cx,cy);ctx.stroke();ctx.restore();}
      ball(ctx,px,py,6,INK);arrow(ctx,px-ca*8,py-sa*8,px-ca*72,py-sa*72,CG,7,17);
    });
    if(!o.d.items.length)band(ctx,'지구 둘레 아무 곳이나 눌러 물체를 놓아 보자',W/2,46,30);
    else if(GLOBE.ext&&land>=2)band(ctx,'화살표를 늘이면 모두 지구 중심에서 만난다!',W/2,46,30);
    else if(land>=4)band(ctx,'어디에 놓아도 지구 중심 쪽으로 떨어진다!',W/2,46,30);
    txt(ctx,'놓은 물체 '+o.d.items.length+'개 · 처음부터 다시: R 키',W-24,H-22,22,SUBC,'right',700);
  };
};

/* 점프 비교 : 같은 힘(같은 처음 속도)으로 뛰면 달에서는 약 6배 높이 올라가고 6배 오래 떠 있다.  o.go() 로 점프 */
ANIMS.jump=o=>{
  o.d.t0=null;o.d.peak=[0,0];
  const V=200,gE=500,gM=gE/6;                      // 지구 최고 높이 V²/2g = 40 px, 달 = 240 px
  o.go=()=>{o.d.t0=o.t;o.d.peak=[0,0];};
  const CROUCH={T:6,near_leg:[42,-34],far_leg:[30,-40],near_arm:[-30,-60],far_arm:[-40,-70]},UP={near_arm:[150,172],far_arm:[-150,-172],near_leg:[22,-8],far_leg:[-18,-6]};
  const mix=(a,b,k)=>{const r={},ks=Object.keys(Object.assign({},a,b));ks.forEach(key=>{const x=a[key]!==undefined?a[key]:STAND_POSE[key],y=b[key]!==undefined?b[key]:STAND_POSE[key];
    r[key]=Array.isArray(x)?x.map((v,i)=>v+(y[i]-v)*k):x+(y-x)*k;});return r;};
  o.frame=()=>{const {ctx,W,H,t}=o;clear(o);
    const gy=H-96,pw=W/2,tt=o.d.t0==null?-1:t-o.d.t0,CR=.25;let all=tt>=0;
    [['지구',CE,TINT_E,gE],['달',CM,TINT_M,gM]].forEach(([n,c,tint,g],i)=>{
      const x0=i*pw;ctx.save();ctx.fillStyle=tint;rr(ctx,x0+10,10,pw-20,H-20,18);ctx.fill();ctx.restore();
      ctx.fillStyle=c;ctx.fillRect(x0+26,gy,pw-52,18);txt(ctx,n,x0+60,48,34,c,'left',900);
      let h=0,pose=STAND_POSE;const T=2*V/g;
      if(tt>=0){
        if(tt<CR)pose=mix(STAND_POSE,CROUCH,tt/CR);
        else if(tt<CR+T){const s=tt-CR;h=Math.max(0,V*s-.5*g*s*s);pose=mix(CROUCH,UP,Math.min(1,s/.15));
          if(s>T-.15)pose=mix(UP,CROUCH,(s-(T-.15))/.15*.7);}
        else if(tt<CR+T+.3)pose=mix(CROUCH,STAND_POSE,(tt-CR-T)/.3);
        if(tt<CR+T+.3)all=false;
        o.d.peak[i]=Math.max(o.d.peak[i],h);
      }
      if(o.d.peak[i]>0){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=3;ctx.setLineDash([10,8]);const py=gy-o.d.peak[i]-128;ctx.beginPath();ctx.moveTo(x0+30,py);ctx.lineTo(x0+pw-30,py);ctx.stroke();ctx.restore();}
      ctx.save();ctx.globalAlpha=.2*Math.max(.35,1-h/420);ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(x0+pw*.45,gy+9,58-h*.05,9,0,0,TAU);ctx.fill();ctx.restore();
      astro(ctx,x0+pw*.45,gy-h,1.2,c,pose);
    });
    if(all&&tt>.5){const rp=o.d.peak[1]/Math.max(1,o.d.peak[0]);band(ctx,'같은 힘으로 뛰어도 달에서는 약 '+Math.round(rp)+'배 높이!',W/2,H-34,28);}
    else if(tt<0)band(ctx,'[점프!] 버튼을 눌러 보자',W/2,H-34,28);
  };
};

/* 가상 저울 : 장소와 질량을 바꾸며 무게(용수철저울)와 질량(양팔저울)을 읽는다.  SCL.m(kg), SCL.p(0 지구 · 1 달 · 2 화성) */
const SCL={m:5,p:0,place:[['지구',9.8,CE,TINT_E],['달',9.8/6,CM,TINT_M],['화성',9.8*.38,CP,TINT_P]]};
ANIMS.scale=o=>{
  o.d.ext=0;o.d.last=0;
  o.frame=()=>{const {ctx,W,H,t}=o;const dt=Math.min(.05,t-o.d.last);o.d.last=t;clear(o);
    const [nm,g,col,tint]=SCL.place[SCL.p],wt=SCL.m*g;
    ctx.save();ctx.fillStyle=tint;rr(ctx,10,10,W-20,H-20,18);ctx.fill();ctx.restore();
    txt(ctx,nm,40,52,40,col,'left',900);
    // 용수철저울: 늘어난 길이는 무게에 비례 (1 N ≈ 1.1 px)
    const target=wt*1.1;o.d.ext+=(target-o.d.ext)*Math.min(1,dt*9);
    const cx=W*.27,top=70;const by=springHang(ctx,cx,top,o.d.ext,SCL.m+' kg','#E8BB82');
    gArrow(ctx,cx+96,by+30,by+30+Math.max(8,wt*1.45),CG,9,22);        // 중력 화살표: 물체에 작용하는 중력(=무게)에 비례 — 질량과 장소 모두 반영
    // 읽는 값
    const bx=W*.5;
    ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#D3E2DE';ctx.lineWidth=2;rr(ctx,bx-8,92,W*.45,128,16);ctx.fill();ctx.stroke();ctx.restore();
    txt(ctx,'용수철저울 = 무게',bx+W*.225-8,118,26,SUBC,'center',800);
    txt(ctx,wt.toFixed(1)+' N',bx+W*.225-8,176,64,CG,'center',900);
    // 양팔저울: 어느 장소에서도 균형
    const qx=W*.75,qb=H*.46;                       // qb = 저울대 높이
    ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(qx,qb);ctx.lineTo(qx,qb+160);ctx.stroke();
    ctx.beginPath();ctx.moveTo(qx-52,qb+162);ctx.lineTo(qx+52,qb+162);ctx.stroke();
    ctx.beginPath();ctx.moveTo(qx-150,qb);ctx.lineTo(qx+150,qb);ctx.stroke();
    ctx.lineWidth=3;[-150,150].forEach(dx=>{ctx.beginPath();ctx.moveTo(qx+dx,qb);ctx.lineTo(qx+dx-34,qb+80);ctx.moveTo(qx+dx,qb);ctx.lineTo(qx+dx+34,qb+80);ctx.moveTo(qx+dx-44,qb+80);ctx.lineTo(qx+dx+44,qb+80);ctx.stroke();});
    ctx.restore();
    ctx.fillStyle='#E8BB82';ctx.strokeStyle='#8B5A2B';ctx.lineWidth=4;rr(ctx,qx-150-24,qb+80-44,48,44,8);ctx.fill();ctx.stroke();
    for(let i=0;i<SCL.m;i++){const w=28;ctx.fillStyle='#B7BDC7';ctx.strokeStyle=INK;ctx.lineWidth=2.5;rr(ctx,qx+150-w/2,qb+80-(i+1)*17+2,w,15,4);ctx.fill();ctx.stroke();}
    txt(ctx,'양팔저울 = 질량',qx,qb+205,26,SUBC,'center',800);
    txt(ctx,SCL.m+' kg',qx,qb+260,52,CM,'center',900);
    txt(ctx,'장소가 달라져도 그대로',qx,qb+305,24,SUBC,'center',700);
  };
};

/* 슬라이드. 문장은 data.py 의 B 에서 가져와야 학습지와 빈칸이 일치한다.
   T('…[[정답]]…') → 정답이 .bl(클릭하면 나타나는 빈칸)이 된다. */

/* '해 보기' : ●에서 시작하는 화살표를 끌어서 그린다. 길이는 일정하게 하고 방향만 본다(지도서: 화살표 길이는 고려하지 않는다). 정답 방향과 35° 이내면 맞음 */
function bindScenes(el){
  const svg=el.querySelector('.scn svg');if(!svg)return;
  svg.querySelectorAll('.uarr,.ubadge').forEach(n=>n.remove());
  if(svg._bound)return;svg._bound=true;stopAll(svg);svg.style.touchAction='none';svg.style.cursor='crosshair';
  const dots=[...svg.querySelectorAll('.gdot')],NS='http://www.w3.org/2000/svg';
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  let cur=null;
  const mk=(tag,at)=>{const n=document.createElementNS(NS,tag);Object.keys(at).forEach(k=>n.setAttribute(k,at[k]));return n;};
  const draw=(c,ang)=>{const L=54,x2=c.cx+Math.cos(ang)*L,y2=c.cy+Math.sin(ang)*L,hb=12*.8;
    c.g.innerHTML='';c.g.appendChild(mk('line',{x1:c.cx+Math.cos(ang)*8,y1:c.cy+Math.sin(ang)*8,x2:x2-Math.cos(ang)*hb,y2:y2-Math.sin(ang)*hb,stroke:INK,'stroke-width':5,'stroke-linecap':'round'}));
    const p1=[x2-Math.cos(ang-.45)*12,y2-Math.sin(ang-.45)*12],p2=[x2-Math.cos(ang+.45)*12,y2-Math.sin(ang+.45)*12];
    c.g.appendChild(mk('polygon',{points:`${x2},${y2} ${p1} ${p2}`,fill:INK}));};
  svg.addEventListener('pointerdown',e=>{
    const p=pt(e),i=Math.max(0,Math.min(2,Math.floor(p.x/160))),d=dots[i];if(!d)return;
    svg.querySelectorAll(`[data-i="${i}"].uarr,[data-i="${i}"].ubadge`).forEach(n=>n.remove());
    const g=mk('g',{class:'uarr','data-i':i});svg.appendChild(g);
    cur={i,g,cx:+d.getAttribute('cx'),cy:+d.getAttribute('cy'),ok:+d.getAttribute('data-ang'),ang:null};
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    move(e);});
  const move=e=>{if(!cur)return;const p=pt(e),dx=p.x-cur.cx,dy=p.y-cur.cy;if(Math.hypot(dx,dy)<6)return;cur.ang=Math.atan2(dy,dx);draw(cur,cur.ang);};
  svg.addEventListener('pointermove',move);
  const up=()=>{if(!cur)return;const c=cur;cur=null;if(c.ang==null){c.g.remove();return;}
    let df=Math.abs(c.ang*180/Math.PI-c.ok)%360;if(df>180)df=360-df;const ok=df<=35,x0=c.i*160;
    const b=mk('g',{class:'ubadge','data-i':c.i});
    b.appendChild(mk('rect',{x:x0+10,y:158,width:140,height:24,rx:12,fill:ok?'#1F7A6C':'#F4C33B'}));
    const t=mk('text',{x:x0+80,y:175,'text-anchor':'middle','font-size':12.5,'font-weight':800,fill:ok?'#fff':INK});t.textContent=ok?'맞았어요! 땅(지표면) 쪽':'땅 쪽을 다시 찾아볼까?';b.appendChild(t);svg.appendChild(b);};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}

S({stageNo:1,chip:'또 다른 해 보기',title:'지구 위 어디에서나 같을까?',tocName:'지구 위에 물체 놓기',note:NX('s1'),rows:true,
  body:`<div class="col" style="flex:0 0 520px;gap:16px;justify-content:flex-start">
    <div class="panel glow" style="font-size:31px;line-height:1.55">지구 둘레 아무 곳이나 눌러 물체를 놓아 보자.<br>어느 쪽으로 떨어질까? 화살표는 어디를 향할까?</div>
    <div class="gkinds">${[['ball','공'],['drop','빗방울'],['human','사람']].map(([k,t],i)=>`<button class="cbtn${i?'':' on'}" data-k="${k}">${t}</button>`).join('')}</div>

    <div class="panel" data-qa style="display:none;font-size:28px;line-height:1.55">물체도 지구를 당기고 있다. 중력은 질량이 있는 물체끼리 서로 당기는 힘이다. 다만 지구의 질량이 물체보다 매우 커서 지구는 거의 움직이지 않고 물체만 떨어지는 것처럼 보인다.</div>
  </div><div class="col">${A('globe',700)}</div>`,
  enter(el){
    GLOBE.kind='ball';GLOBE.ext=false;const eb=el.querySelector('[data-ext]');if(eb)eb.classList.remove('on');el.querySelectorAll('.gkinds .cbtn').forEach((b,i)=>b.classList.toggle('on',i===0));
    const qa=el.querySelector('[data-qa]');if(qa)qa.style.display='none';
    if(el._bound)return;el._bound=true;
    el.querySelectorAll('.gkinds,[data-q],[data-ext]').forEach(stopAll);
    el.querySelector('[data-ext]').addEventListener('click',e=>{GLOBE.ext=!GLOBE.ext;e.currentTarget.classList.toggle('on',GLOBE.ext);});
    el.querySelectorAll('.gkinds .cbtn').forEach(b=>b.addEventListener('click',()=>{GLOBE.kind=b.dataset.k;const an=el._a&&el._a.globe;if(an){an.d.items=[];}el.querySelectorAll('.gkinds .cbtn').forEach(x=>x.classList.toggle('on',x===b));}));
    el.querySelector('[data-q]').addEventListener('click',()=>{qa.style.display=qa.style.display==='none'?'block':'none';});
  }});

/* ================= STAGE 2 : 어디에서나 작용할까? =================
   빈칸 1 공기 · 2 천체 · 3 크기 · 4 작용한다 */
TS({stageNo:2,chip:'중력',title:D.STAGES[2],tocName:'중력이 작용하는 곳',anim:'where',max:4,note:NX('s2'),tw:600,
  text:`<div class="panel glow">${LL(B.s2_where)}</div>`});

/* 우리 주변의 중력 현상 — 교사용 지도서의 예(고드름·폭포·추·가구)에 사과·던진 공을 더해 그림으로 보여 준다. 모든 그림에 중력 화살표(주황)가 있다 */
S({stageNo:2,chip:'생각해 보기',title:'우리 주변의 중력 현상 찾기',tocName:'우리 주변의 중력 현상',note:NX('s2'),
  body:`<div class="qnote" style="text-align:center">${D.FIND_Q}</div>
   <div class="tiny" style="text-align:center;font-size:26px">모둠에서 이야기해 본 뒤 눌러서 예시를 확인하자 (주황 화살표 = 중력의 방향)</div>
   <div class="exgrid">${FIG_EXAMPLES.map(e=>`<div class="cd step"><div class="exfig">${e.svg}</div><div class="exnm">${e.name}</div><div class="excap">${e.cap}</div></div>`).join('')}</div>`});

/* ================= STAGE 3 : 무게와 질량 =================
   무게: 빈칸 1 무게 · 2 N */
/* 크기 생각해 보기 — 물이 가득 든 병과 절반 든 병 (천재B '페트병' 활동을 화면에서, 선택 활동) */
const BOT_D='M40 30 h40 q22 14 22 44 v196 q0 20 -20 20 h-44 q-20 0 -20 -20 v-196 q0 -30 22 -44z';
const BOTTLE=(id,y)=>`<svg viewBox="0 0 120 300" width="150" height="375"><defs><clipPath id="${id}"><path d="${BOT_D}"/></clipPath></defs><rect x="46" y="6" width="28" height="22" rx="5" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="${BOT_D}" fill="#fff"/><rect x="0" y="${y}" width="120" height="300" fill="#7EC8E3" opacity=".85" clip-path="url(#${id})"/><path d="${BOT_D}" fill="none" stroke="${INK}" stroke-width="4"/></svg>`;
S({stageNo:3,chip:'크기 생각해 보기',title:'물병에 작용하는 중력의 크기',tocName:'물병과 중력의 크기',note:NX('s3'),rows:true,
  body:`<div class="col" style="flex:0 0 520px;gap:16px;justify-content:flex-start">
    <div class="panel glow" style="font-size:31px;line-height:1.55">물이 가득 든 병과 절반만 든 병을 손에 들었을 때, 어느 쪽이 더 무겁게 느껴질까?<br>두 병에 작용하는 중력을 화살표로 그리면 어떻게 달라질까?</div>
    <button class="cbtn" data-bt style="text-align:left">화살표 그려 보기</button>
    <div class="panel" data-bta style="display:none;font-size:28px;line-height:1.55">물이 많을수록 질량이 크고, 질량이 클수록 작용하는 중력의 크기도 크다. 그래서 가득 든 병의 화살표를 더 길게 그린다.</div>
  </div><div class="col"><div style="display:flex;gap:80px;justify-content:center;align-items:flex-end">
    <div style="text-align:center">${BOTTLE('bf',50)}<svg class="bta" viewBox="0 0 40 150" width="60" height="225" style="visibility:hidden"><line x1="20" y1="4" x2="20" y2="124" stroke="${CG}" stroke-width="7"/><path d="M6 114 L20 146 L34 114z" fill="${CG}"/></svg><div style="font-size:30px;font-weight:800">가득 든 병</div></div>
    <div style="text-align:center">${BOTTLE('bh',165)}<svg class="bta" viewBox="0 0 40 150" width="60" height="225" style="visibility:hidden"><line x1="20" y1="4" x2="20" y2="64" stroke="${CG}" stroke-width="7"/><path d="M6 54 L20 86 L34 54z" fill="${CG}"/></svg><div style="font-size:30px;font-weight:800">절반 든 병</div></div>
  </div></div>`,
  enter(el){
    el.querySelectorAll('.bta').forEach(a=>a.style.visibility='hidden');const qa=el.querySelector('[data-bta]');if(qa)qa.style.display='none';
    if(el._bound)return;el._bound=true;const b=el.querySelector('[data-bt]');stopAll(b);
    b.addEventListener('click',()=>{el.querySelectorAll('.bta').forEach(a=>a.style.visibility='visible');qa.style.display='block';});
  }});

TS({stageNo:3,chip:'무게',title:D.STAGES[3],tocName:'무게',anim:'weight',max:2,note:NX('s3'),tw:640,
  text:`<div class="panel glow">${LL(B.s3_weight)}</div>`});

/* 질량: 빈칸 1 질량 · 2 kg · 3 9.8 · 4 비례 */
TS({stageNo:3,chip:'질량',title:'질량과 무게의 관계',tocName:'질량',anim:'mass',max:4,note:NX('s3'),tw:640,
  text:`<div class="panel glow">${LL(B.s3_mass)}</div>`});

/* 무게와 질량 비교표 — 학습지와 같은 칸(빈칸 4개). '측정 도구' 칸은 그림 위에 이름을 두어, 그림을 보고 이름(빈칸)을 떠올리게 한다 */
const TOOLIMG={'용수철저울':FIG_TOOL_SPRING,'가정용 저울':FIG_TOOL_HOME,'체중계':FIG_TOOL_BODY,'양팔저울':FIG_TOOL_BALANCE,'윗접시저울':FIG_TOOL_TOP};
const toolBox=names=>`<div class="tools">${names.map(n=>{const bl=/^\[\[.*\]\]$/.test(n),nm=n.replace(/^\[\[|\]\]$/g,'');
  return `<div class="tl"><div class="timg">${TOOLIMG[nm]||''}</div><div class="tnm">${bl?T(n):nm}</div></div>`;}).join('')}</div>`;
const toolRow=(a,b)=>`<tr><td class="lbl">측정 도구</td><td>${toolBox(a)}<div class="tiny tcap">가정용 저울·체중계는 무게를 재어 kg으로 바꿔 보여 준다</div></td><td>${toolBox(b)}</td></tr>`;
S({stageNo:3,chip:'비교',title:'무게와 질량 비교하기',tocName:'무게와 질량 비교표',note:NX('s3'),
  body:`<table class="t"><tr><th style="width:18%"></th><th>무게</th><th>질량</th></tr>`+
   D.COMPARE.map(([n,a,b])=>n==='측정 도구'?toolRow(['[[용수철저울]]','가정용 저울','체중계'],['[[양팔저울]]','윗접시저울']):`<tr><td class="lbl">${n}</td><td>${cell(a)}</td><td>${cell(b)}</td></tr>`).join('')+`</table>
   <div class="qnote step" style="text-align:center">같은 물체라도 장소가 달라지면 <b>무게</b>는 달라지지만 <b>질량</b>은 변하지 않는다.</div>`});

/* 카드 분류 — 무게일까, 질량일까? (정답 공개는 한 단계) */
sortSlide({id:'wm',stageNo:3,chip:'카드 분류',title:'무게일까, 질량일까?',tocName:'무게·질량 카드 분류',seed:11,
  left:`<div class="panel" style="padding:18px">${FIG_TOOLS}</div><div class="tiny" style="font-size:26px;text-align:center">용수철저울(왼쪽)과 양팔저울(오른쪽)</div>`,
  bins:{a:['무게',''],b:['질량','']},
  cards:[['물체에 작용하는 중력의 크기','a'],['물질이 가지고 있는 고유한 양','b'],['단위는 N (뉴턴)','a'],['단위는 kg, g','b'],
         ['용수철저울로 측정','a'],['양팔저울로 측정','b'],['장소가 달라지면 달라진다','a'],['장소와 관계없이 일정하다','b']],
  extra:{note:NX('s3')}});

/* 연습 — 지구 표면에서 질량 → 무게 */
S({stageNo:3,chip:'연습',title:'연습해 보기 — 무게는 몇 N일까?',tocName:'질량 → 무게 연습',note:NX('s3'),
  body:`<div class="tiny" style="text-align:center;font-size:27px">지구 표면에서 질량이 1 kg인 물체의 무게는 약 9.8 N이다</div>
   <table class="t"><tr><th style="width:18%">질량</th>${D.PRACTICE.map(([kg])=>`<th>${kg} kg</th>`).join('')}</tr>
   <tr><td class="lbl">무게</td>${D.PRACTICE.map(([kg,n],i)=>`<td>${i===0?n+' N':cell('[['+n+']]')+' N'}</td>`).join('')}</tr></table>
   <div class="qnote step" style="text-align:center">무게 = 질량 × 9.8 N/kg</div>`});

/* ================= STAGE 4 : 지구와 달 =================
   빈칸 1 1/6 · 2 1/6 · 3 같다 */
TS({stageNo:4,chip:'지구와 달',title:D.STAGES[4],tocName:'달에서 무게와 질량',anim:'moon',max:3,note:NX('s4'),tw:600,
  text:`<div class="panel glow">${LL(B.s4_moon)}</div>`});

/* 우주인 표 — 학습지와 같은 칸(빈칸 2개) */
S({stageNo:4,chip:'표',title:'지구와 달의 우주인',tocName:'우주인의 질량과 무게',note:NX('s4'),
  body:`<div class="tiny" style="text-align:center;font-size:27px">우주인의 질량은 60 kg이고, 지구에서의 무게는 588 N이다</div>
   <table class="t"><tr><th style="width:20%">장소</th><th>우주인의 질량</th><th>우주인의 무게</th></tr>`+
   D.MOON.map(([p,m,w])=>`<tr><td class="lbl">${p}</td><td>${cell(m)}</td><td>${cell(w)}</td></tr>`).join('')+`</table>`});

/* 연습 — 학습지의 '연습해 보기'(빈칸 2개) */
S({stageNo:4,chip:'연습',title:'연습해 보기',tocName:'달에서의 무게 계산',note:NX('s4'),
  body:`<div class="panel glow">${LL(B.s4_apply)}</div>
   <div class="qnote step" style="text-align:center">294 N ÷ 6 = 49 N &nbsp;·&nbsp; 294 N ÷ 9.8 N/kg = 30 kg</div>`});

/* 점프 비교 — 같은 힘으로 뛰면 달에서 약 6배 높이 */
S({stageNo:4,chip:'점프 비교',title:'같은 힘으로 뛰면 어디가 더 높이 갈까?',tocName:'달에서 점프하기',note:NX('s4'),
  body:`<div class="tiny" style="text-align:center;font-size:27px">지구에서 뛰는 힘 그대로 달에서 뛰면 어떻게 될까? 먼저 예상해 본 뒤 눌러 보자</div>
   <div class="fig" style="height:520px"><canvas data-a="jump"></canvas></div>
   <div style="text-align:center"><button class="cbtn" data-jump style="font-size:34px;padding:8px 44px">점프!</button></div>`,
  enter(el){const b=el.querySelector('[data-jump]');if(!b||b._bound)return;b._bound=true;stopAll(b);
    b.addEventListener('click',()=>{const a=el._a&&el._a.jump;if(a)a.go();});}});

/* 가상 저울 — 장소와 질량을 바꿔 읽는다 */
S({stageNo:4,chip:'가상 저울',title:'장소를 바꿔 무게와 질량을 읽어 보자',tocName:'가상 저울 실험',note:NX('s4'),rows:true,
  body:`<div class="col" style="flex:0 0 480px;gap:18px;justify-content:flex-start">
    <div class="panel" style="font-size:30px;line-height:1.5">장소와 물체의 질량을 바꾸면 용수철저울이 나타내는 값(무게)과 양팔저울이 나타내는 값(질량)은 어떻게 달라질까?</div>
    <div class="gkinds" data-places>${D_PLACES}</div>
    ${sliderHTML('M','물체의 질량',1,10,1,5,CE,v=>v+' kg')}
    <div class="qnote" style="font-size:28px">달에서 60 kg 우주인의 무게는? 질량을 바꿔 확인해 보자</div>
    <div class="panel" style="font-size:27px;line-height:1.5">윗접시저울이 달에서도 균형을 이루는 까닭은 물체와 추의 질량이 변하지 않기 때문이다.</div>
  </div><div class="col">${A('scale',680)}</div>`,
  enter(el){
    SCL.p=0;SCL.m=5;el.querySelectorAll('[data-places] .cbtn').forEach((b,i)=>b.classList.toggle('on',i===0));
    const r=el.querySelector('[data-sl="M"] input');if(r){r.value=5;el.querySelector('[data-sl="M"] .val').textContent='5 kg';}
    if(el._bound)return;el._bound=true;
    el.querySelectorAll('[data-places]').forEach(stopAll);
    el.querySelectorAll('[data-places] .cbtn').forEach(b=>b.addEventListener('click',()=>{SCL.p=+b.dataset.p;el.querySelectorAll('[data-places] .cbtn').forEach(x=>x.classList.toggle('on',x===b));}));
    bindSlider(el,'M',v=>v+' kg',v=>{SCL.m=v;});
  }});

/* ================= 정리 (빈칸 반복) ================= */
S({review:true,chip:'정리 ①',title:'중력의 방향 · 중력이 작용하는 곳',tocName:'정리 ① 중력',
  body:`<div class="panel">${LL(B.s1_def.concat(B.s1_dir,B.s2_where))}</div>`});
S({review:true,chip:'정리 ②',title:'무게와 질량',tocName:'정리 ② 무게와 질량',
  body:`<div class="panel">${LL(B.s3_weight.concat(B.s3_mass))}</div>`});
S({review:true,chip:'정리 ③',title:'지구와 달에서 비교하기',tocName:'정리 ③ 지구와 달',
  body:`<div class="panel">${LL(B.s4_moon.concat(B.s4_apply))}</div>`});

/* ================= BOSS : 개념 확인 퀘스트 (학습지 Q1~Q5와 같은 문제) ================= */
QSA(1,D.Q1_Q,D.Q1,D.Q1_NOTE,200,null,{note:NX('q')});
QSA(2,D.Q2_Q,D.Q2,D.Q2_NOTE,200,null,{note:NX('q')});
QOX(3,D.Q3_Q,D.Q3,D.Q3_NOTE,{note:NX('q')});
QMC(4,D.Q4_Q,D.Q4_OPTS,D.Q4_ANS-1,D.Q4_NOTE,{note:NX('q')});
QD(5,D.Q5_Q,D.Q5_MODEL,D.Q5_KEYS,null,{note:NX('q')});

/* ================= 마무리 : 스스로 점검 ================= */
S({ch:'E',chName:'마무리',chip:'스스로 점검',title:'오늘 배운 내용을 점검해 봅시다',tocName:'스스로 점검',
  body:`<div class="panel glow">${D.SELF_CHECK.map(t=>`<div class="step" style="font-size:36px;font-weight:700;margin:12px 0">☐ &nbsp;${t}</div>`).join('')}</div>
   <div class="bubbleRow"><img class="mascot" src="${MASCOT_GRAV}" alt="똑이"><div class="bubble">모두 체크했다면 오늘 수업 성공!<br>수고했어요!</div></div>`});

/* 수업 45분 운영 — '선택' 표시는 빈칸·문제가 없는 활동 슬라이드에만 붙인다 (학습지와의 1:1 대응이 깨지지 않는다) */
['지구 위에 물체 놓기','우리 주변의 중력 현상','물병과 중력의 크기','달에서 점프하기','가상 저울 실험'].forEach(n=>{
  const d=SLIDES.find(x=>x.tocName===n);if(d){d.chip=(d.chip||'')+' · 선택';d.tocName=n+' (선택)';}});

/* ---------- 시작 (자동 추가 — 단원 파일에 쓰지 않는다) ---------- */
assignStages();buildDeck();fit();setMode(/self/i.test(location.hash),true);go(0,0);
</script></body></html>
